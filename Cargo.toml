[workspace]
resolver = "2"
members = [
    "crates/aikit-core",
    "crates/aikit-store",
    "crates/aikit-adapters",
    "crates/aikit-tui",
    "crates/aikit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EpiLogos/ai-kit"

[workspace.dependencies]
aikit-core = { path = "crates/aikit-core" }
aikit-store = { path = "crates/aikit-store" }
aikit-adapters = { path = "crates/aikit-adapters" }
aikit-tui = { path = "crates/aikit-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
thiserror = "2"
blake3 = "1"
ulid = "3"
jiff = "0.2"
regex = "1"
walkdir = "2"
sha1 = "0.10"
sha2 = "0.10"
globset = "0.4"
shell-words = "1"
similar = "3"
fs4 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = "0.29"
nucleo-matcher = "0.3"
unicode-width = "0.2"

tempfile = "3"
assert_cmd = "2"
predicates = "3"
insta = "1"

[profile.release]
lto = "thin"
strip = true
