[workspace]
resolver = "2"
members = [
    "crates/aikit-core",
    "crates/aikit-store",
    "crates/aikit-adapters",
    "crates/aikit-tui",
    "crates/aikit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EpiLogos/ai-kit"

[workspace.dependencies]
aikit-core = { path = "crates/aikit-core" }
aikit-store = { path = "crates/aikit-store" }
aikit-adapters = { path = "crates/aikit-adapters" }
aikit-tui = { path = "crates/aikit-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
toml_edit = "0.25"
thiserror = "2"
blake3 = "1"
ulid = "3"
jiff = "0.2"
regex = "1"
walkdir = "2"
sha1 = "0.10"
sha2 = "0.10"
signal-hook = "0.3"
globset = "0.4"
shell-words = "1"
similar = "3"
fs4 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = "0.29"
nucleo-matcher = "0.3"
unicode-width = "0.2"

# Credential providers. `keyring` v1 selects only the native store for each
# target (Keychain / Secret Service / Credential Manager). The fallback crypto
# is used only on Linux when Secret Service is unavailable and the operator
# explicitly chooses encrypted local storage.
keyring = { version = "=4.1.5", default-features = true }
argon2 = "0.5.3"
chacha20poly1305 = "0.11"
getrandom = "0.4.3"
base64 = "0.22.1"
# Sender attestation (#481-8): a relayed Communique's sender claim is signed
# with the relaying gateway's own Ed25519 key, so holding the machine-level
# peer token alone cannot impersonate an agency. The public key rides the
# sender's protocol answer and can be pinned at remote declaration.
ed25519-dalek = { version = "2", features = ["rand_core"] }

tempfile = "3"
assert_cmd = "2"
predicates = "3"
insta = "1"

[profile.release]
lto = "thin"
strip = true