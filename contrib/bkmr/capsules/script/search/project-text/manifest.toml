schema = 1
id = "script/search/project-text"
kind = "script"
name = "bkmr text search"
description = "Full-text and tag search of the bkmr database bound to this context. Offline, no credentials, JSON output. Each search first copies the database, about 30 ms more than bkmr's own search on a 64 KB database."
maturity = "candidate"
tags = ["bkmr", "search", "fts", "offline", "json"]
platforms = ["linux", "macos"]
targets = ["shell", "claude-code", "codex"]

[[requires]]
id = "tool/search/bkmr"
version = ">=6.5.0"
reason = "`search --json` and BKMR_DB_URL both exist from 6.5.0."

# No network and no credentials, on every supported bkmr version. The database
# is outside the project tree, hence read:outside. Measured on 6.5.0:
# `bkmr search --json` leaves the database file byte-identical. From 7.x bkmr
# opens a database it searches for writing (WAL journal mode, migrations, -wal
# and -shm sidecars), so the payload hands bkmr a private copy and never the
# bound database: the database and its sidecars are only read.
#
# The search writes that one private copy, as large as the database with its
# -wal and -journal, in a folder of its own under TMPDIR, and removes it when it
# ends. Each search costs a copy of the database. The effects vocabulary has no
# class for a run's own temporary folder: a write to any scope but project,
# worktree and task reads as write:outside, the elevated class. So the write is
# said here and not declared.
#
# Each run also removes this user's own stale copy folders under TMPDIR: the
# aikit-bkmr-search.* folders more than an hour old, which a run killed
# outright (SIGKILL, as the runner's timeout kills one) could not remove itself.
# Those deletions are said here and not declared, for the same reason.
[effects]
filesystem = ["read:outside"]
network = false
subprocess = true
credentials = []

[script]
entry = "payload/search-text.sh"
interpreter = ["/bin/sh"]
cwd = "project"
mode = "capture"
interactive = false
timeout = "30s"
exports = ["bkmr-text"]

[[args]]
name = "query"
label = "Query"
help = "SQLite FTS query."
type = "string"
position = 1

[[args]]
name = "limit"
label = "Limit"
type = "integer"
flag = "--limit"
default = 10
min = 1
max = 200

[[args]]
name = "tags"
label = "Require all tags"
help = "Comma-separated. System tags start and end with an underscore: _md_, _snip_, _shell_, _mem_."
type = "string"
flag = "--tags"

[[args]]
name = "all"
label = "Search the declared database set"
help = "Needs AIKIT_BKMR_DB_SET, from `also = [...]` in .aikit/project.toml. Never a directory glob."
type = "bool"
flag = "--all"
default = false

[[args]]
name = "raw"
label = "Human-readable output"
help = "bkmr's own rendering instead of JSON."
type = "bool"
flag = "--raw"
default = false

[provenance]
source = "authored"
upstream = "https://github.com/sysid/bkmr"
