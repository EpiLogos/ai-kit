schema = 1
id = "tool/search/bkmr"
kind = "tool"
name = "bkmr"
description = "The bkmr knowledge-base binary: full-text and semantic search over a single SQLite database, bound per context rather than globally."
maturity = "candidate"
tags = ["bkmr", "search", "knowledge-base", "sqlite", "external"]
platforms = ["linux", "macos"]

# The floor is 6.5.0, not 7.0.0, because that is the oldest release on which
# every *offline* capsule here works: `search --json` exists, `create-db`
# exists, and BKMR_DB_URL is honoured. 7.0.0 is nevertheless the version you
# want, and the semantic capsule enforces it separately, because 6.x semantic
# search needs a network round trip and a Gemini API key while 7.x embeds
# locally. See contrib/bkmr/UPGRADE.md.
[tool]
commands = ["bkmr"]
check = ["bkmr", "--version"]
minimum_version = "6.5.0"
install_hint = "script/install/bkmr"

# The database bkmr operates on lives outside the project (by default under
# ~/.config/bkmr), so every use of it reads outside the project tree.
#
# One honest caveat the effect vocabulary cannot express: from 7.1.0 bkmr opens
# its databases in WAL mode, which creates `<db>-wal` and `<db>-shm` beside the
# database even for a pure read. Measured on 6.5.0, `search --json` leaves the
# file byte-identical and creates no sidecars. `write:outside` is not declared
# here because declaring it would mark every search as an elevated action and
# train the user to click through the confirmation that should mean something.
# This capsule's own doctor.sh, and the search capsules, never hand bkmr or
# sqlite3 the bound database: they read a private copy, written to a folder of
# the run's own under TMPDIR and removed when it ends, so for the bound database
# read:outside is exactly true. The vocabulary has no class for that temporary
# write either, so it too is said and not declared.
# The copy is taken again when the database moved while it was copied, told by
# each file's inode, size, time and a checksum of its first 4096 bytes: a
# same-size rewrite past those bytes inside one tick of a coarse clock is not
# seen.
# Each run also removes this user's own stale copy folders under TMPDIR: the
# aikit-bkmr-search.* folders more than an hour old, which a run killed
# outright (SIGKILL, as the runner's timeout kills one) could not remove itself.
# Those deletions are said here and not declared, for the same reason.
[effects]
filesystem = ["read:outside"]
network = false
subprocess = true
credentials = []

[provenance]
source = "authored"
upstream = "https://github.com/sysid/bkmr"
