schema = 1
id = "hook/continuity/wiki-projection"
kind = "hook"
name = "Live Wiki operational projection"
description = "Reread explicitly selected Agent Wiki Markdown projections at session start and each prompt; feedback updates the source, not governance. Absent by default. Configure sources as project: or central: relative addresses. Delivery is not model acknowledgement."
tags = ["aikit", "continuity", "wiki", "feedback"]
[hook]
entry = "payload/wiki-projection"
events = ["SessionStart", "UserPromptSubmit"]
# The payload is a no-op handle: the native engine does the reading. It still
# runs as a chain step, so it must never be able to gate a prompt — a missing
# or unstartable payload is a recorded non-event, not a denial.
phase = "inject"
failure = "open"
timeout = "5s"
