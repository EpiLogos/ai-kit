schema = 1
id = "skill/aikit/central-day-rollover"
kind = "skill"
name = "Central environmental DAY rollover"
description = "METHOD: Open the civil Day and roll every Project NOW field into it with native Central Actions only — `central.time.policy`, `central.day.ensure` under that exact policy revision, `central.world`, then `projectcentral.now.rollover` per Project — run by a Routine's native runner with no model, no task completion, no Return recognition and no reflection."
maturity = "draft"
tags = ["aikit", "routine", "method", "day", "now", "native-method"]

[skill]
root = "payload"

# The body is native: a Routine dispatches it through AIKit's native runner,
# which calls exactly these Central Actions through `ctrl` and never opens a
# model encounter. See crates/aikit-cli/src/routine_native.rs.
[metadata.native-method]
schema = "aikit.native-method/v1"
body = "central-day-rollover"
actions = [
  "central:action/central.time.policy",
  "central:action/central.day.ensure",
  "central:action/central.world",
  "central:action/projectcentral.now.rollover",
]

# central.day.ensure is token-gated: only that one child receives the bound
# credential, and only from a location bound with `aikit routine credential`.
[[metadata.native-method.credentials]]
env = "CENTRAL_NATIVE_TOKEN"
actions = ["central:action/central.day.ensure"]
