# Product Guardian repertoires are declared here as references to native
# owners.  This is set composition, not a second Skill body source or a trust
# grant.  Every body remains at the path in its owner checkout; AIKit remains
# the resolver, and a member's own trust/availability gates still apply.
schema = "aikit.guardian-family/v1"
stewardship = "Each product Guardian stewards only its own native repertoire.  O:I's two-member bootstrap is separate from this family."

[[guardian]]
