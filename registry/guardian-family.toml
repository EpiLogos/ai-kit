semantic_ref = "central:skillset:guardian"
declared_native_sets = ["central-lifecycle", "central-engineering", "central-skills-system"]
stewardship = "Central lifecycle, engineering and skills-system practices remain rooted under EpiLogos/Central and Central #164's own repertoire language."

