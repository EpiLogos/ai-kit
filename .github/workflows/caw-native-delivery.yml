name: CAW native delivery
on:
  pull_request:
    paths:
      - 'crates/**'
      - '.github/workflows/caw-native-delivery.yml'
  push:
    branches: [main, agent/caw-274-277-native-continuation, agent/caw-native-owner-joins]
    paths:
      - 'crates/**'
      - '.github/workflows/caw-native-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caw-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-delivery:
    name: Native Agency delivery and refusal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACTUATION_SHA: 4af495f6509bb0dd779112a225d71a9df8145b6e
      CENTRAL_SHA: 2a604574774c41921003ed99a2eed73b4c9f4266
      WORKCELL_SHA: dd74137b426cbcb1dcb2cb2abc53bd52558dba12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain exact source under test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caw-source"
          git archive --format=tar --prefix=ai-kit/ HEAD | gzip > "$RUNNER_TEMP/caw-source/ai-kit.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/caw-source/revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/caw-source/tree.txt"
          sha256sum "$RUNNER_TEMP/caw-source/ai-kit.tar.gz" > "$RUNNER_TEMP/caw-source/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: caw-native-source-${{ github.sha }}
          path: ${{ runner.temp }}/caw-source
          if-no-files-found: error
          retention-days: 7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
      - name: Install exact native Pi for model selection proof
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/caw-pi" --ignore-scripts --no-audit --no-fund --save-exact '@earendil-works/pi-coding-agent@0.84.4'
          pi_bin="$RUNNER_TEMP/caw-pi/node_modules/.bin/pi"
          test -x "$pi_bin"
          test "$("$pi_bin" --version)" = '0.84.4'
          PI_LOCK="$RUNNER_TEMP/caw-pi/package-lock.json" python3 - <<'PY'
          import json
          import os

          with open(os.environ['PI_LOCK'], encoding='utf-8') as lock_file:
              lock = json.load(lock_file)
          package = lock['packages']['node_modules/@earendil-works/pi-coding-agent']
          assert package['version'] == '0.84.4'
          assert package['integrity'] == 'sha512-jmOlrqUmvhh/siNWFRXjYLJzhKFIHNsAQaysRwzQPQFnPAaV/vhqHsLH/MBsIISA1Rjj7WTUFR3nJrpXoLx39w=='
          PY
          echo "AIKIT_CAW_PI_BIN=$pi_bin" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Actuation
          ref: 4af495f6509bb0dd779112a225d71a9df8145b6e
          path: .caw-native/Actuation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: 2a604574774c41921003ed99a2eed73b4c9f4266
          path: .caw-native/Central
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Workcell
          ref: dd74137b426cbcb1dcb2cb2abc53bd52558dba12
          path: .caw-native/Workcell
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> target
            .caw-native/Central -> target
            .caw-native/Workcell -> target
            .caw-native/Actuation -> target
      - name: Build the native placement and material owners
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path .caw-native/Actuation/Cargo.toml -p actuation-cli
          cargo build --locked --manifest-path .caw-native/Central/Cargo.toml -p ctrl
          cargo build --locked --manifest-path .caw-native/Workcell/Cargo.toml -p epilogos-workcell-cli --bins
          test -x "$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell"
          test -x "$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-control-service"
          test -x "$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-write-boundary"
          echo "AIKIT_CAW_CTRL_BIN=$GITHUB_WORKSPACE/.caw-native/Central/target/debug/ctrl" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_WORKCELL_BIN=$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_WORKCELL_SERVICE_BIN=$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-control-service" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_WORKCELL_BOUNDARY_BIN=$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-write-boundary" >> "$GITHUB_ENV"
      - name: Record exact native basis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .caw-native/Actuation rev-parse HEAD)" = "$ACTUATION_SHA"
          test "$(git -C .caw-native/Central rev-parse HEAD)" = "$CENTRAL_SHA"
          test "$(git -C .caw-native/Workcell rev-parse HEAD)" = "$WORKCELL_SHA"
          test -x "$GITHUB_WORKSPACE/.caw-native/Actuation/target/release/actuation"
          # The material workcell bindings (full CLI, control service, write
          # boundary) stay owned by the build step above; this basis step names
          # only what it verifies. AIKIT_CAW_WORKCELL_BIN must remain the full
          # `workcell` CLI — the material status/prepare/inspect/observe client.
          {
            echo "AIKIT_CAW_ACTUATION_BIN=$GITHUB_WORKSPACE/.caw-native/Actuation/target/release/actuation"
            echo "AIKIT_CAW_CENTRAL_BIN=$GITHUB_WORKSPACE/.caw-native/Central/target/debug/ctrl"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/caw-evidence"
          mkdir -p "$RUNNER_TEMP/caw-evidence/native-npm"
          {
            echo "AIKIT_CAW_NPM_BIN=$(command -v npm)"
            echo "AIKIT_CAW_NPX_BIN=$(command -v npx)"
            echo "AIKIT_CAW_NATIVE_NPM_EVIDENCE_DIR=$RUNNER_TEMP/caw-evidence/native-npm"
          } >> "$GITHUB_ENV"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/caw-evidence/aikit-source.tar.gz"
          {
            echo "AIKit=$(git rev-parse HEAD)"
            echo "Actuation=$ACTUATION_SHA"
            echo "Central=$CENTRAL_SHA"
            echo "Workcell=$WORKCELL_SHA"
            rustc -Vv
            node --version
            "$AIKIT_CAW_PI_BIN" --version
            sha256sum "$(realpath "$AIKIT_CAW_PI_BIN")"
            python3 --version
            echo 'Standing=accepted cut revisions pinned per product; actual Pi opens without inference; controlled native providers are not installed or real-model proof.'
            echo 'FIXTURE_REPLY is not a real model response or installed-harness proof.'
          } > "$RUNNER_TEMP/caw-evidence/basis.txt"
      - name: Bind exact compiled Task and material-owner images
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          # Parent must bind BOTH existing Workcell pins to its actual normal publication.
          # The old owner does not implement this Source relation; it cannot qualify it.
          test "$WORKCELL_SHA" != '282220b59e8554faafcdcad335bf450acc4a9352'
          test "$(git -C .caw-native/Workcell rev-parse HEAD)" = "$WORKCELL_SHA"
          test -f .caw-native/Workcell/crates/workcell-runtime/src/runtime_projection.rs
          test -f .caw-native/Workcell/crates/workcell-runtime/tests/runtime_projection.rs
          export RUNTIME_GATE_EVIDENCE="$RUNNER_TEMP/caw-evidence/runtime-projection"
          mkdir -p "$RUNTIME_GATE_EVIDENCE/images"
          for product in Workcell Central Actuation; do
            git -C ".caw-native/$product" archive --format=tar.gz HEAD > "$RUNTIME_GATE_EVIDENCE/$product-source.tar.gz"
            git -C ".caw-native/$product" rev-parse HEAD^{tree} > "$RUNTIME_GATE_EVIDENCE/$product-tree.txt"
            git -C ".caw-native/$product" ls-files --stage > "$RUNTIME_GATE_EVIDENCE/$product-modes.txt"
            cp ".caw-native/$product/Cargo.lock" "$RUNTIME_GATE_EVIDENCE/$product-Cargo.lock"
          done
          cp Cargo.lock "$RUNTIME_GATE_EVIDENCE/AIKit-Cargo.lock"
          git rev-parse HEAD^{tree} > "$RUNTIME_GATE_EVIDENCE/AIKit-tree.txt"
          git ls-files --stage > "$RUNTIME_GATE_EVIDENCE/AIKit-modes.txt"
          sha256sum Cargo.lock crates/aikit-cli/Cargo.toml crates/aikit-cli/src/encounter_task.rs crates/aikit-cli/tests/caw_task_dispatch.rs crates/aikit-cli/tests/support/caw_task_npm_runtime.rs > "$RUNTIME_GATE_EVIDENCE/AIKit-source-sha256.txt"
          sha256sum .caw-native/Workcell/crates/workcell-runtime/src/runtime_projection.rs .caw-native/Workcell/crates/workcell-runtime/tests/runtime_projection.rs > "$RUNTIME_GATE_EVIDENCE/Workcell-runtime-source-sha256.txt"
          # Compiler failure precedes audit.py and image admission. Capture only
          # the same fixed build-environment fields before the first command.
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          names = ['RUSTFLAGS','RUSTC_WRAPPER','CARGO_TARGET_DIR','CARGO_BUILD_TARGET','CI','GITHUB_RUN_ID','GITHUB_REPOSITORY','GITHUB_SHA']
          (Path(os.environ['RUNTIME_GATE_EVIDENCE'])/'build-environment.json').write_text(
              json.dumps({name:os.environ.get(name) for name in names},indent=2)+'\n')
          PY
          record_command() {
            local label=$1 suffix=$2 status
            shift 2
            printf '%q ' "$@" > "$RUNTIME_GATE_EVIDENCE/$label.command.txt"
            printf '\n' >> "$RUNTIME_GATE_EVIDENCE/$label.command.txt"
            set +e
            "$@" > "$RUNTIME_GATE_EVIDENCE/$label.$suffix" 2> "$RUNTIME_GATE_EVIDENCE/$label.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$RUNTIME_GATE_EVIDENCE/$label.exit"
            if test "$status" -ne 0; then
              printf 'Actual compiler command %s failed with exit %s; raw receipts remain unqualified.\n' "$label" "$status" >&2 || :
              head -c 65536 "$RUNTIME_GATE_EVIDENCE/$label.stderr" >&2 || :
            fi
            return "$status"
          }
          # Retain the genuine account regression image without running an
          # account body. The following default compile remains final so its
          # normal aikit/aikit-session-space binaries stay credential-free.
          record_command compiler-account-test jsonl timeout --kill-after=5s 10m cargo test --locked -p aikit-cli --features codex-account-native --test caw_task_dispatch --no-run --message-format=json
          record_command compiler-test jsonl timeout --kill-after=5s 10m cargo test --locked -p aikit-cli --test caw_task_dispatch --no-run --message-format=json
          record_command compiler-workcell jsonl timeout --kill-after=5s 5m cargo build --locked --manifest-path .caw-native/Workcell/Cargo.toml -p epilogos-workcell-cli --bins --message-format=json
          record_command compiler-central jsonl timeout --kill-after=5s 5m cargo build --locked --manifest-path .caw-native/Central/Cargo.toml -p ctrl --message-format=json
          record_command compiler-actuation jsonl timeout --kill-after=5s 5m cargo build --locked --release --manifest-path .caw-native/Actuation/Cargo.toml -p actuation-cli --message-format=json
          cat > "$RUNTIME_GATE_EVIDENCE/audit.py" <<'PY'
          import hashlib,json,os,re,stat,sys
          from pathlib import Path
          out=Path(os.environ['RUNTIME_GATE_EVIDENCE'])
          def write(name,value):
              (out/name).write_text(json.dumps(value,indent=2)+'\n')
          def facts(s):
              return dict(device=s.st_dev,inode=s.st_ino,mode=s.st_mode,links=s.st_nlink,
                          uid=s.st_uid,gid=s.st_gid,bytes=s.st_size,mtime_ns=s.st_mtime_ns,ctime_ns=s.st_ctime_ns)
          def held(path,root,copy=None,limit=1073741824):
              p=Path(path); row={'path':str(p),'sha256':None,'cause':None}
              try:
                  row['named_before']=facts(os.lstat(p))
                  if not p.is_absolute() or not p.is_relative_to(root) or p.resolve(strict=True)!=p:
                      raise ValueError('image/source coordinate is outside the exact admitted physical root')
                  fd=os.open(p,os.O_RDONLY|os.O_NONBLOCK|os.O_NOFOLLOW|os.O_CLOEXEC)
                  with os.fdopen(fd,'rb') as f:
                      first=os.fstat(f.fileno());row['held_before']=facts(first)
                      if not stat.S_ISREG(first.st_mode) or first.st_uid!=os.geteuid() or first.st_size>limit:
                          raise ValueError('nonregular/foreign-owner/over-capacity original; no byte read admitted')
                      digest=hashlib.sha256();observed=0;prefix=b''
                      sink=None
                      if copy is not None:
                          sink=os.fdopen(os.open(copy,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o700),'wb')
                      try:
                          while chunk:=f.read(1048576):
                              if not prefix:prefix=chunk[:64]
                              observed+=len(chunk)
                              if observed>limit:raise ValueError('held image exceeded admitted capacity')
                              digest.update(chunk)
                              if sink:sink.write(chunk)
                          if sink:sink.flush()
                      finally:
                          if sink:sink.close()
                      row['held_after']=facts(os.fstat(f.fileno()));row['named_after']=facts(os.lstat(p))
                      if row['held_before']!=row['held_after'] or row['held_before']!=row['named_before'] or row['held_after']!=row['named_after']:
                          raise ValueError('held/named original basis changed; digest unavailable')
                      row['sha256']=digest.hexdigest();row['observed_bytes']=observed;row['header_hex']=prefix.hex()
                      if copy is not None:
                          s=os.lstat(copy);row['private_copy']=dict(path=str(copy),metadata=facts(s))
                          if not stat.S_ISREG(s.st_mode) or s.st_nlink!=1:
                              raise ValueError('private evidence copy must be regular single-link')
                  row['digest_standing']='bounded unchanged held regular original; native original link count is observed, not presumed one'
              except (OSError,ValueError) as e:
                  row['sha256']=None
                  row['cause']={'type':type(e).__name__,'errno':getattr(e,'errno',None),'message':str(e)}
              return row
          def case_prefix(case):
              expected=json.loads(os.environ['RUNTIME_GATE_CASES'])
              if case not in expected or not re.fullmatch(r'[A-Za-z0-9_]+(?:::[A-Za-z0-9_]+)*',case):
                  raise ValueError('unselected or malformed native case label')
              prefix='case-'+case.replace('::','--')
              if not re.fullmatch(r'[A-Za-z0-9_-]+',prefix):
                  raise ValueError('native case evidence prefix is not portable')
              return prefix
          def case_paths(case):
              prefix=case_prefix(case)
              return {'case':case,'prefix':prefix,'stdout':prefix+'.stdout','stderr':prefix+'.stderr',
                      'exit':prefix+'.exit','result':prefix+'.result.json'}
          def artifacts(file):
              used=0;result=[]
              with Path(file).open('rb') as stream:
                  for raw in stream:
                      used+=len(raw)
                      if used>67108864 or len(raw)>1048576:raise ValueError('compiler receipt capacity exceeded')
                      item=json.loads(raw)
                      if item.get('reason')=='compiler-artifact':result.append(item)
              return result
          mode=sys.argv[1]
          if mode=='prepare':
              roles=json.loads(os.environ['RUNTIME_GATE_ROLES'])
              records=[];total=0
              for role in roles:
                  rows=[r for r in artifacts(out/role['receipt']) if r['target']['name']==role['target'] and r.get('executable')]
                  if len(rows)!=1:raise ValueError('exactly one actual CompilerArtifact is required for '+role['name'])
                  artifact=rows[0];root=Path(role['root']);image=Path(artifact['executable'])
                  row={'role':role,'compiler_artifact':artifact,'image':held(image,root/'target'/role.get('profile_dir','debug'),out/'images'/role['name'],min(1073741824,3221225472-total))}
                  # Safe physical digest precedes semantic role/profile/source checks.
                  records.append(row);write('images.before.json',records)
                  if row['image']['cause']:raise ValueError('original image admission failed; native cause retained')
                  if not row['image']['header_hex'].startswith('7f454c46') or not row['image']['held_before']['mode']&0o111:
                      raise ValueError('selected Linux native image is not an executable ELF')
                  total+=row['image']['observed_bytes']
                  if total>3221225472:raise ValueError('aggregate copied image capacity exceeded')
                  if role['kind'] not in artifact['target']['kind'] or artifact['profile']['test']!=role['test']:
                      raise ValueError('actual Cargo target/profile differs from selected native role')
                  account_role=role['name']=='caw-account-test'
                  if account_role:
                      if role.get('compile_only') is not True or role['receipt']!='compiler-account-test.jsonl' or role['target']!='caw_task_dispatch' or role['kind']!='test' or role['test'] is not True or role.get('profile_dir')!='debug':
                          raise ValueError('account feature is admitted only for the exact compile-only regression role')
                      if 'codex-account-native' not in artifact.get('features',[]):
                          raise ValueError('actual account regression CompilerArtifact lacks required feature')
                  else:
                      if role.get('compile_only'):raise ValueError('only the exact account regression role is compile-only')
                      if 'codex-account-native' in artifact.get('features',[]):raise ValueError('credential-free gate cannot select account feature')
                  src=Path(artifact['target']['src_path']);manifest=Path(artifact['manifest_path'])
                  row['source']=held(src,root);row['manifest']=held(manifest,root)
                  write('images.before.json',records)
                  if row['source']['cause'] or row['manifest']['cause']:raise ValueError('actual compiled source/manifest unavailable')
                  if account_role:
                      (out/'account-test-image.path').write_text(str(image)+'\n')
                  elif role['test']:
                      (out/'test-image.path').write_text(str(image)+'\n')
              write('images.before.json',records)
              archive_rows=[]
              for path in json.loads(os.environ['RUNTIME_GATE_SOURCE_ARCHIVES']):
                  archive_rows.append(held(path,Path(path).parent))
                  write('source-archives.json',archive_rows)
                  if archive_rows[-1]['cause']:raise ValueError('actual source archive digest unavailable')
              write('build-environment.json',{name:os.environ.get(name) for name in ['RUSTFLAGS','RUSTC_WRAPPER','CARGO_TARGET_DIR','CARGO_BUILD_TARGET','CI','GITHUB_RUN_ID','GITHUB_REPOSITORY','GITHUB_SHA']})
          elif mode=='after':
              before=json.loads((out/'images.before.json').read_text());rows=[];failed=False
              for row in before:
                  now=held(row['image']['path'],Path(row['role']['root'])/'target'/row['role'].get('profile_dir','debug'))
                  same=now['sha256']==row['image']['sha256'] and now.get('held_before')==row['image'].get('held_before')
                  rows.append({'role':row['role'],'image':now,'same_before_basis':same});failed|=not same
              write('images.after.json',rows)
              if failed:raise ValueError('selected original image basis changed across actual cases')
          elif mode in ('account-census','encounter-account-census','selected-release-account-census','full-handoff-account-census'):
              case, prefix = {
                  'account-census': ('npm_runtime::actual_codex_task_acp_session_creation_and_reentry_keep_thread_locks_in_task_t','account-regression'),
                  'encounter-account-census': ('npm_runtime::actual_codex_encounter_selected_model_survives_status_read_and_warm_open','encounter-account-regression'),
                  'selected-release-account-census': ('npm_runtime::actual_codex_task_successor_after_selected_release_preserves_task_cow','selected-release-account-regression'),
                  'full-handoff-account-census': ('npm_runtime::actual_codex_task_successor_after_full_owner_handoff_preserves_task_cow','full-handoff-account-regression'),
              }[mode]
              rows=json.loads((out/'images.before.json').read_text())
              selected=[row for row in rows if row['role']['name']=='caw-account-test']
              if len(selected)!=1 or selected[0]['image']['cause'] or selected[0]['role'].get('compile_only') is not True:
                  raise ValueError('actual compile-only account image custody is unavailable or ambiguous')
              with (out/(prefix+'-list.stdout')).open('rb') as stream:
                  raw=stream.read(1048577)
              if len(raw)>1048576:raise ValueError('account list receipt exceeds one MiB')
              names=[line[:-6] for line in raw.decode('utf-8').splitlines() if line.endswith(': test')]
              status=int((out/(prefix+'-list.exit')).read_text())
              row={'case':case,'actual_listed':names,'compiled_selected_total':len(names),
                   'required_exact_selected_total':1,'actual_list_status':status,
                   'role':selected[0]['role'],'compiler_receipt':'compiler-account-test.jsonl',
                   'image':selected[0]['image'],'list_command_receipt':prefix+'-list.command.txt',
                   'list_stdout':prefix+'-list.stdout','list_stderr':prefix+'-list.stderr',
                   'outer_timeout_seconds':30,'executed_total':0,'pass_credit':0,
                   'qualification':'NOT_EXECUTED_UNQUALIFIED',
                   'reason':'ignored list-only census does not run the real account body; no hosted auth/cloud/model qualification'}
              write(prefix+'-census.json',row)
              if status!=0 or names!=[case]:raise ValueError('exact genuine ignored account definition is missing or duplicated; no zero-case success')
          elif mode=='roster':
              expected=json.loads(os.environ['RUNTIME_GATE_CASES'])
              names=[line[:-6] for line in (out/'roster.stdout').read_text().splitlines() if line.endswith(': test')]
              write('roster.json',{'actual':names,'required_selected':expected,'actual_total':len(names),'required_selected_total':len(expected)})
              if len(names)!=len(set(names)) or not set(expected).issubset(names):raise ValueError('missing/duplicate compiled case')
              required_roster=json.loads(os.environ['RUNTIME_GATE_EXPECTED_ROSTER'])
              if len(required_roster)!=len(set(required_roster)) or sorted(names)!=sorted(required_roster):raise ValueError('compiled names differ from the complete Source-backed Task roster')
              if len(names)!=int(os.environ['RUNTIME_GATE_TOTAL']):raise ValueError('compiled case census changed')
              paths=[case_paths(case) for case in expected]
              if len({row['prefix'] for row in paths})!=len(paths):raise ValueError('native case evidence prefix collision')
              write('case-paths.json',{'actual_selected':paths,'labels_unchanged':True,'standing':'portable evidence coordinates only; exact native case identity/argv unchanged'})
          elif mode=='case-prefix':
              print(case_prefix(sys.argv[2]))
          elif mode=='case':
              case=sys.argv[2];paths=case_paths(case);code=int((out/paths['exit']).read_text())
              body=(out/paths['stdout']).read_text()
              ok=code==0 and any(line.startswith('test result: ok. 1 passed; 0 failed; 0 ignored;') for line in body.splitlines())
              row={'case':case,'exit_status':code,'exact_one_pass_zero_failed_ignored':ok,'evidence_prefix':paths['prefix'],'stdout':str(out/paths['stdout']),'stderr':str(out/paths['stderr']),'exit_file':str(out/paths['exit']),'test_image':(out/'test-image.path').read_text().strip(),'outer_timeout_seconds':120,'standing':'foreground test-harness status/raw files; inner native EOF and retirement are asserted by the actual case, not inferred from a shell status'}
              write(paths['result'],row)
              if not ok:raise ValueError('actual selected native case failed; no unsupported-kernel skip')
          elif mode=='upload':
              base=out.parent;pending=[base];rows=[];count=0
              while pending:
                  directory=pending.pop()
                  for path in sorted(directory.iterdir()):
                      count+=1
                      if count>4096:raise ValueError('portable evidence entry capacity exceeded')
                      relative=path.relative_to(base);name=path.name;s=os.lstat(path)
                      row={'relative':str(relative),'metadata':facts(s),'admitted':False}
                      rows.append(row)
                      if any(ord(c)<32 or c in '\"<>:|?*\\' for c in name) or name.endswith((' ','.')):
                          write('upload-admission.json',{'entries':rows,'complete':False})
                          raise ValueError('retained evidence name is not portable: '+str(relative))
                      if stat.S_ISDIR(s.st_mode):pending.append(path)
                      elif not stat.S_ISREG(s.st_mode):
