name: CAW native delivery
on:
  pull_request:
    paths:
      - 'crates/**'
      - '.github/workflows/caw-native-delivery.yml'
  push:
    branches: [main, agent/caw-274-277-native-continuation]
    paths:
      - 'crates/**'
      - '.github/workflows/caw-native-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caw-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-delivery:
    name: Native Agency delivery and refusal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACTUATION_SHA: 0ac4bbb47cc37a7ac3c1db42b88a39ffd6bb5b30
      CENTRAL_SHA: b3837ee55d95037016cfb873713cbb7c644d6b27
      WORKCELL_SHA: dcac0a26f9c0f01d6b6b4dd2486566161ab9bf6f
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Actuation
          ref: 0ac4bbb47cc37a7ac3c1db42b88a39ffd6bb5b30
          path: .caw-native/Actuation
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: b3837ee55d95037016cfb873713cbb7c644d6b27
          path: .caw-native/Central
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Workcell
          ref: dcac0a26f9c0f01d6b6b4dd2486566161ab9bf6f
          path: .caw-native/Workcell
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> target
            .caw-native/Central -> target
            .caw-native/Workcell -> target
      - name: Record exact native basis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .caw-native/Actuation rev-parse HEAD)" = "$ACTUATION_SHA"
          test "$(git -C .caw-native/Central rev-parse HEAD)" = "$CENTRAL_SHA"
          test "$(git -C .caw-native/Workcell rev-parse HEAD)" = "$WORKCELL_SHA"
          test -x "$GITHUB_WORKSPACE/.caw-native/Actuation/bin/actuation"
          echo "AIKIT_CAW_ACTUATION_BIN=$GITHUB_WORKSPACE/.caw-native/Actuation/bin/actuation" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/caw-evidence"
          git archive HEAD | gzip > "$RUNNER_TEMP/caw-evidence/aikit-source.tar.gz"
          {
            echo "AIKit=$(git rev-parse HEAD)"
            echo "AIKitHead=${{ github.event.pull_request.head.sha }}"
            echo "Actuation=$ACTUATION_SHA"
            echo "Central=$CENTRAL_SHA"
            echo "Workcell=$WORKCELL_SHA"
            rustc -Vv
            node --version
            python3 --version
            echo 'Standing=explicitly pinned candidate cut, not accepted main.'
            echo 'Source-built native binaries with controlled ACP/Pi process fixtures.'
            echo 'FIXTURE_REPLY is not a real model response or installed-harness proof.'
          } > "$RUNNER_TEMP/caw-evidence/basis.txt"
      - name: Build actual placement and material owners
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo build --locked --manifest-path .caw-native/Central/Cargo.toml -p ctrl
            cargo build --locked --manifest-path .caw-native/Workcell/Cargo.toml -p epilogos-workcell-cli --bin workcell-write-boundary
          } 2>&1 | tee "$RUNNER_TEMP/caw-evidence/owners-build.log"
          echo "AIKIT_CAW_CTRL_BIN=$GITHUB_WORKSPACE/.caw-native/Central/target/debug/ctrl" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_BOUNDARY_BIN=$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-write-boundary" >> "$GITHUB_ENV"
      - name: Actual binaries through native Actuation and controlled provider processes
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-cli --test caw_native_delivery -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/native.log"
      - name: Joined placement and required material protocol execution
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-cli --test caw_native_placement -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/joined-placement.log"
          grep -q CAW_JOINED_PLACEMENT_EXECUTED "$RUNNER_TEMP/caw-evidence/joined-placement.log"
      - name: Receipt, admission, ACP, placement, recurrence and duplicate regressions
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test --locked -p aikit-adapters --test caw_realisation --test caw_enforcement --test model_realisation_end_to_end --test central_entities --test agent_connection_v2 --test agent_session_host_v2
            cargo test --locked -p aikit-core --test caw_recurrence --test caw_route_eligibility
            cargo test --locked -p aikit-store --test caw_delivery
          } 2>&1 | tee "$RUNNER_TEMP/caw-evidence/focused.log"
      - name: Retain explicitly built product binaries and digests
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p aikit-cli --bin aikit-work-prepare --bin aikit-session-space 2>&1 | tee "$RUNNER_TEMP/caw-evidence/aikit-build.log"
          cp target/debug/aikit-work-prepare target/debug/aikit-session-space "$RUNNER_TEMP/caw-evidence/"
          cp "$AIKIT_CAW_CTRL_BIN" "$AIKIT_CAW_BOUNDARY_BIN" "$RUNNER_TEMP/caw-evidence/"
          (cd "$RUNNER_TEMP/caw-evidence" && sha256sum aikit-work-prepare aikit-session-space ctrl workcell-write-boundary > binaries.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caw-native-delivery-${{ github.sha }}
          path: ${{ runner.temp }}/caw-evidence
          if-no-files-found: error
          retention-days: 7
