name: CAW native delivery
on:
  pull_request:
    paths:
      - 'crates/**'
      - '.github/workflows/caw-native-delivery.yml'
  push:
    branches: [main, agent/caw-274-277-native-continuation, agent/caw-native-owner-joins]
    paths:
      - 'crates/**'
      - '.github/workflows/caw-native-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caw-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-delivery:
    name: Native Agency delivery and refusal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACTUATION_SHA: 4af495f6509bb0dd779112a225d71a9df8145b6e
      CENTRAL_SHA: 2a604574774c41921003ed99a2eed73b4c9f4266
      WORKCELL_SHA: 282220b59e8554faafcdcad335bf450acc4a9352
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain exact source under test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caw-source"
          git archive --format=tar --prefix=ai-kit/ HEAD | gzip > "$RUNNER_TEMP/caw-source/ai-kit.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/caw-source/revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/caw-source/tree.txt"
          sha256sum "$RUNNER_TEMP/caw-source/ai-kit.tar.gz" > "$RUNNER_TEMP/caw-source/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: caw-native-source-${{ github.sha }}
          path: ${{ runner.temp }}/caw-source
          if-no-files-found: error
          retention-days: 7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
      - name: Install exact native Pi for model selection proof
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/caw-pi" --ignore-scripts --no-audit --no-fund --save-exact '@earendil-works/pi-coding-agent@0.84.4'
          pi_bin="$RUNNER_TEMP/caw-pi/node_modules/.bin/pi"
          test -x "$pi_bin"
          test "$("$pi_bin" --version)" = '0.84.4'
          PI_LOCK="$RUNNER_TEMP/caw-pi/package-lock.json" python3 - <<'PY'
          import json
          import os

          with open(os.environ['PI_LOCK'], encoding='utf-8') as lock_file:
              lock = json.load(lock_file)
          package = lock['packages']['node_modules/@earendil-works/pi-coding-agent']
          assert package['version'] == '0.84.4'
          assert package['integrity'] == 'sha512-jmOlrqUmvhh/siNWFRXjYLJzhKFIHNsAQaysRwzQPQFnPAaV/vhqHsLH/MBsIISA1Rjj7WTUFR3nJrpXoLx39w=='
          PY
          echo "AIKIT_CAW_PI_BIN=$pi_bin" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Actuation
          ref: 4af495f6509bb0dd779112a225d71a9df8145b6e
          path: .caw-native/Actuation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: 2a604574774c41921003ed99a2eed73b4c9f4266
          path: .caw-native/Central
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Workcell
          ref: 282220b59e8554faafcdcad335bf450acc4a9352
          path: .caw-native/Workcell
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> target
            .caw-native/Central -> target
            .caw-native/Workcell -> target
            .caw-native/Actuation -> target
      - name: Build the native placement and material owners
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path .caw-native/Actuation/Cargo.toml -p actuation-cli
          cargo build --locked --manifest-path .caw-native/Central/Cargo.toml -p ctrl
          cargo build --locked --manifest-path .caw-native/Workcell/Cargo.toml -p epilogos-workcell-cli --bins
          test -x "$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell"
          test -x "$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-control-service"
          test -x "$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-write-boundary"
          echo "AIKIT_CAW_CTRL_BIN=$GITHUB_WORKSPACE/.caw-native/Central/target/debug/ctrl" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_WORKCELL_BIN=$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_WORKCELL_SERVICE_BIN=$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-control-service" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_WORKCELL_BOUNDARY_BIN=$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-write-boundary" >> "$GITHUB_ENV"
      - name: Record exact native basis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .caw-native/Actuation rev-parse HEAD)" = "$ACTUATION_SHA"
          test "$(git -C .caw-native/Central rev-parse HEAD)" = "$CENTRAL_SHA"
          test "$(git -C .caw-native/Workcell rev-parse HEAD)" = "$WORKCELL_SHA"
          test -x "$GITHUB_WORKSPACE/.caw-native/Actuation/target/release/actuation"
          # The material workcell bindings (full CLI, control service, write
          # boundary) stay owned by the build step above; this basis step names
          # only what it verifies. AIKIT_CAW_WORKCELL_BIN must remain the full
          # `workcell` CLI — the material status/prepare/inspect/observe client.
          {
            echo "AIKIT_CAW_ACTUATION_BIN=$GITHUB_WORKSPACE/.caw-native/Actuation/target/release/actuation"
            echo "AIKIT_CAW_CENTRAL_BIN=$GITHUB_WORKSPACE/.caw-native/Central/target/debug/ctrl"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/caw-evidence"
          mkdir -p "$RUNNER_TEMP/caw-evidence/native-npm"
          {
            echo "AIKIT_CAW_NPM_BIN=$(command -v npm)"
            echo "AIKIT_CAW_NPX_BIN=$(command -v npx)"
            echo "AIKIT_CAW_NATIVE_NPM_EVIDENCE_DIR=$RUNNER_TEMP/caw-evidence/native-npm"
          } >> "$GITHUB_ENV"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/caw-evidence/aikit-source.tar.gz"
          {
            echo "AIKit=$(git rev-parse HEAD)"
            echo "Actuation=$ACTUATION_SHA"
            echo "Central=$CENTRAL_SHA"
            echo "Workcell=$WORKCELL_SHA"
            rustc -Vv
            node --version
            "$AIKIT_CAW_PI_BIN" --version
            sha256sum "$(realpath "$AIKIT_CAW_PI_BIN")"
            python3 --version
            echo 'Standing=accepted cut revisions pinned per product; actual Pi opens without inference; controlled native providers are not installed or real-model proof.'
            echo 'FIXTURE_REPLY is not a real model response or installed-harness proof.'
          } > "$RUNNER_TEMP/caw-evidence/basis.txt"
      - name: Actual binaries through native Actuation and controlled provider processes
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-cli --test caw_native_delivery -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/native.log"
          grep -q MODEL_SELECTED_NATIVE_RESPONSE_EXECUTED "$RUNNER_TEMP/caw-evidence/native.log"
          grep -q MODEL_APPLICATION_NATIVE_CONNECTION_EXECUTED "$RUNNER_TEMP/caw-evidence/native.log"
          grep -q MODEL_COMPOSE_NATIVE_CONNECTION_EXECUTED "$RUNNER_TEMP/caw-evidence/native.log"
          grep -q ACTUAL_PI_FACTORY_SELECTION_EMITTED_WITHOUT_INFERENCE "$RUNNER_TEMP/caw-evidence/native.log"
      - name: Native Central allocation to Workcell protection preparation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-adapters --test caw_native_placement -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/placement.log"
      - name: Actual task-bound resident protocol and dispatch
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-cli --test caw_task_dispatch -- --ignored --skip npm_runtime:: --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/task-dispatch.log"
          grep -q TASK_NATIVE_PROTECTED_DISPATCH_EXECUTED "$RUNNER_TEMP/caw-evidence/task-dispatch.log"
          grep -q TASK_NATIVE_PERSISTENT_STORAGE_EXECUTED "$RUNNER_TEMP/caw-evidence/task-dispatch.log"
          grep -q TASK_NATIVE_WORKCELL_HOSTED_ENCOUNTER_EXECUTED "$RUNNER_TEMP/caw-evidence/task-dispatch.log"
      - name: Actual Task cache boundary and public ACP help without credentials
        shell: bash
        run: |
          set -euo pipefail
          timeout 10m cargo test --locked -p aikit-cli --test caw_task_dispatch npm_runtime::native_workcell_scrubbed_npm_writes_cache_only_inside_actual_task_t -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/native-npm-boundary.log"
          timeout 10m cargo test --locked -p aikit-cli --test caw_task_dispatch npm_runtime::native_codex_task_exec_refuses_redirected_runtime_cache_without_task_write -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/native-npm-redirection.log"
      - name: Own-login environment scrub regression and negative sensitivity
        shell: bash
        run: |
          set -euo pipefail
          case_name=an_unbound_declared_key_with_an_own_login_fact_is_an_honest_absence
          timeout 10m cargo test --locked -p aikit-cli --lib "$case_name" -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/own-login-scrub.log"
          grep -q 'test result: ok. 1 passed;' "$RUNNER_TEMP/caw-evidence/own-login-scrub.log"
          source=crates/aikit-cli/src/encounter_model.rs
          retained="$RUNNER_TEMP/caw-evidence/encounter_model.rs.accepted"
          cp "$source" "$retained"
          trap 'cp "$retained" "$source"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/aikit-cli/src/encounter_model.rs')
          body = path.read_text()
          accepted = '    Ok(Some(environment))\n}\n\n/// The final-exec'
          predecessor = '    Ok((!environment.is_empty()).then_some(environment))\n}\n\n/// The final-exec'
          assert body.count(accepted) == 1
          path.write_text(body.replace(accepted, predecessor))
          PY
          git diff -- "$source" > "$RUNNER_TEMP/caw-evidence/own-login-scrub-negative.patch"
          set +e
          timeout 10m cargo test --locked -p aikit-cli --lib "$case_name" -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/own-login-scrub-negative.log"
          test_status=${PIPESTATUS[0]}
          set -e
          test "$test_status" -ne 0
          grep -E -q "test .*${case_name} .*FAILED" "$RUNNER_TEMP/caw-evidence/own-login-scrub-negative.log"
          cp "$retained" "$source"
          trap - EXIT
          git diff --exit-code -- "$source"
      - name: Receipt, admission, ACP, placement, recurrence and duplicate regressions
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test --locked -p aikit-adapters --test caw_realisation --test caw_enforcement --test model_realisation_end_to_end --test central_entities --test agent_connection_v2 --test agent_session_host_v2
            cargo test --locked -p aikit-core --test caw_recurrence --test caw_route_eligibility
            cargo test --locked -p aikit-store --test caw_delivery
          } 2>&1 | tee "$RUNNER_TEMP/caw-evidence/focused.log"
      - name: Retain explicitly rebuilt product binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p aikit-cli --bins
          cp target/debug/aikit target/debug/aikit-session-space "$RUNNER_TEMP/caw-evidence/"
          sha256sum "$RUNNER_TEMP/caw-evidence/aikit" "$RUNNER_TEMP/caw-evidence/aikit-session-space" > "$RUNNER_TEMP/caw-evidence/binary-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caw-native-delivery-${{ github.sha }}
          path: ${{ runner.temp }}/caw-evidence
          if-no-files-found: error
          retention-days: 7
