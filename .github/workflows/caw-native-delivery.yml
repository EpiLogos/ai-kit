name: CAW native delivery
on:
  pull_request:
    paths:
      - 'crates/**'
      - '.github/workflows/caw-native-delivery.yml'
  push:
    branches: [main, agent/caw-274-277-native-continuation]
    paths:
      - 'crates/**'
      - '.github/workflows/caw-native-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caw-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-delivery:
    name: Native Agency delivery and refusal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACTUATION_SHA: 0ac4bbb47cc37a7ac3c1db42b88a39ffd6bb5b30
      CENTRAL_SHA: d91dee416a71b95f280c691c2d17e756bd8db10c
      WORKCELL_SHA: dcac0a26f9c0f01d6b6b4dd2486566161ab9bf6f
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Actuation
          ref: 0ac4bbb47cc37a7ac3c1db42b88a39ffd6bb5b30
          path: .caw-native/Actuation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: d91dee416a71b95f280c691c2d17e756bd8db10c
          path: .caw-native/Central
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Workcell
          ref: dcac0a26f9c0f01d6b6b4dd2486566161ab9bf6f
          path: .caw-native/Workcell
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Record exact native basis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .caw-native/Actuation rev-parse HEAD)" = "$ACTUATION_SHA"
          test "$(git -C .caw-native/Central rev-parse HEAD)" = "$CENTRAL_SHA"
          test "$(git -C .caw-native/Workcell rev-parse HEAD)" = "$WORKCELL_SHA"
          test -x "$GITHUB_WORKSPACE/.caw-native/Actuation/bin/actuation"
          echo "AIKIT_CAW_ACTUATION_BIN=$GITHUB_WORKSPACE/.caw-native/Actuation/bin/actuation" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/caw-evidence"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/caw-evidence/aikit-source.tar.gz"
          {
            echo "AIKit=$(git rev-parse HEAD)"
            echo "Actuation=$ACTUATION_SHA"
            echo "Central=$CENTRAL_SHA"
            echo "Workcell=$WORKCELL_SHA"
            rustc -Vv
            node --version
            python3 --version
            echo 'Standing=pinned unmerged candidate cut; controlled native providers, not accepted main.'
            echo 'FIXTURE_REPLY is not a real model response or installed-harness proof.'
          } > "$RUNNER_TEMP/caw-evidence/basis.txt"
      - name: Build the native placement and material owners
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path .caw-native/Central/Cargo.toml -p ctrl
          cargo build --locked --manifest-path .caw-native/Workcell/Cargo.toml -p epilogos-workcell-cli --bins
          echo "AIKIT_CAW_CTRL_BIN=$GITHUB_WORKSPACE/.caw-native/Central/target/debug/ctrl" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_WORKCELL_BOUNDARY_BIN=$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-write-boundary" >> "$GITHUB_ENV"
      - name: Actual binaries through native Actuation and controlled provider processes
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-cli --test caw_native_delivery -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/native.log"
      - name: Native Central allocation to Workcell protection preparation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-adapters --test caw_native_placement -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/placement.log"
      - name: Actual task-bound resident protocol and dispatch
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-cli --test caw_task_dispatch -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/caw-evidence/task-dispatch.log"
          grep -q TASK_NATIVE_PROTECTED_DISPATCH_EXECUTED "$RUNNER_TEMP/caw-evidence/task-dispatch.log"
      - name: Receipt, admission, ACP, placement, recurrence and duplicate regressions
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test --locked -p aikit-adapters --test caw_realisation --test caw_enforcement --test model_realisation_end_to_end --test central_entities --test agent_connection_v2 --test agent_session_host_v2
            cargo test --locked -p aikit-core --test caw_recurrence --test caw_route_eligibility
            cargo test --locked -p aikit-store --test caw_delivery
          } 2>&1 | tee "$RUNNER_TEMP/caw-evidence/focused.log"
      - name: Retain explicitly rebuilt product binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p aikit-cli --bins
          cp target/debug/aikit target/debug/aikit-session-space "$RUNNER_TEMP/caw-evidence/"
          sha256sum "$RUNNER_TEMP/caw-evidence/aikit" "$RUNNER_TEMP/caw-evidence/aikit-session-space" > "$RUNNER_TEMP/caw-evidence/binary-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caw-native-delivery-${{ github.sha }}
          path: ${{ runner.temp }}/caw-evidence
          if-no-files-found: error
          retention-days: 7
