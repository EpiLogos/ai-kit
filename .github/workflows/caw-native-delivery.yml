          export RUNTIME_GATE_EVIDENCE="$RUNNER_TEMP/caw-evidence/idle-owner"
          mkdir -p "$RUNTIME_GATE_EVIDENCE/images"
          cp "$RUNNER_TEMP/caw-evidence/runtime-projection/audit.py" "$RUNTIME_GATE_EVIDENCE/audit.py"
          record_command() {
            local label=$1 suffix=$2 status
            shift 2
            printf '%q ' "$@" > "$RUNTIME_GATE_EVIDENCE/$label.command.txt"
            printf '\n' >> "$RUNTIME_GATE_EVIDENCE/$label.command.txt"
            set +e
            "$@" > "$RUNTIME_GATE_EVIDENCE/$label.$suffix" 2> "$RUNTIME_GATE_EVIDENCE/$label.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$RUNTIME_GATE_EVIDENCE/$label.exit"
            return "$status"
          }
          finish_owner_gate() {
            local primary=$? observed post=0
            trap - EXIT
            set +e
            if test -f "$RUNTIME_GATE_EVIDENCE/images.before.json"; then
              record_command image-after stdout python3 "$RUNTIME_GATE_EVIDENCE/audit.py" after
              observed=$?; if test "$observed" -ne 0; then post=1; fi
            else
              printf '%s\n' 'Current/legacy image admission did not complete; no image qualification.' > "$RUNTIME_GATE_EVIDENCE/image-after-unavailable.txt"
            fi
            if test -f "$RUNTIME_GATE_EVIDENCE/compiled-source-before.sha256"; then
              record_command source-after stdout sha256sum -c "$RUNTIME_GATE_EVIDENCE/compiled-source-before.sha256"
              observed=$?; if test "$observed" -ne 0; then post=1; fi
            fi
            record_command retained-fixture-snapshot stdout python3 "$RUNTIME_GATE_EVIDENCE/audit.py" snapshot
            observed=$?; if test "$observed" -ne 0; then post=1; fi
            printf '%s\n' "$primary" > "$RUNTIME_GATE_EVIDENCE/primary.exit"
            printf '%s\n' "$post" > "$RUNTIME_GATE_EVIDENCE/post-custody.exit"
            if test "$primary" -ne 0; then exit "$primary"; fi
            exit "$post"
          }
          export WORKCELL_TEST_ARTIFACT_ROOT="$GITHUB_WORKSPACE/ProjectCentral/now/tmp"
          mkdir -p "$WORKCELL_TEST_ARTIFACT_ROOT"
          trap finish_owner_gate EXIT
          legacy_root="$GITHUB_WORKSPACE/.caw-native/AIKit-legacy"
          test "$(git -C "$legacy_root" rev-parse HEAD)" = 'e6ab7d9f8c80b2aeb00f39518a53e18515499805'
          test "$(sha256sum "$legacy_root/crates/aikit-cli/src/encounter_service.rs" | cut -d ' ' -f1)" = 'cdc8ee27143ef30b8ff03dcce8ee1a368cfa212e1dda369c599077d08d02bed6'
          git -C "$legacy_root" diff --exit-code
          test -z "$(git -C "$legacy_root" ls-files --others --exclude-standard)"
          git -C "$legacy_root" archive --format=tar.gz HEAD > "$RUNTIME_GATE_EVIDENCE/legacy-source.tar.gz"
          git -C "$legacy_root" rev-parse HEAD > "$RUNTIME_GATE_EVIDENCE/legacy-revision.txt"
          git -C "$legacy_root" rev-parse HEAD^{tree} > "$RUNTIME_GATE_EVIDENCE/legacy-tree.txt"
          git -C "$legacy_root" ls-files --stage > "$RUNTIME_GATE_EVIDENCE/legacy-modes.txt"
          cp "$legacy_root/Cargo.lock" "$RUNTIME_GATE_EVIDENCE/legacy-Cargo.lock"
          cp Cargo.lock "$RUNTIME_GATE_EVIDENCE/current-Cargo.lock"
          git archive --format=tar.gz HEAD > "$RUNTIME_GATE_EVIDENCE/current-source.tar.gz"
          git rev-parse HEAD^{tree} > "$RUNTIME_GATE_EVIDENCE/current-tree.txt"
          git ls-files --stage > "$RUNTIME_GATE_EVIDENCE/current-modes.txt"
          sha256sum Cargo.lock crates/aikit-cli/Cargo.toml crates/aikit-cli/src/lib.rs crates/aikit-cli/src/encounter_service.rs crates/aikit-cli/src/native_owner_idle_tests.rs crates/aikit-cli/tests/encounter_shutdown.rs "$legacy_root/Cargo.lock" "$legacy_root/Cargo.toml" "$legacy_root/crates/aikit-cli/Cargo.toml" "$legacy_root/crates/aikit-cli/src/encounter_service.rs" > "$RUNTIME_GATE_EVIDENCE/compiled-source-before.sha256"
          record_command compiler-current jsonl timeout --kill-after=5s 10m cargo test --locked -p aikit-cli --test encounter_shutdown --no-run --message-format=json
          record_command compiler-library jsonl timeout --kill-after=5s 10m cargo test --locked -p aikit-cli --lib --no-run --message-format=json
          record_command compiler-legacy jsonl timeout --kill-after=5s 10m cargo build --locked --manifest-path "$legacy_root/Cargo.toml" -p aikit-cli --bin aikit --message-format=json
          export RUNTIME_GATE_ROLES="[{\"name\":\"current-aikit\",\"receipt\":\"compiler-current.jsonl\",\"root\":\"$GITHUB_WORKSPACE\",\"target\":\"aikit\",\"kind\":\"bin\",\"test\":false,\"profile_dir\":\"debug\"},{\"name\":\"encounter_shutdown\",\"receipt\":\"compiler-current.jsonl\",\"root\":\"$GITHUB_WORKSPACE\",\"target\":\"encounter_shutdown\",\"kind\":\"test\",\"test\":true,\"profile_dir\":\"debug\"},{\"name\":\"owner-library\",\"receipt\":\"compiler-library.jsonl\",\"root\":\"$GITHUB_WORKSPACE\",\"target\":\"aikit_cli\",\"kind\":\"lib\",\"test\":true,\"profile_dir\":\"debug\"},{\"name\":\"legacy-aikit\",\"receipt\":\"compiler-legacy.jsonl\",\"root\":\"$legacy_root\",\"target\":\"aikit\",\"kind\":\"bin\",\"test\":false,\"profile_dir\":\"debug\"}]"
          export RUNTIME_GATE_SOURCE_ARCHIVES="[\"$RUNTIME_GATE_EVIDENCE/current-source.tar.gz\",\"$RUNTIME_GATE_EVIDENCE/legacy-source.tar.gz\"]"
          record_command image-before stdout python3 "$RUNTIME_GATE_EVIDENCE/audit.py" prepare
          read_image_role() {
            IMAGE_ROLE="$1" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['RUNTIME_GATE_EVIDENCE'])/'images.before.json').read_text())
          selected=[row for row in rows if row['role']['name']==os.environ['IMAGE_ROLE']]
          assert len(selected)==1 and selected[0]['image']['cause'] is None
          print(selected[0]['image']['path'])
          PY
          }
          integration_image="$(read_image_role encounter_shutdown)"
          library_image="$(read_image_role owner-library)"
          export AIKIT_IDLE_LEGACY_BIN
          AIKIT_IDLE_LEGACY_BIN="$(read_image_role legacy-aikit)"
          export OWNER_INTEGRATION_ROSTER='["explicit_owner_shutdown_acknowledges_then_releases_socket_and_lock","direct_service_shutdown_is_idempotent_and_denies_later_effects","fragmented_request_and_large_response_cross_real_unix_socket_intact","native_acp_owner_shutdown_reaps_provider_and_preserves_history","actual_idle_ipc_ack_releases_the_same_owner_socket_and_lock","actual_owner_interruption_retains_unresolved_startup_and_refuses_idle","actual_resident_and_detached_resident_refuse_idle_without_stopping_provider","actual_legacy_owner_refuses_new_idle_tag_and_keeps_its_existing_lifecycle"]'
          export OWNER_IGNORED_ROSTER='["actual_resident_and_detached_resident_refuse_idle_without_stopping_provider","actual_legacy_owner_refuses_new_idle_tag_and_keeps_its_existing_lifecycle","native_acp_owner_shutdown_reaps_provider_and_preserves_history"]'
          export OWNER_LIBRARY_CASES='["encounter_service::native_owner_idle_tests::actual_prejournal_opening_refuses_idle_without_cancelling_the_open","encounter_service::native_owner_idle_tests::actual_background_worker_uses_the_same_idle_shutdown_fence","encounter_service::native_owner_idle_tests::actual_queued_delivery_history_is_disclosed_and_retained_without_replay","encounter_service::native_owner_idle_tests::actual_sqlite_census_failure_is_not_empty_idleness_or_shutdown"]'
          export RUNTIME_GATE_CASES='["encounter_service::native_owner_idle_tests::actual_prejournal_opening_refuses_idle_without_cancelling_the_open","encounter_service::native_owner_idle_tests::actual_background_worker_uses_the_same_idle_shutdown_fence","encounter_service::native_owner_idle_tests::actual_queued_delivery_history_is_disclosed_and_retained_without_replay","encounter_service::native_owner_idle_tests::actual_sqlite_census_failure_is_not_empty_idleness_or_shutdown","actual_idle_ipc_ack_releases_the_same_owner_socket_and_lock","actual_owner_interruption_retains_unresolved_startup_and_refuses_idle","actual_legacy_owner_refuses_new_idle_tag_and_keeps_its_existing_lifecycle"]'
          record_command integration-roster stdout timeout --kill-after=5s 30s "$integration_image" --list
          record_command integration-ignored-roster stdout timeout --kill-after=5s 30s "$integration_image" --list --ignored
          record_command library-roster stdout timeout --kill-after=5s 30s "$library_image" 'encounter_service::native_owner_idle_tests::' --list
          record_command library-ignored-roster stdout timeout --kill-after=5s 30s "$library_image" 'encounter_service::native_owner_idle_tests::' --list --ignored
          record_command owner-census stdout python3 "$RUNTIME_GATE_EVIDENCE/audit.py" owner-census
          cat "$RUNTIME_GATE_EVIDENCE/owner-census.json"
          cat "$RUNTIME_GATE_EVIDENCE/provider-dependent-scope.json"
          # Six genuine default bodies plus one actual legacy-owner body. The
          # two native ACP positives are compiled operational obligations, not
          # executed/qualified/pass-counted without a genuine configured owner.
          gate_status=0
          while IFS= read -r case; do
            prefix="$(python3 "$RUNTIME_GATE_EVIDENCE/audit.py" case-prefix "$case")"
            test_image="$(python3 "$RUNTIME_GATE_EVIDENCE/audit.py" owner-select-image "$case")"
            if test "$case" = 'actual_legacy_owner_refuses_new_idle_tag_and_keeps_its_existing_lifecycle'; then
              if record_command "$prefix" stdout timeout --kill-after=5s 120s "$test_image" "$case" --ignored --exact --nocapture --test-threads=1; then :; else gate_status=1; fi
            else
              if record_command "$prefix" stdout timeout --kill-after=5s 120s "$test_image" "$case" --exact --nocapture --test-threads=1; then :; else gate_status=1; fi
            fi
            if python3 "$RUNTIME_GATE_EVIDENCE/audit.py" case "$case"; then :; else gate_status=1; fi
            cat "$RUNTIME_GATE_EVIDENCE/$prefix.stdout"
            cat "$RUNTIME_GATE_EVIDENCE/$prefix.stderr" >&2
            if CASE_NAME="$case" CASE_PREFIX="$prefix" python3 - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNTIME_GATE_EVIDENCE']);case=os.environ['CASE_NAME'];prefix=os.environ['CASE_PREFIX']
          body=(out/(prefix+'.stdout')).read_text()
          named=sum(line.strip()==('test '+case+' ... ok') for line in body.splitlines())
          row={'case':case,'actual_exact_named_pass_count':named,'required':1,'standing':'actual selected line and strict one-pass/status oracle; no absence skip'}
          (out/(prefix+'.named-result.json')).write_text(json.dumps(row,indent=2)+'\n')
          if named!=1:raise SystemExit(1)
          PY
            then :; else gate_status=1; fi
          done <<'OWNER_CASES'
          encounter_service::native_owner_idle_tests::actual_prejournal_opening_refuses_idle_without_cancelling_the_open
          encounter_service::native_owner_idle_tests::actual_background_worker_uses_the_same_idle_shutdown_fence
          encounter_service::native_owner_idle_tests::actual_queued_delivery_history_is_disclosed_and_retained_without_replay
          encounter_service::native_owner_idle_tests::actual_sqlite_census_failure_is_not_empty_idleness_or_shutdown
          actual_idle_ipc_ack_releases_the_same_owner_socket_and_lock
          actual_owner_interruption_retains_unresolved_startup_and_refuses_idle
          actual_legacy_owner_refuses_new_idle_tag_and_keeps_its_existing_lifecycle
          OWNER_CASES
          printf '%s\n' "$gate_status" > "$RUNTIME_GATE_EVIDENCE/native-case-cumulative.exit"
          exit "$gate_status"
      - name: Admit portable retained native evidence before upload
        id: portable-native-evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export RUNTIME_GATE_EVIDENCE="$RUNNER_TEMP/caw-evidence/runtime-projection"
          test -f "$RUNTIME_GATE_EVIDENCE/audit.py"
          python3 "$RUNTIME_GATE_EVIDENCE/audit.py" upload
      # A failed compiler cannot satisfy portable image admission. Preserve its
      # exact raw receipts separately so the first failure remains diagnosable.
      - name: Retain failed compiler receipts without native admission
        uses: actions/upload-artifact@v4
        if: failure() && !cancelled()
        with:
          name: caw-native-failed-compiler-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/caw-evidence/basis.txt
            ${{ runner.temp }}/caw-evidence/runtime-projection/build-environment.json
            ${{ runner.temp }}/caw-evidence/runtime-projection/AIKit-Cargo.lock
            ${{ runner.temp }}/caw-evidence/runtime-projection/AIKit-tree.txt
            ${{ runner.temp }}/caw-evidence/runtime-projection/AIKit-modes.txt
            ${{ runner.temp }}/caw-evidence/runtime-projection/AIKit-source-sha256.txt
            ${{ runner.temp }}/caw-evidence/runtime-projection/compiler-*.command.txt
            ${{ runner.temp }}/caw-evidence/runtime-projection/compiler-*.exit
            ${{ runner.temp }}/caw-evidence/runtime-projection/compiler-*.stderr
            ${{ runner.temp }}/caw-evidence/runtime-projection/compiler-*.jsonl
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && steps.portable-native-evidence.outcome == 'success'
        with:
          name: caw-native-delivery-${{ github.sha }}
          path: ${{ runner.temp }}/caw-evidence
          if-no-files-found: error
          retention-days: 7
