name: Credential macOS diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: credential-macos-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/native-credential-provider
          fetch-depth: 0
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup default 1.88.0
      - name: Reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aikit-macos-diagnostic'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit -X ours origin/main
      - name: Apply precise native-store availability handling
        run: python3 scripts/credential_macos_unavailable_patch.py
      - name: Format touched provider files
        run: rustfmt crates/aikit-adapters/src/credential_provider.rs crates/aikit-adapters/tests/macos_keychain.rs
      - name: Keychain integration test
        run: cargo test -p aikit-adapters --test macos_keychain -- --nocapture
      - name: Repository verify
        run: ./scripts/verify
      - name: Commit and push proven reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git add crates/aikit-adapters/src/credential_provider.rs crates/aikit-adapters/tests/macos_keychain.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: classify unavailable native credential stores [macdiag]'
          fi
          git push origin HEAD:agent/native-credential-provider
