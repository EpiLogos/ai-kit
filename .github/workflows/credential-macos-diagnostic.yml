name: Credential macOS diagnostic

on:
  push:
    branches: [agent/native-credential-provider]

permissions:
  contents: write

jobs:
  diagnostic:
    if: ${{ !contains(github.event.head_commit.message, '[macdiag]') }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/native-credential-provider
          fetch-depth: 0
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Capture Keychain integration output
        shell: bash
        run: |
          set +e
          cargo test -p aikit-adapters --test macos_keychain -- --nocapture > credential-macos-diagnostic.txt 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >> credential-macos-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'aikit-macos-diagnostic'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add credential-macos-diagnostic.txt
          git commit -m 'ci: capture macOS credential diagnostic [macdiag]'
          git push origin HEAD:agent/native-credential-provider
