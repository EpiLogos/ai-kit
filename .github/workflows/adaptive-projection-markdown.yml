name: Adaptive projection Markdown preservation
on:
  push:
    branches: [agent/adaptive-wiki-projection-20260920]
    paths: [.github/workflows/adaptive-projection-markdown.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/adaptive-wiki-projection-20260920
      - name: Keep source frontmatter first and history in a trailing comment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/adaptive-wiki-projection-20260920
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/aikit-cli/src/wiki_projection.rs')
          s = p.read_text()
          old = '''        (history, body.to_string())
              } else {
                  (Vec::new(), raw.clone())
              };'''
          # Locate the actual rustfmt indentation exactly.
          old = old.replace('              }', '    }').replace('                  (', '        (')
          assert old in s
          new = '''        (history, body.to_string())
              } else if let Some((body, history)) = raw.rsplit_once(&format!("\\n\\n{MARKER}")) {
                  let history = history.strip_suffix(END).ok_or_else(|| error("wiki_projection.invalid_history", "unfinished trailing feedback history"))?;
                  let history: Vec<FeedbackBasis> = serde_json::from_str(history).map_err(|e| error("wiki_projection.invalid_history", e))?;
                  (history, body.to_string())
              } else {
                  (Vec::new(), raw.clone())
              };'''
          s = s.replace(old, new)
          old = 'let rendered = format!("{MARKER}{history}{END}{body}");'
          assert s.count(old) == 1
          s = s.replace(old, 'let rendered = format!("{body}\\n\\n{MARKER}{history}{END}");')
          p.write_text(s)
          p = Path('docs/WIKI-OPERATIONAL-PROJECTION.md')
          s = p.read_text().replace('A leading HTML comment', 'A trailing HTML comment (after the unchanged body, so YAML frontmatter stays first)')
          p.write_text(s)
          p = Path('crates/aikit-cli/tests/wiki_projection.rs')
          p.write_text(p.read_text() + r'''
          #[test]
          fn feedback_preserves_yaml_frontmatter_and_exact_body_bytes() {
              let temp = tempfile::tempdir().unwrap();
              let root = temp.path().canonicalize().unwrap();
              let file = source(&root);
              let body = "---\ntags: [guidance]\naliases: [Working together]\n---\n\n# Intent\n\nExplain research fully.\n";
              let changed = revised(&file, body);
              let raw = std::fs::read_to_string(&file).unwrap();
              assert!(raw.starts_with(body));
              assert!(raw.ends_with("\n-->\n"));
              assert_eq!(projection::read(&file).unwrap().body, body);
              assert_eq!(projection::read(&file).unwrap().revision, changed.revision);
              assert_eq!(revised(&file, body).feedback.len(), 2);
              assert_eq!(projection::read(&file).unwrap().body, body);
          }
          ''')
          PY
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustfmt +1.98.0 --edition 2021 --config skip_children=true crates/aikit-cli/src/wiki_projection.rs crates/aikit-cli/tests/wiki_projection.rs
          rm .github/workflows/adaptive-projection-markdown.yml
          git add crates/aikit-cli/src/wiki_projection.rs crates/aikit-cli/tests/wiki_projection.rs docs/WIKI-OPERATIONAL-PROJECTION.md .github
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve source frontmatter and exact body around feedback ledger'
          git rev-parse HEAD > /tmp/adaptive-final-revision.txt
          git archive --format=tar.gz HEAD -o /tmp/adaptive-final-source.tar.gz
          git push origin HEAD:refs/heads/agent/adaptive-wiki-projection-20260920
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Verify final native code and complete CLI library
        shell: bash
        run: |
          set -o pipefail
          cargo +1.98.0 test --locked -p aikit-cli --test wiki_projection --test guidance_delivery --test skill_overlay --test hook_stdout_inject --test hook_bypass 2>&1 | tee /tmp/adaptive-final-integration.log
          cargo +1.98.0 test --locked -p aikit-cli --lib 2>&1 | tee /tmp/adaptive-final-library.log
          cargo +1.98.0 clippy --locked -p aikit-cli --lib --bin aikit --test wiki_projection -- -D warnings 2>&1 | tee /tmp/adaptive-final-clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-markdown-${{ github.run_id }}
          path: /tmp/adaptive-final-*
          retention-days: 7
