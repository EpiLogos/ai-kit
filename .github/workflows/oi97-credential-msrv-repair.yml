name: OI97 credential MSRV repair

on:
  push:
    branches:
      - converge/oi97-native-credentials

permissions:
  contents: write

jobs:
  credential-msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.88.0
      - name: Pin Secret Service inside the existing Linux dependency table
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('Cargo.toml')
          text = root.read_text()
          keyring = 'keyring = { version = "=4.1.5", default-features = true }\n'
          pin = '# keyring 4.1.x permits secret-service 5.2, whose AES graph requires Rust 1.89.\n# AIKit deliberately retains its accepted Rust 1.88 floor, so hold the compatible provider release.\nsecret-service = "=5.1.0"\n'
          if 'secret-service = "=5.1.0"' not in text:
              if keyring not in text:
                  raise SystemExit('workspace keyring declaration drifted')
              text = text.replace(keyring, keyring + pin, 1)
              root.write_text(text)

          adapters = Path('crates/aikit-adapters/Cargo.toml')
          text = adapters.read_text()
          table = '[target.\'cfg(target_os = "linux")\'.dependencies]'
          if text.count(table) != 1:
              raise SystemExit(f'expected exactly one Linux dependency table, found {text.count(table)}')
          dep = 'base64 = { workspace = true }\n'
          if 'secret-service = { workspace = true }' not in text:
              if dep not in text:
                  raise SystemExit('Linux dependency anchor drifted')
              text = text.replace(dep, dep + 'secret-service = { workspace = true }\n', 1)
              adapters.write_text(text)
          text = adapters.read_text()
          if text.count(table) != 1:
              raise SystemExit('Linux dependency table duplicated during repair')
          PY
          cat crates/aikit-adapters/Cargo.toml
          cargo update -p secret-service --precise 5.1.0
          cargo fmt --check
          git diff -- Cargo.toml Cargo.lock crates/aikit-adapters/Cargo.toml
      - name: Prove credential consumers on accepted MSRV
        run: |
          cargo test --locked -p aikit-adapters --all-targets --no-fail-fast -- --test-threads=1
          cargo test --locked -p aikit-cli --all-targets --no-fail-fast -- --test-threads=1
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit proven dependency correction for clean-tree harvest
        run: |
          if git diff --quiet -- Cargo.toml Cargo.lock crates/aikit-adapters/Cargo.toml; then
            exit 0
          fi
          git config user.name Epii
          git config user.email frank.g.taylor97@gmail.com
          git add Cargo.toml Cargo.lock crates/aikit-adapters/Cargo.toml
          git commit -m 'fix(oi97): keep credential providers on Rust 1.88'
          git push origin HEAD:converge/oi97-native-credentials
