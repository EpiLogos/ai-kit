name: OI142 operative migration

on:
  push:
    branches:
      - feat/oi142-operative-resolve-syntax
    paths:
      - 'scripts/oi142-operative-provider-migrate.py'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oi142-operative-resolve-syntax
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply provider-neutral operative enrichment seam
        run: python3 scripts/oi142-operative-provider-migrate.py
      - name: Format current workspace
        run: cargo fmt --all
      - name: Verify AIKit without QL-MEF installed
        run: cargo test --workspace --all-targets
      - name: Commit verified source delta
        shell: bash
        run: |
          set -euo pipefail
          git add crates/aikit-core/src/resource/mod.rs \
                  crates/aikit-core/src/resource/operative_provider.rs
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[OI142] Add provider-neutral operative semantic enrichment seam'
          git push origin HEAD:feat/oi142-operative-resolve-syntax
