name: Correct controlled ACP fixture
on:
  push:
    branches: [agent/native-session-controls-20260920]
    paths: [.github/workflows/native-session-controls-fixture.yml]
permissions:
  contents: read
jobs:
  correct:
    if: github.ref == 'refs/heads/agent/native-session-controls-20260920'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Correct test wire shape, not production acceptance rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/aikit-adapters/tests/native_model_controls.rs');s=p.read_text()
          assert s.count('{"id":"model","type":"select"')==1
          s=s.replace('{"id":"model","type":"select"','{"id":"model","category":"model","type":"select"')
          s+='''
          #[test]
          fn a_selector_without_the_required_model_category_stays_read_only() {
              let adapter = opened(json!({"sessionId":"native-test","configOptions":[{"id":"model","type":"select","name":"Model","currentValue":"test/a","options":[{"value":"test/a","name":"A"}]}]}));
              assert!(!adapter.session_model_controls("native-test").model_selection);
          }
          '''
          p.write_text(s)
          p=Path('crates/aikit-cli/tests/support/agent_session_protocol.py');s=p.read_text()
          assert s.count('{"id": "model", "type": "select"')==1
          p.write_text(s.replace('{"id": "model", "type": "select"','{"id": "model", "category": "model", "type": "select"'))
          PY
          git diff --check
          git rm .github/workflows/native-session-controls-fixture.yml
          git add crates/aikit-adapters/tests/native_model_controls.rs crates/aikit-cli/tests/support/agent_session_protocol.py
          git -c user.name=Epii -c user.email=agent-session@users.noreply.github.com commit -m 'test(encounter): send valid model categories and preserve malformed-selector refusal'
          git push origin HEAD:refs/heads/agent/native-session-controls-20260920
