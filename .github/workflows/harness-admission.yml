name: Harness admission conformance

on:
  pull_request:
    paths:
      - 'crates/aikit-core/src/harness_admission.rs'
      - 'crates/aikit-core/tests/harness_admission.rs'
      - 'crates/aikit-core/src/lib.rs'
      - 'skills/registry/capsules/skill/aikit/harness-adapter-authoring/**'
      - 'skills/skillsets/aikit-extension-developer/members'
      - 'scripts/verify-native-skills.py'
      - '.github/workflows/harness-admission.yml'
  push:
    branches:
      - agent/harness-admission-sdk
    paths:
      - 'crates/aikit-core/src/harness_admission.rs'
      - 'crates/aikit-core/tests/harness_admission.rs'
      - 'crates/aikit-core/src/lib.rs'
      - 'skills/registry/capsules/skill/aikit/harness-adapter-authoring/**'
      - 'skills/skillsets/aikit-extension-developer/members'
      - 'scripts/verify-native-skills.py'
      - '.github/workflows/harness-admission.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify first-party authoring Skill registration
        run: python3 scripts/verify-native-skills.py
      - name: Verify public harness admission SDK
        run: cargo test -p aikit-core --test harness_admission
      - name: Verify core library static quality
        run: cargo clippy -p aikit-core --lib -- -D warnings
