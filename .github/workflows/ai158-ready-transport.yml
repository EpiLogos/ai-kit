name: AIKit 158 ready transport

on:
  push:
    branches:
      - agent/158-ql-shape-parity
    paths:
      - '.github/workflows/ai158-ready-transport.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/158-ql-shape-parity
          fetch-depth: 0

      - name: Mark PR ready through native GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 160 --repo EpiLogos/ai-kit

      - name: Retire transport shim
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ai158-ready-transport.yml
          git commit -m '[AIKIT158] Retire ready-state transport shim'
          git push origin HEAD:agent/158-ql-shape-parity
