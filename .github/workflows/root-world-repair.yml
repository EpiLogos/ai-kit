name: Root world repair
on:
  push:
    branches: [agent/caw-model-resident-selection]
    paths:
      - scripts/root-world-repair.patch.gz
      - .github/workflows/root-world-repair.yml
permissions:
  contents: write
concurrency:
  group: root-world-repair-294
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/agent/caw-model-resident-selection'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/root-world-evidence"
          cp scripts/root-world-repair.patch.gz "$RUNNER_TEMP/root-world-evidence/transferred-patch.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/root-world-evidence/basis.txt"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          base = '43f790b4b878292be64c735e25d6341caeff4901'
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          carriers = {'scripts/root-world-repair.patch.gz', '.github/workflows/root-world-repair.yml'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines())
          if changed - carriers:
              raise SystemExit('Refusing a moved source basis: ' + repr(sorted(changed - carriers)))
          encoded = base64.b64encode(pathlib.Path('scripts/root-world-repair.patch.gz').read_bytes()).decode()
          for old, new in [('LxNhPzuKi0qS8', 'LxNhPzuKiS8'), ('cpVdmNgaz34', 'cpVdmNg34'), ('gatJI+6449', 'gatJI+449')]:
              encoded = encoded.replace(old, new)
          encoded += 'A'
          payload = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(payload).hexdigest() == 'f5d739299158c34a82d066767fd8de7e08625d14e976bc9598733c779c1952f4', 'Patch transfer mismatch'
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'root-world-evidence' / 'repair.patch'
          patch.write_bytes(payload)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          for path in carriers:
              pathlib.Path(path).unlink()
          PY
          git diff --check
          tar --exclude=.git --exclude=target --exclude=.caw-native -czf "$RUNNER_TEMP/root-world-evidence/candidate-source.tar.gz" .
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Format new Rust modules only
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 crates/aikit-cli/src/app/root_context.rs crates/aikit-core/tests/root_world_context.rs crates/aikit-adapters/tests/native_world_binding.rs crates/aikit-cli/tests/central_root_context.rs
      - name: Focused root and consumer regressions
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test --locked -p aikit-core --test root_world_context
            cargo test --locked -p aikit-adapters --test native_world_binding
            cargo test --locked -p aikit-cli --test central_root_context
          } 2>&1 | tee "$RUNNER_TEMP/root-world-evidence/focused.log"
      - name: Full repository verification
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify 2>&1 | tee "$RUNNER_TEMP/root-world-evidence/verify.log"
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Actuation
          ref: 2d73f957c287ef386b09ac2c55eeab3603b60873
          path: .caw-native/Actuation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: 5d1b8bf6692f9aca45b2fe39db54cbc378dda70e
          path: .caw-native/Central
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Workcell
          ref: 0187b0d76e8f27632d127d54ef2441310b073108
          path: .caw-native/Workcell
          persist-credentials: false
      - name: Build pinned native owners
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path .caw-native/Central/Cargo.toml -p ctrl
          cargo build --locked --manifest-path .caw-native/Workcell/Cargo.toml -p epilogos-workcell-cli --bins
          echo "AIKIT_CAW_ACTUATION_BIN=$GITHUB_WORKSPACE/.caw-native/Actuation/bin/actuation" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_CTRL_BIN=$GITHUB_WORKSPACE/.caw-native/Central/target/debug/ctrl" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_WORKCELL_BIN=$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_WORKCELL_SERVICE_BIN=$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-control-service" >> "$GITHUB_ENV"
          echo "AIKIT_CAW_WORKCELL_BOUNDARY_BIN=$GITHUB_WORKSPACE/.caw-native/Workcell/target/debug/workcell-write-boundary" >> "$GITHUB_ENV"
          {
            echo "Actuation=$(git -C .caw-native/Actuation rev-parse HEAD)"
            echo "Central=$(git -C .caw-native/Central rev-parse HEAD)"
            echo "Workcell=$(git -C .caw-native/Workcell rev-parse HEAD)"
            rustc -Vv
            node --version
            echo 'Standing=controlled native protocol providers; not installed or commercial-model proof'
          } >> "$RUNNER_TEMP/root-world-evidence/basis.txt"
      - name: Native root composition and delivery
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-cli --test caw_native_delivery -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/root-world-evidence/native.log"
          grep -q MODEL_SELECTED_NATIVE_RESPONSE_EXECUTED "$RUNNER_TEMP/root-world-evidence/native.log"
          grep -q MODEL_APPLICATION_NATIVE_CONNECTION_EXECUTED "$RUNNER_TEMP/root-world-evidence/native.log"
          grep -q MODEL_COMPOSE_NATIVE_CONNECTION_EXECUTED "$RUNNER_TEMP/root-world-evidence/native.log"
          grep -q CENTRAL_ROOT_META_PROJECT_COMPOSE_EXECUTED "$RUNNER_TEMP/root-world-evidence/native.log"
      - name: Native placement and persistent task regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-adapters --test caw_native_placement -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/root-world-evidence/placement.log"
          cargo test --locked -p aikit-cli --test caw_task_dispatch -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/root-world-evidence/task.log"
      - name: Publish tested repair without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add crates/aikit-core/src/project/binding.rs crates/aikit-adapters/src/agency_admission.rs crates/aikit-cli/src/app/root_context.rs crates/aikit-cli/src/app/mod.rs crates/aikit-tui/src/project_workspace_render.rs crates/aikit-core/tests/root_world_context.rs crates/aikit-adapters/tests/native_world_binding.rs crates/aikit-cli/tests/central_root_context.rs crates/aikit-cli/tests/support/caw_model_application.rs docs/implementation/CENTRAL-ROOT-CONTEXT-REPAIR.md scripts/root-world-repair.patch.gz .github/workflows/root-world-repair.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(context): preserve Central root meta-project bindings'
          git rev-parse HEAD > "$RUNNER_TEMP/root-world-evidence/tested-commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/root-world-evidence/tested-source.tar.gz"
          git push origin HEAD:refs/heads/agent/caw-model-resident-selection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-world-repair-${{ github.sha }}
          path: ${{ runner.temp }}/root-world-evidence
          if-no-files-found: error
          retention-days: 7
