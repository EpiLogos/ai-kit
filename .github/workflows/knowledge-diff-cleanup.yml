name: Knowledge diff cleanup

on:
  push:
    branches:
      - agent/knowledge-navigation-production-closure

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/knowledge-navigation-production-closure
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: git fetch origin main
      - run: python3 scripts/knowledge_diff_cleanup.py
      - run: |
          rm scripts/knowledge_diff_cleanup.py
          rm .github/workflows/knowledge-diff-cleanup.yml
      - name: Commit intentional diff cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(knowledge): remove unrelated formatting churn"
      - name: Merge actual current main
        run: git merge --no-edit origin/main
      - name: Push reconciled branch
        run: git push origin HEAD:agent/knowledge-navigation-production-closure
      - name: Focused compile and production acceptance
        run: |
          cargo check -p aikit-core -p aikit-store -p aikit-tui -p aikit-cli
          cargo test -p aikit-cli --test knowledge_application_v2 -- --test-threads=1
