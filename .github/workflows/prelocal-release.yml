name: Pre-local release

on:
  pull_request:
    paths:
      - '.oi/product.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - '.github/workflows/prelocal-release.yml'
  push:
    branches: [main]
    paths:
      - '.oi/product.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - '.github/workflows/prelocal-release.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - run: cargo test --workspace --all-targets --locked

  artifact:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - name: Build locked native artifact
        run: cargo build --locked --release --target '${{ matrix.target }}' --package aikit-cli --bin aikit
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="ai-kit-0.1.0-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/aikit" "dist/$name/aikit"
          cp .oi/product.json "dist/$name/product.json"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ai-kit-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  # prelocal.2 is one accepted historical cut, not a rolling main alias.
  # Newer main pushes still verify/build/attest above; they must not mutate
  # or recreate this immutable release at a different commit.
  release:
    if: github.event_name == 'push' && github.sha == '9ff28ca31c723b314ddf62b7f85b6e2611d53d66'
    needs: artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-kit-*
          path: dist
          merge-multiple: true
      - name: Publish immutable pre-local release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='aikit-v0.1.0-prelocal.2'
          accepted_sha='9ff28ca31c723b314ddf62b7f85b6e2611d53d66'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            if [[ "$existing_target" != "$accepted_sha" ]]; then
              echo "release $tag exists at unexpected target $existing_target; refusing mutation" >&2
              exit 1
            fi
            echo "release $tag already exists at accepted immutable cut $accepted_sha; no mutation required"
            exit 0
          fi
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$accepted_sha" --prerelease --title 'AIKit 0.1.0 pre-local.2' --notes 'Accepted O:I suite pre-local.2 artifact. Physical workstation acceptance is not claimed.'
