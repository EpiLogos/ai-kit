name: Native Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/verify-native-skills.py"
      - "scripts/verify-human-authority.py"
      - "scripts/verify-instruction-craft.py"
      - "scripts/verify-whole-relative-proof.py"
      - "crates/aikit-core/src/skillset.rs"
      - "crates/aikit-core/src/profile.rs"
      - "crates/aikit-core/src/session_space*.rs"
      - "crates/aikit-core/src/harness_admission.rs"
      - "crates/aikit-core/tests/harness_admission.rs"
      - "rust-toolchain.toml"
      - ".github/workflows/native-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/verify-native-skills.py"
      - "scripts/verify-human-authority.py"
      - "scripts/verify-instruction-craft.py"
      - "scripts/verify-whole-relative-proof.py"
      - "crates/aikit-core/src/skillset.rs"
      - "crates/aikit-core/src/profile.rs"
      - "crates/aikit-core/src/session_space*.rs"
      - "crates/aikit-core/src/harness_admission.rs"
      - "crates/aikit-core/tests/harness_admission.rs"
      - "rust-toolchain.toml"
      - ".github/workflows/native-skills.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify-native-skills.py
      - run: python3 scripts/verify-human-authority.py
      - run: python3 scripts/verify-instruction-craft.py
      - run: python3 scripts/verify-whole-relative-proof.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - name: Public harness-admission SDK conformance
        run: cargo test -p aikit-core --test harness_admission
      - run: cargo test -p aikit-cli --test set_command
      - run: cargo test -p aikit-cli --test acceptance
