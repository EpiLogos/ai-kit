name: OI97 V2 credential convergence

on:
  push:
    branches: [converge/oi97-v2-native-credentials]
    paths:
      - '.github/workflows/oi97-v2-credential-convergence.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi97-v2-native-credentials
          fetch-depth: 0
      - name: Recover credential capability from historical V2 branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/native-credential-provider
          git diff --binary 357db8f197eb3ceccb4fb19b5b4a920de204bc5e 1ff4921a082413415272bb41ccf1be22b6122f67 -- \
            Cargo.toml \
            crates/aikit-adapters/Cargo.toml \
            crates/aikit-adapters/src/credential_provider.rs \
            crates/aikit-adapters/src/lib.rs \
            crates/aikit-adapters/tests/macos_keychain.rs \
            crates/aikit-cli/Cargo.toml \
            crates/aikit-cli/src/cli.rs \
            crates/aikit-cli/src/credential.rs \
            crates/aikit-cli/src/doctor.rs \
            crates/aikit-cli/src/lib.rs \
            crates/aikit-cli/src/main.rs \
            crates/aikit-core/src/credential.rs \
            crates/aikit-core/src/lib.rs \
            crates/aikit-store/src/credentials.rs \
            crates/aikit-store/src/home.rs \
            crates/aikit-store/src/lib.rs \
            crates/aikit-tui/src/credential_surface.rs \
            crates/aikit-tui/src/lib.rs \
            > /tmp/credential.patch
          git apply --3way --index /tmp/credential.patch
      - name: Repair cross-platform PathBuf warning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/aikit-adapters/src/credential_provider.rs')
          s = p.read_text()
          s = s.replace('use std::path::{Path, PathBuf};', 'use std::path::Path;\n#[cfg(target_os = "linux")]\nuse std::path::PathBuf;')
          p.write_text(s)
          PY
          git add crates/aikit-adapters/src/credential_provider.rs
      - name: Current-source verification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p aikit-core
          cargo test -p aikit-store
          cargo test -p aikit-adapters
          cargo test -p aikit-cli
          cargo test -p aikit-tui
          cargo clippy --workspace --all-targets -- -D warnings
          bash scripts/verify
      - name: Commit semantic convergence and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oi97-v2-credential-convergence.yml
          git add -A
          git commit -m 'feat(v2): converge native credential providers'
          git push origin HEAD:converge/oi97-v2-native-credentials

# O:I #97 one-shot current-main convergence trigger.
