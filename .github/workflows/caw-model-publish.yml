name: CAW scoped model source publication
on:
  push:
    branches: [agent/caw-model-resident-selection]
    paths: [.github/workflows/caw-model-publish.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-source:
    if: github.repository == 'EpiLogos/ai-kit' && github.ref == 'refs/heads/agent/caw-model-resident-selection'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/caw-model-resident-selection
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Publish scoped production source against the inspected basis
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2ff6baee22c5deffd1835d0569ca5316419366f9 HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          base='752dc5ec25a3430ab338c43947965c20603f0a64'
          # Reuse the exact previously executed source edit, not a runtime overlay.
          prior=subprocess.check_output(['git','show','245d6ccd92df60cab703add4730668c99b82af2e:.github/workflows/caw-model-publish.yml']).decode()
          code=prior.split("python3 - <<'PY'\n",1)[1].split('\n          PY\n',1)[0]
          exec(compile(textwrap.dedent(code),'verified-native-source-edit','exec'))
          # Preserve the existing three-argument application API while replacing
          # its permanent false eligibility placeholders with native admission.
          p=Path('crates/aikit-cli/src/app/mod.rs'); s=p.read_text()
          assert s == subprocess.check_output(['git','show',base+':'+str(p)]).decode()
          s=s.replace('mod knowledge;', 'mod knowledge;\nmod model_resident;', 1)
          a=s.index('    /// Actualise a selected Model through Actuation,')
          b=s.index("    /// Read one Provider Source's published model list", a)
          s=s[:a]+'''    /// Realise an explicitly selected catalogue model through the existing
              /// resident owner. Native source, authority, credentials and observed
              /// protocol model determine eligibility; opening is not inference.
              pub fn realise_model(
                  &self,
                  composed: &serde_json::Value,
                  model: &str,
                  provider: Option<&str>,
              ) -> Result<serde_json::Value> {
                  model_resident::realise(self, composed, model, provider, None)
              }

          '''+s[b:]
          # These private helpers existed only for the replaced placeholder path.
          a=s.index('\nfn model_roster_demand(')
          while True:
              previous=s.rfind('\n',0,a)
              if previous < 0 or not s[previous+1:a].startswith('///'): break
              a=previous
          tail=s[a:]
          assert tail.count('\nfn ')==3 and 'fn body_reading(' in tail
          s=s[:a].rstrip()+'\n'
          p.write_text(s)
          p=Path('crates/aikit-cli/src/app/model_resident.rs'); s=p.read_text()
          assert s == subprocess.check_output(['git','show','ab27c1c69a6ed645b84bb27466ea9a9942aba144:'+str(p)]).decode()
          s=s.replace('aikit_core::model_catalogue::ProviderRef','aikit_core::resource::ProviderRef')
          s=s.replace('selection: Box::new(', 'request: Box::new(')
          p.write_text(s)
          p=Path('crates/aikit-cli/src/cli.rs'); s=p.read_text()
          assert s == subprocess.check_output(['git','show',base+':'+str(p)]).decode()
          needle='    pub realise: bool;'
          needle='    pub realise: bool,'
          assert s.count(needle)==1
          s=s.replace(needle, needle+'\n    /// JSON file naming the existing SessionSpace, AgentSession and native owner socket.\n    #[arg(long, requires = "realise")]\n    pub resident_target: Option<std::path::PathBuf>,')
          p.write_text(s)
          p=Path('crates/aikit-cli/src/main.rs'); s=p.read_text()
          assert s == subprocess.check_output(['git','show',base+':'+str(p)]).decode()
          needle='    let mut data = service.compose_selected_plan(admission.as_ref())?;\n    if args.realise {'
          assert s.count(needle)==1
          replacement='''    let mut data = service.compose_selected_plan(admission.as_ref())?;
              if let Some(path) = &args.resident_target {
                  let metadata = std::fs::metadata(path).map_err(|e| AikitError::new("compose.resident_target", e.to_string()))?;
                  if !metadata.is_file() || metadata.len() > 1_048_576 {
                      return Err(AikitError::new("compose.resident_target", "Resident target must be a bounded JSON file"));
                  }
                  let bytes = std::fs::read(path).map_err(|e| AikitError::new("compose.resident_target", e.to_string()))?;
                  data["resident_target"] = serde_json::from_slice(&bytes).map_err(|e| AikitError::new("compose.resident_target", e.to_string()))?;
              }
              if args.realise {'''
          s=s.replace(needle,replacement)
          p.write_text(s)
          p=Path('crates/aikit-cli/tests/support/caw_model_resident.rs'); s=p.read_text()
          assert s == subprocess.check_output(['git','show',base+':'+str(p)]).decode()
          p.write_text(s+'\n#[path = "caw_model_application.rs"]\nmod application;\n')
          # This job's token can publish source but not workflow mutations.
          # The native connector publishes the real check wiring separately.
          subprocess.run(['git','restore','--source=HEAD','--staged','--worktree','.github/workflows/caw-native-delivery.yml'],check=True)
          PY
          git add crates
          while IFS= read -r file; do
            case "$file" in *.rs) rustfmt --edition 2021 --config skip_children=true "$file" ;; esac
          done < <(git diff --cached --name-only)
          rustfmt --edition 2021 --config skip_children=true crates/aikit-cli/tests/support/caw_model_application.rs
          git add crates
          git rm -f --ignore-unmatch .caw-model-source.json scripts/caw_model_publish.py scripts/caw_model_service.patch
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git -c user.name='CAW integration' -c user.email='caw-integration@users.noreply.github.com' commit -m 'feat(caw): connect catalogue selection, scoped credentials and public compose to actual native model residents'
          git push origin HEAD:refs/heads/agent/caw-model-resident-selection
          git rev-parse HEAD
