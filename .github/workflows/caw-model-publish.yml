name: CAW scoped model source publication
on:
  push:
    branches: [agent/caw-model-resident-selection]
    paths: [.github/workflows/caw-model-publish.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-source:
    if: github.repository == 'EpiLogos/ai-kit' && github.ref == 'refs/heads/agent/caw-model-resident-selection'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/caw-model-resident-selection
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Publish scoped production source against the inspected basis
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='752dc5ec25a3430ab338c43947965c20603f0a64'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          p=Path('scripts/caw_model_publish.py')
          text=p.read_text().replace("BASE = 'bf4b8cea15ad03e69b5dc934703d6fa5e775c6e4'", "BASE = '"+base+"'")
          begin=text.index("edit('crates/aikit-cli/src/encounter_service.rs'")
          end=text.index("for path in ['crates/aikit-cli/tests/encounter_context_admission.rs'",begin)
          p.write_text(text[:begin]+text[end:])
          subprocess.run(['python3',str(p)],check=True)
          subprocess.run(['git','diff','--exit-code',base,'--','crates/aikit-cli/src/encounter_service.rs'],check=True)
          subprocess.run(['git','apply','--check','scripts/caw_model_service.patch'],check=True)
          subprocess.run(['git','apply','--index','scripts/caw_model_service.patch'],check=True)
          p=Path('crates/aikit-cli/src/encounter_model.rs'); s=p.read_text()
          assert s == subprocess.check_output(['git','show',base+':'+str(p)]).decode()
          s=s.replace('        if materialise { EnvironmentImportProvider::from_process(use_.credential_ref.clone(), name, None) }\n        else { EnvironmentImportProvider::from_process_metadata(use_.credential_ref.clone(), name, None) }', '        EnvironmentImportProvider::from_process(use_.credential_ref.clone(), name, None)')
          s=s.replace('let (catalogue, _) = aikit_store::model_catalogue::resolved_catalogue(home)?;', 'let (catalogue, _) = aikit_store::model_catalogue::resolved_catalogue(home);')
          s += '''
          /// Exact target of the existing native open-model operation.
          #[derive(Debug, Clone, Serialize, Deserialize)]
          #[serde(deny_unknown_fields)]
          pub struct EncounterModelOpen {
              pub space: aikit_core::session_space::SessionSpaceRef,
              pub agent_session: ResourceRef,
              pub cwd: std::path::PathBuf,
              pub model_ref: ResourceRef,
              pub provider_ref: Option<ProviderRef>,
              pub body: Option<String>,
              pub expected_agency: aikit_adapters::agency_admission::AdmittedAgency,
          }
          pub(crate) fn validate_target(home: &AikitHome, session: &ResourceRef, configured: &EncounterProvider, request: &EncounterModelOpen) -> Result<()> {
              let binding = read_binding(home, session)?.ok_or_else(|| error("Selected model target lacks native Agency"))?;
              let admitted = native_admission(&binding)?;
              if admitted != request.expected_agency { return Err(error("Selected Agency/source/WorldBinding changed between composition and resident admission")); }
              let model = prepare(home, session, configured)?.ok_or_else(|| error("The configured body has no explicit model policy"))?;
              if model.policy.model_ref != request.model_ref || request.provider_ref.as_ref().is_some_and(|p| p != &model.policy.provider_ref) || request.body.as_ref().is_some_and(|b| b != &configured.id) { return Err(error("Resolved body/model does not match the explicit catalogue target")); }
              Ok(())
          }
          impl EncounterService {
              pub(crate) fn open_model(&self, request: EncounterModelOpen) -> Result<Value> {
                  self.require_attached(&request.agent_session)?;
                  let mut candidates = Vec::new();
                  for configured in self.providers()? {
                      if configured.model_policy.is_none() || request.body.as_ref().is_some_and(|b| b != &configured.id) { continue; }
                      if validate_target(&self.home, &request.agent_session, &configured, &request).is_ok() && self.check_task_launch(&request.agent_session, &configured, &request.cwd).is_ok() { candidates.push(configured); }
                  }
                  if candidates.len() != 1 { return Err(error(if candidates.is_empty() { "No configured body has current model/source/credential/authority/protocol eligibility; no fallback selected" } else { "Several native bodies are eligible; explicitly select a body" })); }
                  let provider = candidates.remove(0);
                  let mut result = self.open_native(request.space.clone(), request.agent_session.clone(), provider.id, request.cwd.clone(), false, Some(&request))?;
                  result["selected"] = json!(true);
                  result["executed"] = json!(false);
                  result["standing"] = json!("native selected-model resident, not an inference result");
                  Ok(result)
              }
          }
          '''
          p.write_text(s)
          p=Path('crates/aikit-cli/src/app/mod.rs'); s=p.read_text()
          assert s == subprocess.check_output(['git','show',base+':'+str(p)]).decode()
          s=s.replace('mod knowledge;', 'mod knowledge;\nmod model_resident;', 1)
          a=s.index('    /// Actualise a selected Model through Actuation,')
          b=s.index("    /// Read one Provider Source's published model list", a)
          s=s[:a]+'''    /// Native source/authority/credential/model-observed resident selection.
              /// Opening is not inference: an addressed turn produces that evidence.
              pub fn realise_model(&self, composed: &serde_json::Value, model: &str, provider: Option<&str>) -> Result<serde_json::Value> {
                  model_resident::realise(self, composed, model, provider, None)
              }

          '''+s[b:]
          a=s.index('\nfn model_roster_demand(')
          while True:
              previous=s.rfind('\n',0,a)
              if previous < 0 or not s[previous+1:a].startswith('///'): break
              a=previous
          assert s[a:].count('\nfn ')==3 and 'fn body_reading(' in s[a:]
          p.write_text(s[:a].rstrip()+'\n')
          p=Path('crates/aikit-cli/src/app/model_resident.rs'); s=p.read_text()
          assert s.count('selection: Box::new(')==1
          p.write_text(s.replace('aikit_core::model_catalogue::ProviderRef','aikit_core::resource::ProviderRef').replace('selection: Box::new(', 'request: Box::new('))
          p=Path('crates/aikit-cli/src/cli.rs'); s=p.read_text()
          assert s == subprocess.check_output(['git','show',base+':'+str(p)]).decode()
          needle='    pub realise: bool,'
          assert s.count(needle)==1
          p.write_text(s.replace(needle, needle+'\n    /// JSON file naming the existing SessionSpace, AgentSession and native owner socket.\n    #[arg(long, requires = "realise")]\n    pub resident_target: Option<std::path::PathBuf>,'))
          p=Path('crates/aikit-cli/src/main.rs'); s=p.read_text()
          assert s == subprocess.check_output(['git','show',base+':'+str(p)]).decode()
          needle='    let mut data = service.compose_selected_plan(admission.as_ref())?;\n    if args.realise {'
          assert s.count(needle)==1
          p.write_text(s.replace(needle, '''    let mut data = service.compose_selected_plan(admission.as_ref())?;
              if let Some(path) = &args.resident_target {
                  let metadata = std::fs::metadata(path).map_err(|e| AikitError::new("compose.resident_target", e.to_string()))?;
                  if !metadata.is_file() || metadata.len() > 1_048_576 { return Err(AikitError::new("compose.resident_target", "Resident target must be a bounded JSON file")); }
                  let bytes = std::fs::read(path).map_err(|e| AikitError::new("compose.resident_target", e.to_string()))?;
                  data["resident_target"] = serde_json::from_slice(&bytes).map_err(|e| AikitError::new("compose.resident_target", e.to_string()))?;
              }
              if args.realise {'''))
          p=Path('crates/aikit-cli/tests/support/caw_model_resident.rs'); s=p.read_text()
          assert s == subprocess.check_output(['git','show',base+':'+str(p)]).decode()
          p.write_text(s+'\n#[path = "caw_model_application.rs"]\nmod application;\n')
          subprocess.run(['git','restore','--source=HEAD','--staged','--worktree','.github/workflows/caw-native-delivery.yml'],check=True)
          PY
          git add crates
          while IFS= read -r file; do
            case "$file" in *.rs) rustfmt --edition 2021 --config skip_children=true "$file" ;; esac
          done < <(git diff --cached --name-only)
          rustfmt --edition 2021 --config skip_children=true crates/aikit-cli/tests/support/caw_model_application.rs
          git add crates
          git rm -f --ignore-unmatch .caw-model-source.json scripts/caw_model_publish.py scripts/caw_model_service.patch
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git -c user.name='CAW integration' -c user.email='caw-integration@users.noreply.github.com' commit -m 'feat(caw): connect public compose, scoped credentials and native selected-model residents'
          git push origin HEAD:refs/heads/agent/caw-model-resident-selection
          git rev-parse HEAD
