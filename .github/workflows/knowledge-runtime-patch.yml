name: Knowledge runtime patch

on:
  push:
    branches:
      - agent/knowledge-navigation-production-runtime-v2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[knowledge-runtime-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/knowledge-navigation-production-runtime-v2
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Align guarded patch with current ResourceSearchIndex
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/knowledge_runtime_patch.py')
          text = p.read_text()
          start = text.index('# --- core: expose current canonical shallow records')
          end = text.index('# --- durable operational Knowledge history')
          p.write_text(text[:start] + text[end:])
          PY
      - name: Apply production Knowledge integration
        run: python .github/scripts/knowledge_runtime_patch.py
      - name: Align generated code with canonical APIs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/aikit-store/src/knowledge_history.rs')
          text = p.read_text().replace(
              '    AikitError, FamiliarityContext, KnowledgeContextPack, KnowledgeRoute, KnowledgeRouteStep,\n    ProviderRef, ResourceRef, Result,\n};',
              '    AikitError, FamiliarityContext, KnowledgeContextPack, KnowledgeRoute, KnowledgeRouteStep, Result,\n};\nuse aikit_core::resource::{ProviderRef, ResourceRef};')
          p.write_text(text)

          p = Path('crates/aikit-cli/src/knowledge_runtime.rs')
          text = p.read_text()
          text = text.replace(
              '    KnowledgeOperations, KnowledgeRoute, ProjectMap, ResourceRef, Result, SemanticWikiIndex,\n    SemanticWikiProvider,\n};',
              '    KnowledgeOperations, KnowledgeRoute, ProjectMap, Result, SemanticWikiIndex,\n    SemanticWikiProvider,\n};\nuse aikit_core::resource::{ResourceRef, SourceRef};')
          text = text.replace('aikit_core::SourceRef::parse(value)?', 'SourceRef::parse(value)?')
          text = text.replace('SemanticWikiIndex::rebuild(&wiki_objects)?', 'SemanticWikiIndex::rebuild(wiki_objects)?')
          text = text.replace(
              '.map(|root| GitNexusCodeIndexProvider::new(SystemRunner, root.clone()));',
              '.map(|root| {\n                let repo_name = root.file_name().and_then(|value| value.to_str()).unwrap_or("project").to_string();\n                let source = SourceRef::parse(&format!("source/project/{repo_name}"))\n                    .expect("derived project source ref must be valid");\n                GitNexusCodeIndexProvider::new(SystemRunner::new().with_cwd(root), repo_name, source, None)\n            });')
          text = text.replace('self.application().relations(address)', 'KnowledgeOperations::relations(&self.application(), address)')
          text = text.replace(
              'pub fn explain(&self, address: &KnowledgeAddress) -> aikit_core::KnowledgeExplanation {\n        self.application().explain(address)\n    }',
              'pub fn explain(&self, address: &KnowledgeAddress) -> Result<aikit_core::KnowledgeExplanation> {\n        KnowledgeOperations::explain(&self.application(), address)\n    }')
          text = text.replace('fn read(path: &Path, code: &str)', "fn read(path: &Path, code: &'static str)")
          p.write_text(text)

          p = Path('crates/aikit-cli/src/app/mod.rs')
          text = p.read_text().replace('aikit_core::ResourceRef::parse("surface/aikit/tui")', 'aikit_core::resource::ResourceRef::parse("surface/aikit/tui")')
          text = text.replace('Ok(crate::knowledge_runtime::KnowledgeRuntime::from_service(self)?.explain(address))', 'crate::knowledge_runtime::KnowledgeRuntime::from_service(self)?.explain(address)')
          p.write_text(text)

          p = Path('crates/aikit-cli/src/main.rs')
          text = p.read_text().replace('aikit_core::ResourceRef::parse("surface/aikit/cli")?', 'aikit_core::resource::ResourceRef::parse("surface/aikit/cli")?')
          text = text.replace('KnowledgeSub::Explain { address } => serde_json::to_value(runtime.explain(&parse_address(&address)?)),', 'KnowledgeSub::Explain { address } => serde_json::to_value(runtime.explain(&parse_address(&address)?)?),')
          p.write_text(text)

          p = Path('crates/aikit-cli/tests/knowledge_runtime_v2.rs')
          text = p.read_text().replace('use aikit_core::{KnowledgeAddress, ResourceRef};', 'use aikit_core::KnowledgeAddress;\nuse aikit_core::resource::ResourceRef;')
          text = text.replace('AikitHome::new(', 'AikitHome::at(')
          p.write_text(text)
          PY
      - name: Align bounded relation surface
        run: python .github/scripts/knowledge_runtime_align.py
      - name: Format touched Rust files only
        run: |
          rustfmt --edition 2021 \
            crates/aikit-store/src/events.rs crates/aikit-store/src/knowledge_history.rs crates/aikit-store/src/lib.rs \
            crates/aikit-cli/src/knowledge_runtime.rs crates/aikit-cli/src/lib.rs crates/aikit-cli/src/cli.rs \
            crates/aikit-cli/src/main.rs crates/aikit-cli/src/app/mod.rs \
            crates/aikit-tui/src/backend.rs crates/aikit-tui/src/application_service.rs \
            crates/aikit-cli/tests/knowledge_runtime_v2.rs
      - name: Focused compile and tests
        run: |
          cargo test -p aikit-store knowledge_history --locked
          cargo test -p aikit-cli --test knowledge_runtime_v2 --locked
          cargo test -p aikit-tui --lib --locked
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/knowledge-runtime-trigger .github/scripts/knowledge_runtime_align.py
          git add -A
          git commit -m 'feat(knowledge): bind production Knowledge runtime [knowledge-runtime-applied]'
          git push origin HEAD:agent/knowledge-navigation-production-runtime-v2
