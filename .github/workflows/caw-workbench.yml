name: CAW branch workbench
on:
  push:
    branches: [agent/caw-274-277-native-continuation]
permissions:
  contents: read
concurrency:
  group: caw-branch-workbench
  cancel-in-progress: true
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare locked native compiler and dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          cargo fetch --locked
          mkdir -p /tmp/caw-toolchain
          tar -czf /tmp/caw-toolchain/rust.tar.gz -C "$HOME/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu" bin lib libexec
          tar -czf /tmp/caw-toolchain/registry.tar.gz -C "$HOME/.cargo" registry
      - uses: actions/upload-artifact@v4
        with:
          name: caw-toolchain
          path: /tmp/caw-toolchain
          compression-level: 0
          retention-days: 1
