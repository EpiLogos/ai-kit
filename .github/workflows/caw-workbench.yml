name: CAW branch workbench
on:
  push:
    branches: [agent/caw-274-277-native-continuation]
    paths: [.caw-apply.json]
permissions:
  contents: write
concurrency:
  group: caw-patch-transfer
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/agent/caw-274-277-native-continuation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check and apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          packet = json.loads(pathlib.Path('.caw-apply.json').read_text())
          encoded = packet['patch']
          if len(encoded) > 200000:
              raise SystemExit('Oversized source transfer')
          dec = lzma.LZMADecompressor()
          patch = dec.decompress(base64.b64decode(encoded, validate=True), max_length=524289)
          if len(patch) > 524288 or not dec.eof or dec.unused_data:
              raise SystemExit('Invalid source transfer bounds')
          if hashlib.sha256(patch).hexdigest() != packet['sha256']:
              raise SystemExit('Source patch checksum mismatch')
          path = pathlib.Path('/tmp/caw.patch')
          path.write_bytes(patch)
          stats = subprocess.check_output(['git','apply','--numstat',str(path)], text=True)
          for row in stats.splitlines():
              target = row.split('\t', 2)[2]
              if not target.startswith(('crates/', 'docs/', 'scripts/')) or '..' in pathlib.PurePosixPath(target).parts:
                  raise SystemExit('Out-of-scope transfer path: '+target)
          subprocess.run(['git','apply','--check',str(path)], check=True)
          subprocess.run(['git','apply','--index',str(path)], check=True)
          PY
          git diff --cached --check
          git rm .caw-apply.json
          git config user.name 'CAW implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(caw): execute admitted Agent turns; add receipt, placement and recurrence cores'
          git push origin HEAD:refs/heads/agent/caw-274-277-native-continuation
          git rev-parse HEAD
