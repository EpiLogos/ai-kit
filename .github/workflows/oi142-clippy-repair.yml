name: OI142 clippy repair

on:
  push:
    branches:
      - feat/oi142-operative-resolve-syntax
    paths:
      - '.github/workflows/oi142-clippy-repair.yml'
      - 'scripts/oi142-clippy-fix.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oi142-operative-resolve-syntax
          fetch-depth: 0
      - name: Install Rust 1.88 with clippy
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup default 1.88.0
      - name: Apply bounded representation repair
        run: python3 scripts/oi142-clippy-fix.py
      - name: Verify clippy and workspace
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets --no-fail-fast -- --test-threads=1
      - name: Commit source repair and remove execution hook
        shell: bash
        run: |
          set -euo pipefail
          git add crates/aikit-core/src/familiarity.rs
          git rm .github/workflows/oi142-clippy-repair.yml scripts/oi142-clippy-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[OI142] Box ResolvePath evidence payload for static conformance'
          git push origin HEAD:feat/oi142-operative-resolve-syntax
