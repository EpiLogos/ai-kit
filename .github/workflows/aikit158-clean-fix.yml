name: AIKit158 clean shape-parity fix

on:
  push:
    branches:
      - agent/158-ql-shape-parity
    paths:
      - '.github/workflows/aikit158-clean-fix.yml'

permissions:
  contents: write

jobs:
  fix-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/158-ql-shape-parity
          fetch-depth: 0
      - name: Install Rust 1.98 with rustfmt and clippy
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Remove stale import and verify shape parity
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^use serde_json::Value;$/d' crates/aikit-core/src/knowledge_wiki_shape.rs
          cargo fmt --all
          cargo clippy --locked -p aikit-core --all-targets -- -D warnings
          cargo test --locked -p aikit-core
      - name: Commit clean branch result and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/aikit158-clean-fix.yml
          git add crates/aikit-core/src/knowledge_wiki_shape.rs
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[AIKIT158] Verify QL shape-parity implementation'
          git push origin HEAD:agent/158-ql-shape-parity
