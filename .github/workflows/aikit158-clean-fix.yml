name: AIKit158 reconcile current main and verify shape parity

on:
  push:
    branches:
      - agent/158-ql-shape-parity
    paths:
      - '.github/workflows/aikit158-clean-fix.yml'

permissions:
  contents: write

jobs:
  reconcile-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/158-ql-shape-parity
          fetch-depth: 0
      - name: Install Rust 1.98 with rustfmt and clippy
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Keep JSON fixture typing test-only and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/aikit-core/src/knowledge_wiki_shape.rs')
          source = path.read_text()
          source = source.replace('use serde_json::Value;\n', '#[cfg(test)]\nuse serde_json::Value;\n', 1)
          path.write_text(source)
          PY
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Commit clean result and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/aikit158-clean-fix.yml
          git add crates/aikit-core/src/knowledge_wiki_shape.rs
          if ! git diff --cached --quiet; then
            git commit -m '[AIKIT158] Reconcile main and verify QL shape parity'
          fi
          git push origin HEAD:agent/158-ql-shape-parity
