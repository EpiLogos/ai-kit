name: Adaptive projection source receipt
on:
  push:
    branches: [agent/adaptive-wiki-projection-20260920]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact tracked source
        run: |
          git rev-parse HEAD > revision.txt
          git archive --format=tar.gz HEAD -o adaptive-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-source-${{ github.sha }}
          path: |
            adaptive-source.tar.gz
            revision.txt
          retention-days: 3
