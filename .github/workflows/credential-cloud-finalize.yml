name: Credential cloud finalize

on:
  push:
    branches: [agent/native-credential-provider]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: credential-cloud-finalize-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[cloud-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/native-credential-provider
          fetch-depth: 0
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup default 1.88.0
      - name: Apply surgical CLI integration
        run: python3 scripts/credential_cloud_finalize.py
      - name: Apply credential security boundary
        run: python3 scripts/credential_security_boundary_patch.py
      - name: Keep env discovery metadata-only
        run: python3 scripts/credential_env_discovery_patch.py
      - name: Refresh lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all
      - name: Commit generated integration
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aikit-cloud-finalize'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates scripts
          if ! git diff --cached --quiet; then
            git commit -m 'feat: wire credential CLI and lockfile [cloud-finalize]'
            git push origin HEAD:agent/native-credential-provider
          fi
      - name: Test all targets
        run: cargo test --workspace --all-targets --no-fail-fast -- --test-threads=1
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Diff hygiene
        run: git diff --check
