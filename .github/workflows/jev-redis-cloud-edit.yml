name: Jev NOW cloud native edit

# Temporary cloud checkout helper, not a runtime dependency. Only this
# commissioned branch may be written. No main update or protection bypass.
on:
  push:
    branches: [agent/388-jev-redis-now]
    paths:
      - '.github/workflows/jev-redis-cloud-edit.yml'
      - 'scripts/jev-redis/cloud-edit.json'
permissions:
  contents: write
concurrency:
  group: jev-now-cloud-edit
  cancel-in-progress: false
jobs:
  apply-native-edit:
    if: github.repository == 'EpiLogos/ai-kit' && github.ref == 'refs/heads/agent/388-jev-redis-now'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify the exact native patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/jev-redis/cloud-edit.json; then
            python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, subprocess
          packet_path = pathlib.Path('scripts/jev-redis/cloud-edit.json')
          if packet_path.stat().st_size > 2_000_000:
              raise SystemExit('Cloud edit packet exceeds bound')
          packet = json.loads(packet_path.read_text())
          if packet['schema'] != 'aikit.cloud-native-edit/v1':
              raise SystemExit('Unrecognised edit packet')
          base = packet['base_revision']
          if len(base) != 40 or any(c not in '0123456789abcdef' for c in base):
              raise SystemExit('Invalid source revision')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, 'HEAD']).split(b'\0')
          allowed = {b'.github/workflows/jev-redis-cloud-edit.yml', b'scripts/jev-redis/cloud-edit.json'}
          if any(p and p not in allowed for p in changed):
              raise SystemExit('Native source basis moved; reconcile, never force')
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(packet['patch_gzip_base64'], validate=True))) as compressed:
              patch = compressed.read(8_000_001)
          if len(patch) > 8_000_000 or hashlib.sha256(patch).hexdigest() != packet['patch_sha256']:
              raise SystemExit('Native patch digest or byte bound failed')
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          (root / 'native-edit.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(root / 'native-edit.patch')], check=True)
          raw = subprocess.check_output(['git', 'apply', '--numstat', '-z', str(root / 'native-edit.patch')])
          paths = []
          for row in raw.split(b'\0'):
              if not row:
                  continue
              path = row.split(b'\t', 2)[2].decode('utf-8')
              if not path.startswith(('crates/', 'docs/', 'scripts/jev-redis/', '.aikit/', 'skills/')) or '..' in pathlib.PurePosixPath(path).parts or '\n' in path:
                  raise SystemExit('Patch path is outside the commissioned native edit scope')
              paths.append(path)
          (root / 'native-edit-paths').write_bytes(b'\0'.join(p.encode() for p in paths) + b'\0')
          message = packet['message']
          if not isinstance(message, str) or not 1 <= len(message) <= 300 or '\n' in message:
              raise SystemExit('Invalid commit message')
          (root / 'native-edit-message').write_text(message + '\n')
          print('Native source paths:', *paths, sep='\n')
          PY
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install native Rust
        if: steps.patch.outputs.present == 'true'
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
        if: steps.patch.outputs.present == 'true'
      - name: Publish native source on the commissioned branch only
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/native-edit.patch"
          cargo fmt --all
          xargs -0 git add -- < "$RUNNER_TEMP/native-edit-paths"
          git rm scripts/jev-redis/cloud-edit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -F "$RUNNER_TEMP/native-edit-message"
          git restore --worktree .
          git push origin HEAD:refs/heads/agent/388-jev-redis-now
          git rev-parse HEAD | tee "$RUNNER_TEMP/native-edit-cut.txt"
          git diff HEAD^ HEAD --stat
          python3 - <<'PY'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          paths = [os.fsdecode(p) for p in (root / 'native-edit-paths').read_bytes().split(b'\0') if p]
          with tarfile.open(root / 'native-edit-source.tar.gz', 'w:gz') as archive:
              for path in paths:
                  p = pathlib.Path(path)
                  if p.is_file() and not p.is_symlink():
                      archive.add(p, arcname=path, recursive=False)
          PY
      - name: Compile and exercise the native Jev protocol
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-core --test jev_protocol -- --nocapture 2>&1 | tee "$RUNNER_TEMP/native-edit-test.log"
          cargo check --locked -p aikit-cli 2>&1 | tee -a "$RUNNER_TEMP/native-edit-test.log"
      - uses: actions/upload-artifact@v4
        if: always() && steps.patch.outputs.present == 'true'
        with:
          name: jev-now-native-edit-evidence
          path: |
            ${{ runner.temp }}/native-edit-cut.txt
            ${{ runner.temp }}/native-edit-test.log
            ${{ runner.temp }}/native-edit-source.tar.gz
          if-no-files-found: error
          retention-days: 14

  public-native-toolchain:
    if: github.run_number == 4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Fetch only the declared public toolchain and registry dependencies
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/jev-public-toolchain/cargo"
          export RUSTUP_HOME="$RUNNER_TEMP/jev-public-toolchain/rustup"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fetch --locked
          tar -C "$RUNNER_TEMP/jev-public-toolchain" -czf "$RUNNER_TEMP/jev-public-toolchain.tar.gz" rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu cargo/registry
          { rustc -Vv; cargo -V; } > "$RUNNER_TEMP/jev-public-toolchain.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: jev-public-native-toolchain
          path: |
            ${{ runner.temp }}/jev-public-toolchain.tar.gz
            ${{ runner.temp }}/jev-public-toolchain.txt
          if-no-files-found: error
          retention-days: 3
