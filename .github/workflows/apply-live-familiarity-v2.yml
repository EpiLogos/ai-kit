name: Apply live familiarity v2

on:
  push:
    branches:
      - agent/knowledge-navigation-live-familiarity-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/knowledge-navigation-live-familiarity-v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - name: Apply focused patch
        run: python scripts/apply_live_familiarity_v2.py
      - name: Focused verification
        run: cargo test -p aikit-cli --test live_familiarity_v2 --locked
      - name: Commit patched source
        run: |
          rm .github/workflows/apply-live-familiarity-v2.yml scripts/apply_live_familiarity_v2.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(knowledge): persist live navigation familiarity'
          git push origin HEAD:agent/knowledge-navigation-live-familiarity-v2
