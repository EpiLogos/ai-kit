name: AIKit 158 finalize current-main

on:
  push:
    branches:
      - agent/158-ql-shape-parity
    paths:
      - '.github/workflows/ai158-finalize-current-main.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/158-ql-shape-parity
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Join current main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Verify reconciled current-main tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Mark PR ready through native GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 160 --repo EpiLogos/ai-kit

      - name: Retire helper and return reconciled branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ai158-finalize-current-main.yml
          git commit -m '[AIKIT158] Retire current-main finalization helper'
          git push origin HEAD:agent/158-ql-shape-parity
