name: AIKit158 Resolve to QL-shaped Contemplate

on:
  push:
    branches:
      - agent/158-ql-shape-parity
    paths:
      - '.github/workflows/aikit158-resolve-contemplate.yml'

permissions:
  contents: write

jobs:
  integrate-verify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/158-ql-shape-parity
          fetch-depth: 0
      - name: Install Rust 1.98 with rustfmt and clippy
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Reconcile latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Carry exact ResolvePath into shaped contemplation and generation return
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/aikit-core/src/knowledge_wiki_shape.rs')
          source = path.read_text()

          old = 'use crate::resource::ResourceRef;'
          new = 'use crate::resource::{ResolveExpression, ResolvePath, ResourceRef};'
          if source.count(old) != 1:
              raise SystemExit(f'unexpected ResourceRef import count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = 'pub const QL_RELATIONAL_GENERATION_EXTENSION: &str = "aikit.ql-relational-generation/v1";\npub const DEFAULT_QL_SHAPE_BUDGET: usize = 24;'
          new = 'pub const QL_RELATIONAL_GENERATION_EXTENSION: &str = "aikit.ql-relational-generation/v1";\npub const QL_OPERATIVE_CONTEXT_EXTENSION: &str = "aikit.ql-operative-context/v1";\npub const DEFAULT_QL_SHAPE_BUDGET: usize = 24;'
          if source.count(old) != 1:
              raise SystemExit('QL extension constant anchor missing')
          source = source.replace(old, new, 1)

          marker = '#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct QlShapedContemplatePreflight {'
          operative = '''#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
pub struct QlOperativeContext {
    pub resolve_path_identity: String,
    pub expression: ResolveExpression,
    #[serde(default)]
    pub resolved_refs: Vec<ResourceRef>,
}

impl QlOperativeContext {
    pub fn from_resolve_path(path: &ResolvePath) -> Self {
        Self {
            resolve_path_identity: path.identity.clone(),
            expression: path.expression.clone(),
            resolved_refs: path
                .candidates
                .iter()
                .map(|candidate| candidate.resource.clone())
                .collect(),
        }
    }
}

'''
          if source.count(marker) != 1:
              raise SystemExit('QlShapedContemplatePreflight marker missing')
          source = source.replace(marker, operative + marker, 1)

          old = 'pub struct QlShapedContemplatePreflight {\n    pub version: String,\n    pub base: BoundedContemplatePreflight,\n    #[serde(default)]\n    pub shapes: Vec<WikiQlShapeField>,'
          new = 'pub struct QlShapedContemplatePreflight {\n    pub version: String,\n    pub base: BoundedContemplatePreflight,\n    #[serde(default, skip_serializing_if = "Option::is_none")]\n    pub operative: Option<QlOperativeContext>,\n    #[serde(default)]\n    pub shapes: Vec<WikiQlShapeField>,'
          if source.count(old) != 1:
              raise SystemExit('shaped preflight field anchor missing')
          source = source.replace(old, new, 1)

          old = 'Ok(QlShapedContemplatePreflight {\n        version: WIKI_QL_SHAPE_VERSION.into(),\n        base,\n        shapes,'
          new = 'Ok(QlShapedContemplatePreflight {\n        version: WIKI_QL_SHAPE_VERSION.into(),\n        base,\n        operative: None,\n        shapes,'
          if source.count(old) != 1:
              raise SystemExit('shaped preflight construction anchor missing')
          source = source.replace(old, new, 1)

          marker = 'pub fn attribute_ql_relational_generation(\n'
          addition = '''pub fn ql_shaped_resolve_contemplate_preflight(
    request: &ContemplateRequest<'_>,
    resource_dependencies: &[KnowledgeResourceDependency],
    resolve_path: &ResolvePath,
    max_objects: usize,
    relation_depth: usize,
    shape_budget: usize,
) -> Result<QlShapedContemplatePreflight> {
    let mut preflight = ql_shaped_contemplate_preflight(
        request,
        resource_dependencies,
        max_objects,
        relation_depth,
        shape_budget,
    )?;
    preflight.operative = Some(QlOperativeContext::from_resolve_path(resolve_path));
    Ok(preflight)
}

'''
          if source.count(marker) != 1:
              raise SystemExit('generation function marker missing')
          source = source.replace(marker, addition + marker, 1)

          marker = 'struct QlShapedExecutorAdapter<'
          addition = '''pub fn attribute_ql_relational_generation_from_resolve(
    reading: IntegrativeWikiReading,
    attribution: QlRelationalGenerationAttribution,
    resolve_path: &ResolvePath,
) -> Result<IntegrativeWikiReading> {
    let mut reading = attribute_ql_relational_generation(reading, attribution)?;
    let context = QlOperativeContext::from_resolve_path(resolve_path);
    let value = serde_json::to_value(&context).map_err(|error| {
        AikitError::new(
            "knowledge.wiki_ql_operative_context_serialization_failed",
            format!("failed to serialize operative Resolve context: {error}"),
        )
    })?;
    reading
        .reading
        .extensions
        .insert(QL_OPERATIVE_CONTEXT_EXTENSION.into(), value);
    WikiObject::Reading(reading.reading.clone()).validate()?;
    Ok(reading)
}

'''
          if source.count(marker) != 1:
              raise SystemExit('executor adapter marker missing')
          source = source.replace(marker, addition + marker, 1)

          marker = '#[cfg(test)]\nmod tests {'
          explicit = '''pub fn explicit_ql_shaped_resolve_contemplate(
    request: &ContemplateRequest<'_>,
    resource_dependencies: &[KnowledgeResourceDependency],
    resolve_path: &ResolvePath,
    max_objects: usize,
    relation_depth: usize,
    shape_budget: usize,
    executor: &mut dyn QlShapedContemplateExecutor,
) -> Result<QlShapedContemplateOutcome> {
    let preflight = ql_shaped_resolve_contemplate_preflight(
        request,
        resource_dependencies,
        resolve_path,
        max_objects,
        relation_depth,
        shape_budget,
    )?;
    let mut adapter = QlShapedExecutorAdapter {
        shaped: &preflight,
        executor,
    };
    let bounded = explicit_bounded_contemplate(
        request,
        resource_dependencies,
        max_objects,
        relation_depth,
        &mut adapter,
    )?;
    Ok(QlShapedContemplateOutcome {
        preflight,
        outcome: bounded.outcome,
    })
}

'''
          if source.count(marker) != 1:
              raise SystemExit('tests marker missing')
          source = source.replace(marker, explicit + marker, 1)

          test_marker = '    #[test]\n    fn mirrored_fixture_pins_the_exact_upstream_blob_and_cardinalities() {'
          test = '''    #[test]
    fn operative_context_retains_the_exact_resolve_expression_and_path_identity() {
        let expression = ResolveExpression::Binary {
            op: crate::resource::RelationOp::Contextualise,
            left: Box::new(ResolveExpression::horizon(
                crate::resource::AddressHorizon::H1,
                ResolveExpression::subject("source:criterion"),
            )),
            right: Box::new(ResolveExpression::horizon(
                crate::resource::AddressHorizon::H2,
                ResolveExpression::subject("wiki:reading:distinction"),
            )),
        };
        let resolve_path = ResolvePath {
            version: crate::resource::OPERATIVE_SYNTAX_VERSION.into(),
            identity: "resolve:path:criterion-through-distinction".into(),
            expression: expression.clone(),
            steps: Vec::new(),
            candidates: Vec::new(),
        };
        let context = QlOperativeContext::from_resolve_path(&resolve_path);
        assert_eq!(context.resolve_path_identity, resolve_path.identity);
        assert_eq!(context.expression, expression);
        assert!(context.resolved_refs.is_empty());
    }

'''
          if source.count(test_marker) != 1:
              raise SystemExit('fixture test marker missing')
          source = source.replace(test_marker, test + test_marker, 1)
          path.write_text(source)

          lib = Path('crates/aikit-core/src/lib.rs')
          source = lib.read_text()
          old = '''pub use knowledge_wiki_shape::{
    attribute_ql_relational_generation, explicit_ql_shaped_contemplate,
    ql_shaped_contemplate_preflight, wiki_constellation_grain, wiki_ql_shape_fields,
    QlRelationalGenerationAttribution, QlShapedContemplateExecutor, QlShapedContemplateOutcome,
    QlShapedContemplatePreflight, WikiQlConstellationGrain, WikiQlCoordinate,
    WikiQlGenerationSite, WikiQlRelationFamily, WikiQlShapeAddress, WikiQlShapeField,
    WikiQlShapeKind, DEFAULT_QL_SHAPE_BUDGET, QL_RELATIONAL_GENERATION_EXTENSION,
    QL_RELATIONAL_SIXFOLD_OPERATOR_REF, QL_RELATIONAL_SIXFOLD_SHAPE_REF,
    QL_SHAPE_CONTRACT_REF, QL_SHAPE_CONTRACT_VERSION, QL_SHAPE_UPSTREAM_BLOB,
    QL_SIX_BY_SIX_SHAPE_REF, WIKI_QL_SHAPE_VERSION,
};'''
          new = '''pub use knowledge_wiki_shape::{
    attribute_ql_relational_generation, attribute_ql_relational_generation_from_resolve,
    explicit_ql_shaped_contemplate, explicit_ql_shaped_resolve_contemplate,
    ql_shaped_contemplate_preflight, ql_shaped_resolve_contemplate_preflight,
    wiki_constellation_grain, wiki_ql_shape_fields, QlOperativeContext,
    QlRelationalGenerationAttribution, QlShapedContemplateExecutor, QlShapedContemplateOutcome,
    QlShapedContemplatePreflight, WikiQlConstellationGrain, WikiQlCoordinate,
    WikiQlGenerationSite, WikiQlRelationFamily, WikiQlShapeAddress, WikiQlShapeField,
    WikiQlShapeKind, DEFAULT_QL_SHAPE_BUDGET, QL_OPERATIVE_CONTEXT_EXTENSION,
    QL_RELATIONAL_GENERATION_EXTENSION, QL_RELATIONAL_SIXFOLD_OPERATOR_REF,
    QL_RELATIONAL_SIXFOLD_SHAPE_REF, QL_SHAPE_CONTRACT_REF, QL_SHAPE_CONTRACT_VERSION,
    QL_SHAPE_UPSTREAM_BLOB, QL_SIX_BY_SIX_SHAPE_REF, WIKI_QL_SHAPE_VERSION,
};'''
          if source.count(old) != 1:
              raise SystemExit('knowledge_wiki_shape export block drifted')
          lib.write_text(source.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Commit returned integration and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/aikit158-resolve-contemplate.yml
          git add crates/aikit-core/src/knowledge_wiki_shape.rs crates/aikit-core/src/lib.rs
          git commit -m '[AIKIT158] Carry ResolvePath through QL-shaped Contemplate'
          git push origin HEAD:agent/158-ql-shape-parity
