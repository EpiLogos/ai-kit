name: AIKit158 Resolve to QL-shaped Contemplate

on:
  push:
    branches:
      - agent/158-ql-shape-parity
    paths:
      - '.github/workflows/aikit158-resolve-contemplate.yml'

permissions:
  contents: write

jobs:
  integrate-verify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/158-ql-shape-parity
          fetch-depth: 0
      - name: Install Rust 1.98 with rustfmt and clippy
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Reconcile latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Apply and verify Resolve-to-Contemplate integration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/aikit158-resolve-contemplate-migrate.py
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Commit returned integration and remove migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/aikit158-resolve-contemplate.yml scripts/aikit158-resolve-contemplate-migrate.py
          git add crates/aikit-core/src/knowledge_wiki_shape.rs crates/aikit-core/src/lib.rs
          git commit -m '[AIKIT158] Carry ResolvePath through QL-shaped Contemplate'
          git push origin HEAD:agent/158-ql-shape-parity
