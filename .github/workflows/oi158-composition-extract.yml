name: OI158 composition extraction

on:
  push:
    branches:
      - feat/current-world-composition-readiness
    paths:
      - '.github/workflows/oi158-composition-extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/current-world-composition-readiness
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Extract scope-neutral composition kernel
        run: python3 .github/oi158_composition_extract.py
      - name: Format and prove AIKit core
        run: |
          cargo fmt --all
          cargo test -p aikit-core
      - name: Commit scope-neutral kernel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/aikit-core/src/composition.rs crates/aikit-core/src/lib.rs crates/aikit-core/tests/composition_body_v1.rs .github/oi158_composition_extract.py .github/workflows/oi158-composition-extract.yml
          git commit -m 'feat(composition): extract scope-neutral resolved body'
          git push origin HEAD:feat/current-world-composition-readiness
