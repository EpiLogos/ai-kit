name: Publish verified BKMR cut
on:
  push:
    branches: [agent/central-bkmr-154-consumer]
    paths: [.github/workflows/bkmr-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact verified code into existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Epii"
          git config user.email "frank.g.taylor97@gmail.com"
          git checkout --detach 05feb076f7f7536e136fb6efda935e937be01b12
          git merge --no-ff --no-commit e4c60666a091801a51d7e16b53ba17a918676095
          test "$(git write-tree)" = "b5f28bcebbf2d9c8ec3a9757642ae2ecb6503005"
          python3 - <<'PY_PACKET'
          import base64, gzip, hashlib, pathlib, os
          data = gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(data).hexdigest() == "ce50adcb62df1290b2e2d426be038438cbb126d3cad4cee6e6b039669ae929d2"
          pathlib.Path(os.environ["RUNNER_TEMP"], "bkmr.patch").write_bytes(data)
          PY_PACKET
          git apply --index --whitespace=error "$RUNNER_TEMP/bkmr.patch"
          test "$(git write-tree)" = "309fd1162b6bed1156f1e034713bf6427e744869"
          git restore --source="$GITHUB_SHA" --staged --worktree -- .github
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'feat(bkmr): consolidate verified Central/AIKit owner contract and native tests' | git commit-tree "$tree" -p "$GITHUB_SHA" -p 05feb076f7f7536e136fb6efda935e937be01b12 -p e4c60666a091801a51d7e16b53ba17a918676095)
          git push origin "$commit:refs/heads/agent/central-bkmr-154-consumer"
          printf 'PUBLISHED_COMMIT=%s\nVERIFIED_CODE_TREE=%s\n' "$commit" '309fd1162b6bed1156f1e034713bf6427e744869'
