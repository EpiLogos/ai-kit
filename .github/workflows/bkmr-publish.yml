name: Publish verified BKMR source cut
on:
  push:
    branches: [agent/bkmr-154-central-consumer]
    paths: [.github/workflows/bkmr-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish exact checked source bytes
        env:
          TARGET_BRANCH: agent/bkmr-154-central-consumer
          COMMIT_MESSAGE: "feat(bkmr): consume Central maps in knowledge and skill generation (#154)"
          PAYLOAD_SHA: 1c37b03ad9391da3ea68b6bdd5729a6395c7201393d346cd322235717a2ccd9c
          PAYLOAD: 
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          raw = lzma.decompress(base64.b64decode(os.environ['PAYLOAD']))
          assert hashlib.sha256(raw).hexdigest() == os.environ['PAYLOAD_SHA'], 'Payload corrupted'
          changes = json.loads(raw)
          staged = []
          for entry in changes:
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert not any(p.is_symlink() for p in [path, *path.parents]), 'Refuse symlink path'
              original = path.read_bytes() if path.exists() else b''
              actual = hashlib.sha256(original).hexdigest() if path.exists() else None
              assert actual == entry['before'], 'Concurrent source change: ' + str(path)
              if 'copy' in entry:
                  data = pathlib.Path(entry['copy']).read_bytes()
              else:
                  lines = original.decode('utf-8').splitlines(keepends=True)
                  for start, end, replacement in reversed(entry['edits']):
                      lines[start:end] = replacement.splitlines(keepends=True)
                  data = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == entry['after'], 'Reconstruction failed: ' + str(path)
              staged.append((path, data))
          for path, data in staged:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(str(path), hashlib.sha256(data).hexdigest())
          subprocess.run(['git','add','--',*[str(p) for p,_ in staged]],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m',os.environ['COMMIT_MESSAGE']],check=True)
          subprocess.run(['git','push','origin','HEAD:'+os.environ['TARGET_BRANCH']],check=True)
          PY
