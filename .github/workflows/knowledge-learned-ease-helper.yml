name: Knowledge learned ease helper

on:
  push:
    branches:
      - agent/knowledge-navigation-production-closure

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/knowledge-navigation-production-closure
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: git fetch origin main
      - run: python3 scripts/knowledge_learned_ease_patch.py
      - run: |
          rm scripts/knowledge_learned_ease_patch.py
          rm .github/workflows/knowledge-learned-ease-helper.yml
          rustfmt --edition 2021 crates/aikit-cli/src/app/knowledge.rs crates/aikit-cli/src/app/mod.rs crates/aikit-cli/tests/knowledge_application_v2.rs crates/aikit-core/src/lib.rs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(knowledge): apply learned ease to provider navigation"
          git push origin HEAD:agent/knowledge-navigation-production-closure
      - run: cargo check -p aikit-core -p aikit-store -p aikit-tui -p aikit-cli
      - run: cargo test -p aikit-cli --test knowledge_application_v2 -- --test-threads=1
