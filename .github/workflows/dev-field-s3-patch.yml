name: Development Field S3 patch

on:
  push:
    branches: [agent/261-development-field-s3]

permissions:
  contents: write

concurrency:
  group: development-field-s3-patch
  cancel-in-progress: true

jobs:
  patch-verify-commit:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: agent/261-development-field-s3
      - name: Apply the bounded S3 patch
        run: python3 .github/dev-field-s3-patch.py
      - name: Apply generated-code correction
        run: python3 .github/dev-field-s3-fix.py
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
      - name: Install tmux
        run: brew install tmux
      - name: Format changed Rust
        run: cargo fmt --all
      - name: Verify repository-owned gate
        shell: bash
        run: bash scripts/verify
      - name: Commit only the verified product tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Epii"
          git config user.email "EpiLogos@users.noreply.github.com"
          git add -A
          git commit -m "development-field: wire operative S3 substrate (#261)"
          git push origin HEAD:agent/261-development-field-s3
