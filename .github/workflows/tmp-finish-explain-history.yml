# One-shot helper. The base branch owns this workflow only long enough to execute
# the self-cleaning #44 production patch; the patch deletes it before publishing.
name: Temporary Explain History production closure

on:
  pull_request:

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Correct current core import path in generated acceptance test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp_finish_explain_history.sh')
          text = path.read_text()
          old = '''use aikit_cli::app::Service;
          use aikit_core::resource::ResourceRef;
          use aikit_core::{
              HistoryKind, SourceAuthority, EXPLAIN_ACTION_REF, HISTORY_ACTION_REF,
          };'''
          new = '''use aikit_cli::app::Service;
          use aikit_core::resource::{ResourceRef, SourceAuthority};
          use aikit_core::{HistoryKind, EXPLAIN_ACTION_REF, HISTORY_ACTION_REF};'''
          if old not in text:
              raise SystemExit('generated acceptance import block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Keep destination and route learned accessibility distinct
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp_finish_explain_history.sh')
          text = path.read_text()

          old = '''                });
            }
        }

        if let Some(store) = backend.familiarity()? {
