          if old not in text:
              raise SystemExit('Knowledge Explain insertion point not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'relation: "learned-accessibility".into(),',
              'relation: "learned-destination-accessibility".into(),',
              1,
          )

          old = '''    assert!(explain
        .facts
        .iter()
