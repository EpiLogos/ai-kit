name: Jev NOW reconcile current main
on:
  push:
    branches: [agent/388-jev-redis-now]
    paths: ['.github/workflows/jev-now-reconcile-main.yml']
permissions:
  contents: write
concurrency:
  group: jev-now-reconcile-main
  cancel-in-progress: true
jobs:
  reconcile:
    if: github.repository == 'EpiLogos/ai-kit' && github.ref == 'refs/heads/agent/388-jev-redis-now'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main while preserving the commissioned hunk on textual conflict
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff -X ours origin/main -m 'merge: reconcile current Prime main with Jev Redis NOW'
          git push origin HEAD:refs/heads/agent/388-jev-redis-now
          git rev-parse HEAD
