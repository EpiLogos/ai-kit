name: OI97 credential replay on Rust 1.98

on:
  push:
    branches: [converge/oi97-native-credentials-rust198]

permissions:
  contents: write

jobs:
  replay:
    if: ${{ !contains(github.event.head_commit.message, '[oi97-credential-replayed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: converge/oi97-native-credentials-rust198
          fetch-depth: 0
      - name: Install Rust 1.98 proof components
        run: rustup component add --toolchain 1.98.0 rustfmt clippy
      - name: Replay the one semantic credential commit over accepted Rust 1.98 main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Epii'
          git config user.email 'frank.g.taylor97@gmail.com'
          git cherry-pick -X ours c42c308984bd664357ed2636d31db238f9de7afa
          git rm .github/workflows/oi97-credential-rust198-replay.yml
          git commit --amend --no-edit
      - name: Apply bounded Rust 1.98 call-site compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          fixes = [
              ("crates/aikit-adapters/src/authored_wiki_source.rs", "ResourceRef::parse(&format!(", "ResourceRef::parse(format!("),
              ("crates/aikit-adapters/src/factory_run_thought_authored_wiki.rs", "ResourceRef::parse(&format!(", "ResourceRef::parse(format!("),
              ("crates/aikit-adapters/src/local_source_discovery.rs", "SourceRef::parse(&format!(", "SourceRef::parse(format!("),
              ("crates/aikit-adapters/src/projectcentral.rs", "SourceRevision::parse(&format!(", "SourceRevision::parse(format!("),
              ("crates/aikit-adapters/tests/bkmr_real.rs", "SourceRevision::parse(&format!(", "SourceRevision::parse(format!("),
          ]
          for path, old, new in fixes:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"compatibility insertion drifted for {path}: {text.count(old)} matches")
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Format replayed credential implementation on current toolchain
        run: cargo fmt --all
      - name: Prove current dependency graph and source integration
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked -p aikit-adapters --all-targets --no-fail-fast -- --test-threads=1
          cargo test --locked -p aikit-cli --all-targets --no-fail-fast -- --test-threads=1
          cargo test --locked -p aikit-core --all-targets --no-fail-fast -- --test-threads=1
          cargo test --locked -p aikit-store --all-targets --no-fail-fast -- --test-threads=1
          cargo test --locked -p aikit-tui --all-targets --no-fail-fast -- --test-threads=1
      - name: Push only the proven helper-free semantic tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit --amend -m 'feat(oi97): converge native credentials on Rust 1.98 main [oi97-credential-replayed]'
          git push --force-with-lease origin HEAD:converge/oi97-native-credentials-rust198
