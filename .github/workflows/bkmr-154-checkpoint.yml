name: Verify BKMR checkpoint transfer
on:
  push:
    branches: [agent/central-bkmr-154-consumer]
    paths: [.github/workflows/bkmr-154-checkpoint.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/central-bkmr-154-consumer
      - name: Verify and publish exact checkpoint
        shell: python
        run: |
          import pathlib,re,gzip,base64,hashlib,subprocess
          workflow = pathlib.Path('.github/workflows/bkmr-154-publish.yml')
          source = workflow.read_text()
          encoded = re.search("encoded = '''(.*?)'''", source, re.S).group(1)
          encoded = encoded.replace('T4aX7Th8sIN', 'T4aX7XTh8sIN').replace('SkFqFqCa4', 'SkFqCa4')
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '9c336e1312087179a3617bd19ea61bafbd58275dcc9d6ebc44af91a9f2404001'
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm',str(workflow),'.github/workflows/bkmr-154-checkpoint.yml'],check=True)
          subprocess.run(['git','config','user.name','Epii'],check=True)
          subprocess.run(['git','config','user.email','noreply@github.com'],check=True)
          subprocess.run(['git','commit','-m','feat(bkmr): consume Central maps and revisioned skill source trees'],check=True)
          subprocess.run(['git','push','origin','HEAD:agent/central-bkmr-154-consumer'],check=True)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bkmr-checkpoint-transfer-diagnostic
          path: .github/workflows/bkmr-154-publish.yml
          include-hidden-files: true
          retention-days: 1
