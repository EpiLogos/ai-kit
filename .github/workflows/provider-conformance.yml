name: Provider conformance

on:
  pull_request:
    paths:
      - 'crates/aikit-adapters/**'
      - 'provider-fixtures/**'
      - '.github/workflows/provider-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tmux-3-7c-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux 3.7c build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison pkg-config libevent-dev libncurses-dev
      - name: Build exact current tmux 3.7c
        run: |
          curl -fsSL -o /tmp/tmux.tar.gz https://github.com/tmux/tmux/releases/download/3.7c/tmux-3.7c.tar.gz
          mkdir /tmp/tmux-src
          tar -xzf /tmp/tmux.tar.gz -C /tmp/tmux-src --strip-components=1
          cd /tmp/tmux-src
          ./configure
          make -j2
          sudo make install
          test "$(tmux -V)" = "tmux 3.7c"
      - name: Run real SessionSpace/tmux provider proof
        run: cargo test -p aikit-adapters --test working_environment_tmux_real -- --nocapture

  classic-process-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real classic non-ACP process proof
        run: cargo test -p aikit-adapters --test connection_process_real real_classic_process -- --nocapture

  acp-python-sdk-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact ACP Python SDK target
        run: |
          git clone https://github.com/agentclientprotocol/python-sdk /tmp/acp-python-sdk
          git -C /tmp/acp-python-sdk checkout e668ed9e0034f5076749a6d74c5cec40ab610010
          python -m pip install /tmp/acp-python-sdk
      - name: Run real ACP target proof
        env:
          AIKIT_REQUIRE_ACP_REAL: '1'
          AIKIT_ACP_REAL_COMMAND: python /tmp/acp-python-sdk/examples/echo_agent.py
        run: cargo test -p aikit-adapters --test connection_process_real real_acp_sdk_target -- --nocapture

  vscode-1-133-real:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-fixtures/vscode-session-space
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: provider-fixtures/vscode-session-space/package.json
      - name: Install Extension Host fixture
        run: npm install
      - name: Exercise VS Code 1.133.0 public provider APIs
        run: xvfb-run -a npm test

  cmux-0-64-22-real:
    # A GitHub-hosted runner can install the app, but it cannot prove the user's
    # live control-socket semantics reliably. Enable this on the dedicated macOS
    # provider runner instead of turning a missing GUI/socket into a mock pass.
    if: ${{ vars.AIKIT_CMUX_REAL == 'true' }}
    runs-on: [self-hosted, macOS, cmux]
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact current cmux version
        run: |
          cmux --version
          cmux --version | grep -F '0.64.22'
      - name: Run real SessionSpace/cmux provider proof
        env:
          AIKIT_REQUIRE_CMUX_REAL: '1'
        run: cargo test -p aikit-adapters --test working_environment_cmux_real -- --nocapture
