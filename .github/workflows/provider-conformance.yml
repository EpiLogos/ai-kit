name: Provider conformance

on:
  pull_request:
    paths:
      - 'crates/aikit-adapters/**'
      - 'provider-fixtures/**'
      - '.github/workflows/provider-conformance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  provider-closure-one-shot:
    if: ${{ github.head_ref == 'agent/session-space-provider-closure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-space-provider-closure
          fetch-depth: 0
      - name: Add exact cmux v2 socket call for Surface focus
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/aikit-adapters/src/mux/cmux.rs')
          text = path.read_text()

          replacements = [
              (
                  '''use std::collections::{BTreeMap, BTreeSet};\nuse std::sync::Mutex;\n''',
                  '''use std::collections::{BTreeMap, BTreeSet};\n#[cfg(unix)]\nuse std::io::{BufRead, BufReader, Write};\n#[cfg(unix)]\nuse std::os::unix::net::UnixStream;\nuse std::sync::Mutex;\n#[cfg(unix)]\nuse std::time::Duration;\n''',
              ),
              (
                  '''pub struct CmuxProbe {\n    pub version: Option<String>,\n    /// Legacy/user-facing CLI commands reported by older capability responses.\n''',
                  '''pub struct CmuxProbe {\n    pub version: Option<String>,\n    /// Exact live control socket reported by the current provider.\n    pub socket_path: Option<String>,\n    /// Legacy/user-facing CLI commands reported by older capability responses.\n''',
              ),
              (
                  '''        Some(Self {\n            version: object\n                .get("version")\n                .and_then(|v| v.as_str())\n                .map(str::to_string),\n            commands,\n''',
                  '''        Some(Self {\n            version: object\n                .get("version")\n                .and_then(|v| v.as_str())\n                .map(str::to_string),\n            socket_path: object\n                .get("socket_path")\n                .and_then(|v| v.as_str())\n                .map(str::to_string),\n            commands,\n''',
              ),
              (
                  '''    fn must_owned(&self, args: &[String]) -> Result<Output> {\n        self.must(&args.iter().map(String::as_str).collect::<Vec<_>>())\n    }\n\n    // -----------------------------------------------------------------------\n    // Probing\n''',
                  '''    fn must_owned(&self, args: &[String]) -> Result<Output> {\n        self.must(&args.iter().map(String::as_str).collect::<Vec<_>>())\n    }\n\n    #[cfg(unix)]\n    fn call_v2(&self, method: &str, params: serde_json::Value) -> Result<serde_json::Value> {\n        let probe = self.probe()?;\n        let socket = std::env::var("CMUX_SOCKET_PATH")\n            .ok()\n            .filter(|value| !value.trim().is_empty())\n            .or(probe.socket_path)\n            .ok_or_else(|| {\n                AikitError::new(\n                    "mux.cmux_socket_missing",\n                    format!("cmux advertises `{method}` but did not disclose a live socket path"),\n                )\n            })?;\n\n        let mut stream = UnixStream::connect(&socket).map_err(|error| {\n            AikitError::new(\n                "mux.cmux_socket_connect_failed",\n                format!("could not connect to cmux socket `{socket}`: {error}"),\n            )\n        })?;\n        let timeout = Some(Duration::from_secs(10));\n        stream.set_read_timeout(timeout).map_err(|error| {\n            AikitError::new(\n                "mux.cmux_socket_timeout_failed",\n                format!("could not set cmux socket read timeout: {error}"),\n            )\n        })?;\n        stream.set_write_timeout(timeout).map_err(|error| {\n            AikitError::new(\n                "mux.cmux_socket_timeout_failed",\n                format!("could not set cmux socket write timeout: {error}"),\n            )\n        })?;\n\n        let request = serde_json::json!({\n            "id": 1,\n            "method": method,\n            "params": params,\n        });\n        writeln!(stream, "{request}").map_err(|error| {\n            AikitError::new(\n                "mux.cmux_socket_write_failed",\n                format!("could not write cmux `{method}` request: {error}"),\n            )\n        })?;\n        stream.flush().map_err(|error| {\n            AikitError::new(\n                "mux.cmux_socket_write_failed",\n                format!("could not flush cmux `{method}` request: {error}"),\n            )\n        })?;\n\n        let mut line = String::new();\n        BufReader::new(stream).read_line(&mut line).map_err(|error| {\n            AikitError::new(\n                "mux.cmux_socket_read_failed",\n                format!("could not read cmux `{method}` response: {error}"),\n            )\n        })?;\n        let response: serde_json::Value = serde_json::from_str(line.trim()).map_err(|error| {\n            AikitError::new(\n                "mux.cmux_socket_decode_failed",\n                format!("could not decode cmux `{method}` response: {error}"),\n            )\n        })?;\n        if response.get("id").and_then(serde_json::Value::as_u64) != Some(1) {\n            return Err(AikitError::new(\n                "mux.cmux_socket_response_mismatch",\n                format!("cmux `{method}` response did not match request id 1: {response}"),\n            ));\n        }\n        if response.get("ok").and_then(serde_json::Value::as_bool) != Some(true) {\n            return Err(AikitError::new(\n                "mux.cmux_socket_operation_failed",\n                format!("cmux `{method}` failed: {response}"),\n            ));\n        }\n        Ok(response.get("result").cloned().unwrap_or(serde_json::Value::Null))\n    }\n\n    #[cfg(not(unix))]\n    fn call_v2(&self, method: &str, _params: serde_json::Value) -> Result<serde_json::Value> {\n        Err(AikitError::new(\n            "mux.cmux_socket_unsupported",\n            format!("cmux v2 socket operation `{method}` requires a Unix host"),\n        ))\n    }\n\n    // -----------------------------------------------------------------------\n    // Probing\n''',
              ),
              (
                  '''        if let Some(surface) = &target.surface {\n            // SessionBinding.surfaces contains cmux Surface handles. The signed\n            // v0.64.22 CLI exposes the supported v2 `surface.focus` operation\n            // through `raw operation` even though it has no `focus-surface`\n            // compatibility subcommand. Keep the semantic Surface handle intact.\n            let params = serde_json::json!({ "surface_id": surface }).to_string();\n            self.must(&[\n                "raw",\n                "operation",\n                "surface.focus",\n                "--params-json",\n                &params,\n            ])?;\n        } else if let Some(workspace) = &target.session {\n''',
                  '''        if let Some(surface) = &target.surface {\n            // Current cmux reports stable Surface handles and the typed\n            // `surface.focus` method in `capabilities`, but the signed v0.64.22\n            // compatibility CLI does not expose a Surface-focus subcommand. Use\n            // the provider's documented JSON-lines socket for that exact method;\n            // older providers keep the legacy pane-focus path below.\n            let probe = self.probe_or_empty();\n            if probe.methods.contains("surface.focus") {\n                self.call_v2(\n                    "surface.focus",\n                    serde_json::json!({ "surface_id": surface }),\n                )?;\n            } else {\n                self.must(&["focus-pane", "--pane", surface])?;\n            }\n        } else if let Some(workspace) = &target.session {\n''',
              ),
          ]

          for old, new in replacements:
              assert text.count(old) == 1, f'cmux v2 bridge anchor changed: {old[:60]!r}'
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit source repair
        run: |
          git config user.name 'EpiLogos provider closure'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/aikit-adapters/src/mux/cmux.rs
          git commit -m 'fix(v2): focus cmux surfaces over the typed v2 socket'
          git push origin HEAD:agent/session-space-provider-closure

  tmux-3-7c-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux 3.7c build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison pkg-config libevent-dev libncurses-dev
      - name: Build exact current tmux 3.7c
        run: |
          curl -fsSL -o /tmp/tmux.tar.gz https://github.com/tmux/tmux/releases/download/3.7c/tmux-3.7c.tar.gz
          mkdir /tmp/tmux-src
          tar -xzf /tmp/tmux.tar.gz -C /tmp/tmux-src --strip-components=1
          cd /tmp/tmux-src
          ./configure
          make -j2
          sudo make install
          test "$(tmux -V)" = "tmux 3.7c"
      - name: Run real SessionSpace/tmux provider proof
        run: cargo test -p aikit-adapters --test working_environment_tmux_real -- --nocapture

  classic-process-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real classic non-ACP process proof
        run: cargo test -p aikit-adapters --test connection_process_real real_classic_process -- --nocapture

  acp-python-sdk-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact ACP Python SDK target
        run: |
          git clone https://github.com/agentclientprotocol/python-sdk /tmp/acp-python-sdk
          git -C /tmp/acp-python-sdk checkout e668ed9e0034f5076749a6d74c5cec40ab610010
          python -m pip install /tmp/acp-python-sdk
      - name: Run real ACP target proof
        env:
          AIKIT_REQUIRE_ACP_REAL: '1'
          AIKIT_ACP_REAL_COMMAND: python /tmp/acp-python-sdk/examples/echo_agent.py
        run: cargo test -p aikit-adapters --test connection_process_real real_acp_sdk_target -- --nocapture

  vscode-1-133-real:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-fixtures/vscode-session-space
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: provider-fixtures/vscode-session-space/package.json
      - name: Build external AIKit provider lifecycle probe
        run: cargo build --manifest-path ../../Cargo.toml -p aikit-adapters --bin aikit-working-environment-control-probe
      - name: Install Extension Host fixture
        run: npm install
      - name: Exercise VS Code 1.133.0 provider APIs and AgentSession lifecycle
        env:
          AIKIT_VSCODE_PROVIDER_PROBE: ${{ github.workspace }}/target/debug/aikit-working-environment-control-probe
        run: xvfb-run -a npm test

  cmux-0-64-22-real:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install exact cmux v0.64.22 release
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/cmux-v0.64.22.dmg"
          mount="$RUNNER_TEMP/cmux-mount"
          curl -fsSL -o "$dmg" https://github.com/manaflow-ai/cmux/releases/download/v0.64.22/cmux-macos.dmg
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          sudo rm -rf /Applications/cmux.app
          sudo ditto "$app" /Applications/cmux.app
          hdiutil detach "$mount"
          cli=/Applications/cmux.app/Contents/Resources/bin/cmux
          test -x "$cli"
          sudo ln -sf "$cli" /usr/local/bin/cmux
          cmux --version
          cmux --version | grep -F '0.64.22'
      - name: Launch real cmux automation socket
        run: |
          set -euo pipefail
          socket="$RUNNER_TEMP/aikit-cmux-v0.64.22.sock"
          daemon_socket="$RUNNER_TEMP/aikit-cmuxd-v0.64.22.sock"
          log="$RUNNER_TEMP/aikit-cmux-v0.64.22.log"
          rm -f "$socket" "$daemon_socket" "$log"
          env \
            -u CMUX_WORKSPACE_ID \
            -u CMUX_SURFACE_ID \
            -u CMUX_TAB_ID \
            -u CMUX_PANEL_ID \
            CMUX_SOCKET_MODE=automation \
            CMUX_ALLOW_SOCKET_OVERRIDE=1 \
            CMUX_SOCKET_PATH="$socket" \
            CMUXD_UNIX_PATH="$daemon_socket" \
            CMUX_DEBUG_LOG="$log" \
            CMUX_DISABLE_SESSION_RESTORE=1 \
            open -g /Applications/cmux.app
          for _ in {1..150}; do
            if [[ -S "$socket" ]]; then
              break
            fi
            sleep 0.2
          done
          if [[ ! -S "$socket" ]]; then
            echo "cmux automation socket did not appear: $socket" >&2
            ps aux | grep -i '[c]mux' || true
            test -f "$log" && tail -200 "$log" || true
            exit 1
          fi
          echo "CMUX_SOCKET_PATH=$socket" >> "$GITHUB_ENV"
          echo "CMUX_SOCKET_MODE=automation" >> "$GITHUB_ENV"
          echo "CMUX_ALLOW_SOCKET_OVERRIDE=1" >> "$GITHUB_ENV"
          echo "CMUXD_UNIX_PATH=$daemon_socket" >> "$GITHUB_ENV"
          cmux capabilities --json || cmux --json capabilities
      - name: Run real SessionSpace/cmux provider proof
        env:
          AIKIT_REQUIRE_CMUX_REAL: '1'
        run: cargo test -p aikit-adapters --test working_environment_cmux_real -- --nocapture

  cmux-0-64-22-selfhosted-real:
    if: ${{ vars.AIKIT_CMUX_REAL == 'true' }}
    runs-on: [self-hosted, macOS, cmux]
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact current cmux version
        run: |
          cmux --version
          cmux --version | grep -F '0.64.22'
      - name: Run real SessionSpace/cmux provider proof
        env:
          AIKIT_REQUIRE_CMUX_REAL: '1'
        run: cargo test -p aikit-adapters --test working_environment_cmux_real -- --nocapture
