name: Provider conformance

on:
  pull_request:
    paths:
      - 'crates/aikit-adapters/**'
      - 'provider-fixtures/**'
      - '.github/workflows/provider-conformance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oi97-credential-convergence:
    if: github.event_name == 'pull_request' && github.head_ref == 'converge/oi97-v2-native-credentials'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi97-v2-native-credentials
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compose credential capability into current Wiki/Flow V2
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path

          provider = Path('crates/aikit-adapters/src/credential_provider.rs')
          s = provider.read_text()
          old = 'use std::path::{Path, PathBuf};'
          new = 'use std::path::Path;\n#[cfg(target_os = "linux")]\nuse std::path::PathBuf;'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('credential provider import seam moved')
          provider.write_text(s)

          core = Path('crates/aikit-core/src/lib.rs')
          s = core.read_text()
          old = '''pub use credential::{
              resolve_credential, CredentialBindingState, CredentialProviderRejection, CredentialRef,
              CredentialResolution, CredentialResolutionRequest, ProviderResolutionExplanation,
              SecretMaterialisationClass, SecretProviderDescriptor, SecretProviderRef, SecretProviderTier,
              SecretRequirement, SecretRequirementRef, CREDENTIAL_RESOLUTION_VERSION,
          };'''
          new = '''pub use credential::{
              resolve_credential, resolve_registered_credential, CredentialBindingState,
              CredentialProviderRejection, CredentialRef, CredentialResolution, CredentialResolutionRequest,
              ProviderResolutionExplanation, SecretMaterialisationClass, SecretProvider,
              SecretProviderDescriptor, SecretProviderRef, SecretProviderTier, SecretRequirement,
              SecretRequirementRef, SecretValue, CREDENTIAL_RESOLUTION_VERSION,
          };'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'resolve_registered_credential' not in s:
              raise SystemExit('core credential export seam moved')
          core.write_text(s)

          main = Path('crates/aikit-cli/src/main.rs')
          s = main.read_text()
          import_old = 'use aikit_cli::{hook, multicall, run, ui};'
          import_new = 'use aikit_cli::{credential, hook, multicall, run, ui};'
          if import_old in s:
              s = s.replace(import_old, import_new, 1)
          elif import_new not in s:
              raise SystemExit('CLI import seam moved')

          dispatch_anchor = '        Some(Command::Doctor(a)) => cmd_doctor(cwd, a),\n'
          credential_arm = '        Some(Command::Credential(c)) => cmd_credential(cwd, c, json_mode),\n'
          if credential_arm not in s:
              if dispatch_anchor not in s:
                  raise SystemExit('CLI dispatch seam moved')
              s = s.replace(dispatch_anchor, dispatch_anchor + credential_arm, 1)

          start = s.index('fn cmd_explain(cwd: &std::path::Path, a: ExplainArgs) -> Result<Reply> {')
          end = s.index('\nfn cmd_history(cwd: &std::path::Path, a: HistoryArgs) -> Result<Reply> {', start)
          replacement = r'''fn cmd_explain(cwd: &std::path::Path, a: ExplainArgs) -> Result<Reply> {
              if let Some(credential_ref) = a.credential {
                  let service = Service::discover(cwd)?;
                  let request = credential::CredentialRequest {
                      credential: aikit_core::credential::CredentialRef::new(credential_ref)?,
                      consumer_ref: "operator:aikit-explain".into(),
                      purpose: "credential resolution explanation".into(),
                      env_var: a.env_var,
                      project_env: a.project_env,
                      from_env: a.from_env,
                      headless: a.headless,
                  };
                  let inspection = credential::inspect(service.home(), &request)?;
                  return Ok(reply(
                      &service,
                      jval!({
                          "credential": request.credential.as_str(),
                          "resolution": inspection.resolution,
                          "persisted_binding": inspection.persisted_binding,
                          "native_provider": inspection.native_provider,
                          "env_available": inspection.env_available,
                      }),
                      vec![],
                  ));
              }

              let capability = a.capability.ok_or_else(|| {
                  AikitError::new(
                      "cli.usage",
                      "pass a capability/Resource id or --credential CREDENTIAL",
                  )
              })?;
              use aikit_core::resource::ResourceRef;

              let mut service = Service::discover(cwd)?;
              let capsule_candidate = CapsuleId::parse(&capability).ok();
              if let Some(id) = capsule_candidate.as_ref() {
                  if let Some(explanation) = service.resolved().explain(id) {
                      let data = jval!({
                          "id": explanation.id.to_string(),
                          "revision": explanation.revision.as_ref().map(|revision| revision.as_str()),
                          "active": explanation.active,
                          "declared_enabled": explanation.declared_enabled,
                          "selected_by": explanation.selected_by,
                          "required_by": explanation.required_by,
                          "dependencies": explanation.dependencies,
                          "exports": explanation.exports,
                          "skill_usage_overlays": explanation.skill_usage_overlays,
                          "unavailable": explanation.unavailable.as_ref().map(|r| r.describe()),
                          "render": explanation.render(),
                      });
                      return Ok(reply(&service, data, vec![]));
                  }
              }

              let resource = ResourceRef::parse(&capability)?;
              let evidence = {
                  let application = ApplicationService::new(&mut service);
                  application.explain_evidence(&resource)
              };
              match evidence {
                  Ok(evidence) => Ok(reply(&service, jval!(evidence), vec![])),
                  Err(error) if capsule_candidate.is_some() => {
                      let id = capsule_candidate.expect("checked above");
                      Err(AikitError::new(
                          "resolution.unknown_capability",
                          format!("{id} is not in the catalogue for this context"),
                      )
                      .with("capability", id.to_string())
                      .with("evidence_error", error.code()))
                  }
                  Err(error) => Err(error),
              }
          }

          fn cmd_credential(cwd: &std::path::Path, command: CredentialCmd, json_mode: bool) -> Result<Reply> {
              let service = Service::discover(cwd)?;
              match command.command {
                  CredentialSub::Setup(a) => {
                      let request = credential::CredentialRequest {
                          credential: aikit_core::credential::CredentialRef::new(a.credential)?,
                          consumer_ref: a.consumer,
                          purpose: a.purpose,
                          env_var: a.env_var,
                          project_env: a.project_env,
                          from_env: a.from_env,
                          headless: a.headless || json_mode,
                      };
                      let outcome = credential::setup(service.home(), &request)?;
                      Ok(reply(
                          &service,
                          jval!({
                              "credential": request.credential.as_str(),
                              "newly_bound": outcome.newly_bound,
                              "binding": outcome.binding,
                              "resolution": outcome.resolution,
                          }),
                          vec![],
                      ))
                  }
                  CredentialSub::Explain(a) => {
                      let request = credential::CredentialRequest {
                          credential: aikit_core::credential::CredentialRef::new(a.credential)?,
                          consumer_ref: a.consumer,
                          purpose: a.purpose,
                          env_var: a.env_var,
                          project_env: a.project_env,
                          from_env: a.from_env,
                          headless: a.headless || json_mode,
                      };
                      let inspection = credential::inspect(service.home(), &request)?;
                      Ok(reply(
                          &service,
                          jval!({
                              "credential": request.credential.as_str(),
                              "resolution": inspection.resolution,
                              "persisted_binding": inspection.persisted_binding,
                              "native_provider": inspection.native_provider,
                              "env_available": inspection.env_available,
                          }),
                          vec![],
                      ))
                  }
                  CredentialSub::List(_) => {
                      let bindings = aikit_store::CredentialBindingStore::new(service.home()).list()?;
                      Ok(reply(
                          &service,
                          jval!({ "bindings": bindings, "count": bindings.len() }),
                          vec![],
                      ))
                  }
              }
          }
          '''
          s = s[:start] + replacement + s[end:]
          main.write_text(s)
          PY
          cargo fmt --all
          cargo check --workspace --all-targets
      - name: Verify exact current V2 composition
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p aikit-core
          cargo test -p aikit-store
          cargo test -p aikit-adapters
          cargo test -p aikit-cli
          cargo test -p aikit-tui
          cargo clippy --workspace --all-targets -- -D warnings
          bash scripts/verify
      - name: Commit only semantic result
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/provider-conformance.yml .github/workflows/native-skills.yml
          rm -f .oi97-credential-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(v2): converge native credential providers'
          git push origin HEAD:converge/oi97-v2-native-credentials

  tmux-3-7c-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux 3.7c build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison pkg-config libevent-dev libncurses-dev
      - name: Build exact current tmux 3.7c
        run: |
          curl -fsSL -o /tmp/tmux.tar.gz https://github.com/tmux/tmux/releases/download/v3.7c/tmux-3.7c.tar.gz
          mkdir /tmp/tmux-src
          tar -xzf /tmp/tmux.tar.gz -C /tmp/tmux-src --strip-components=1
          cd /tmp/tmux-src
          ./configure
          make -j2
          sudo make install
          test "$(tmux -V)" = "tmux 3.7c"
      - name: Run real SessionSpace/tmux provider proof
        run: cargo test -p aikit-adapters --test working_environment_tmux_real -- --nocapture

  classic-process-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real classic non-ACP process proof
        run: cargo test -p aikit-adapters --test connection_process_real real_classic_process -- --nocapture

  acp-python-sdk-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact ACP Python SDK target
        run: |
          git clone https://github.com/agentclientprotocol/python-sdk /tmp/acp-python-sdk
          git -C /tmp/acp-python-sdk checkout e668ed9e0034f5076749a6d74c5cec40ab610010
          python -m pip install /tmp/acp-python-sdk
      - name: Run real ACP target proof
        env:
          AIKIT_REQUIRE_ACP_REAL: '1'
          AIKIT_ACP_REAL_COMMAND: python /tmp/acp-python-sdk/examples/echo_agent.py
        run: cargo test -p aikit-adapters --test connection_process_real real_acp_sdk_target -- --nocapture

  vscode-1-133-real:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-fixtures/vscode-session-space
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: provider-fixtures/vscode-session-space/package.json
      - name: Build external AIKit provider lifecycle probe
        run: cargo build --manifest-path ../../Cargo.toml -p aikit-adapters --bin aikit-working-environment-control-probe
      - name: Install Extension Host fixture
        run: npm install
      - name: Exercise VS Code 1.133.0 provider APIs and AgentSession lifecycle
        env:
          AIKIT_VSCODE_PROVIDER_PROBE: ${{ github.workspace }}/target/debug/aikit-working-environment-control-probe
        run: xvfb-run -a npm test

  cmux-0-64-22-real:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install exact cmux v0.64.22 release
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/cmux-v0.64.22.dmg"
          mount="$RUNNER_TEMP/cmux-mount"
          curl -fsSL -o "$dmg" https://github.com/manaflow-ai/cmux/releases/download/v0.64.22/cmux-macos.dmg
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          sudo rm -rf /Applications/cmux.app
          sudo ditto "$app" /Applications/cmux.app
          hdiutil detach "$mount"
          cli=/Applications/cmux.app/Contents/Resources/bin/cmux
          test -x "$cli"
          sudo ln -sf "$cli" /usr/local/bin/cmux
          cmux --version
          cmux --version | grep -F '0.64.22'
      - name: Launch real cmux automation socket
        run: |
          set -euo pipefail
          socket="$RUNNER_TEMP/aikit-cmux-v0.64.22.sock"
          daemon_socket="$RUNNER_TEMP/aikit-cmuxd-v0.64.22.sock"
          log="$RUNNER_TEMP/aikit-cmux-v0.64.22.log"
          rm -f "$socket" "$daemon_socket" "$log"
          env \
            -u CMUX_WORKSPACE_ID \
            -u CMUX_SURFACE_ID \
            -u CMUX_TAB_ID \
            -u CMUX_PANEL_ID \
            CMUX_SOCKET_MODE=automation \
            CMUX_ALLOW_SOCKET_OVERRIDE=1 \
            CMUX_SOCKET_PATH="$socket" \
            CMUXD_UNIX_PATH="$daemon_socket" \
            CMUX_DEBUG_LOG="$log" \
            CMUX_DISABLE_SESSION_RESTORE=1 \
            open -g /Applications/cmux.app
          for _ in {1..150}; do
            if [[ -S "$socket" ]]; then
              break
            fi
            sleep 0.2
          done
          if [[ ! -S "$socket" ]]; then
            echo "cmux automation socket did not appear: $socket" >&2
            ps aux | grep -i '[c]mux' || true
            test -f "$log" && tail -200 "$log" || true
            exit 1
          fi
          echo "CMUX_SOCKET_PATH=$socket" >> "$GITHUB_ENV"
          echo "CMUX_SOCKET_MODE=automation" >> "$GITHUB_ENV"
          echo "CMUX_ALLOW_SOCKET_OVERRIDE=1" >> "$GITHUB_ENV"
          echo "CMUXD_UNIX_PATH=$daemon_socket" >> "$GITHUB_ENV"
          cmux capabilities --json || cmux --json capabilities
      - name: Run real SessionSpace/cmux provider proof
        env:
          AIKIT_REQUIRE_CMUX_REAL: '1'
        run: cargo test -p aikit-adapters --test working_environment_cmux_real -- --nocapture

  cmux-0-64-22-selfhosted-real:
    if: ${{ vars.AIKIT_CMUX_REAL == 'true' }}
    runs-on: [self-hosted, macOS, cmux]
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact current cmux version
        run: |
          cmux --version
          cmux --version | grep -F '0.64.22'
      - name: Run real SessionSpace/cmux provider proof
        env:
          AIKIT_REQUIRE_CMUX_REAL: '1'
        run: cargo test -p aikit-adapters --test working_environment_cmux_real -- --nocapture
