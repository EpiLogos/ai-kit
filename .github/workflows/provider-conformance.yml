name: Provider conformance

on:
  pull_request:
    paths:
      - 'crates/aikit-adapters/**'
      - 'provider-fixtures/**'
      - '.github/workflows/provider-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tmux-3-7c-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux 3.7c build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison pkg-config libevent-dev libncurses-dev
      - name: Build exact current tmux 3.7c
        run: |
          curl -fsSL -o /tmp/tmux.tar.gz https://github.com/tmux/tmux/releases/download/3.7c/tmux-3.7c.tar.gz
          mkdir /tmp/tmux-src
          tar -xzf /tmp/tmux.tar.gz -C /tmp/tmux-src --strip-components=1
          cd /tmp/tmux-src
          ./configure
          make -j2
          sudo make install
          test "$(tmux -V)" = "tmux 3.7c"
      - name: Run real SessionSpace/tmux provider proof
        run: cargo test -p aikit-adapters --test working_environment_tmux_real -- --nocapture

  classic-process-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real classic non-ACP process proof
        run: cargo test -p aikit-adapters --test connection_process_real real_classic_process -- --nocapture

  acp-python-sdk-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact ACP Python SDK target
        run: |
          git clone https://github.com/agentclientprotocol/python-sdk /tmp/acp-python-sdk
          git -C /tmp/acp-python-sdk checkout e668ed9e0034f5076749a6d74c5cec40ab610010
          python -m pip install /tmp/acp-python-sdk
      - name: Run real ACP target proof
        env:
          AIKIT_REQUIRE_ACP_REAL: '1'
          AIKIT_ACP_REAL_COMMAND: python /tmp/acp-python-sdk/examples/echo_agent.py
        run: cargo test -p aikit-adapters --test connection_process_real real_acp_sdk_target -- --nocapture

  vscode-1-133-real:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-fixtures/vscode-session-space
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: provider-fixtures/vscode-session-space/package.json
      - name: Build external AIKit provider lifecycle probe
        run: cargo build --manifest-path ../../Cargo.toml -p aikit-adapters --bin aikit-working-environment-control-probe
      - name: Install Extension Host fixture
        run: npm install
      - name: Exercise VS Code 1.133.0 provider APIs and AgentSession lifecycle
        env:
          AIKIT_VSCODE_PROVIDER_PROBE: ${{ github.workspace }}/target/debug/aikit-working-environment-control-probe
        run: xvfb-run -a npm test

  cmux-0-64-22-real:
    # cmux itself ships an automation socket mode. Exercise the exact signed
    # v0.64.22 release on a clean hosted Mac so this requirement is reproducible
    # and does not depend on one developer's persistent desktop state.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install exact cmux v0.64.22 release
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/cmux-v0.64.22.dmg"
          mount="$RUNNER_TEMP/cmux-mount"
          curl -fsSL -o "$dmg" https://github.com/manaflow-ai/cmux/releases/download/v0.64.22/cmux-macos.dmg
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          sudo rm -rf /Applications/cmux.app
          sudo ditto "$app" /Applications/cmux.app
          hdiutil detach "$mount"
          cli=/Applications/cmux.app/Contents/Resources/bin/cmux
          test -x "$cli"
          sudo ln -sf "$cli" /usr/local/bin/cmux
          cmux --version
          cmux --version | grep -F '0.64.22'
      - name: Launch real cmux automation socket
        run: |
          set -euo pipefail
          socket="$RUNNER_TEMP/aikit-cmux-v0.64.22.sock"
          daemon_socket="$RUNNER_TEMP/aikit-cmuxd-v0.64.22.sock"
          log="$RUNNER_TEMP/aikit-cmux-v0.64.22.log"
          rm -f "$socket" "$daemon_socket" "$log"
          env \
            -u CMUX_WORKSPACE_ID \
            -u CMUX_SURFACE_ID \
            -u CMUX_TAB_ID \
            -u CMUX_PANEL_ID \
            CMUX_SOCKET_MODE=automation \
            CMUX_ALLOW_SOCKET_OVERRIDE=1 \
            CMUX_SOCKET_PATH="$socket" \
            CMUXD_UNIX_PATH="$daemon_socket" \
            CMUX_DEBUG_LOG="$log" \
            CMUX_DISABLE_SESSION_RESTORE=1 \
            open -g /Applications/cmux.app
          for _ in {1..150}; do
            if [[ -S "$socket" ]]; then
              break
            fi
            sleep 0.2
          done
          if [[ ! -S "$socket" ]]; then
            echo "cmux automation socket did not appear: $socket" >&2
            ps aux | grep -i '[c]mux' || true
            test -f "$log" && tail -200 "$log" || true
            exit 1
          fi
          echo "CMUX_SOCKET_PATH=$socket" >> "$GITHUB_ENV"
          echo "CMUX_SOCKET_MODE=automation" >> "$GITHUB_ENV"
          echo "CMUX_ALLOW_SOCKET_OVERRIDE=1" >> "$GITHUB_ENV"
          echo "CMUXD_UNIX_PATH=$daemon_socket" >> "$GITHUB_ENV"
          cmux capabilities --json || cmux --json capabilities
      - name: Run real SessionSpace/cmux provider proof
        env:
          AIKIT_REQUIRE_CMUX_REAL: '1'
        run: cargo test -p aikit-adapters --test working_environment_cmux_real -- --nocapture

  cmux-0-64-22-selfhosted-real:
    # Keep the persistent-user-host lane as an additional specimen when present;
    # it no longer substitutes for the reproducible clean-host proof above.
    if: ${{ vars.AIKIT_CMUX_REAL == 'true' }}
    runs-on: [self-hosted, macOS, cmux]
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact current cmux version
        run: |
          cmux --version
          cmux --version | grep -F '0.64.22'
      - name: Run real SessionSpace/cmux provider proof
        env:
          AIKIT_REQUIRE_CMUX_REAL: '1'
        run: cargo test -p aikit-adapters --test working_environment_cmux_real -- --nocapture
