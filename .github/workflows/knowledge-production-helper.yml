name: Knowledge production helper

on:
  push:
    branches:
      - agent/knowledge-navigation-production-closure

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/knowledge-navigation-production-closure
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply production Knowledge patch
        run: python3 scripts/knowledge_production_patch.py
      - name: Remove helper artifacts
        run: |
          rm scripts/knowledge_production_patch.py
          rm .github/workflows/knowledge-production-helper.yml
      - name: Format only touched Rust files
        shell: bash
        run: |
          cargo fmt --all
          allowed='^(crates/aikit-core/src/knowledge.rs|crates/aikit-store/src/lib.rs|crates/aikit-store/src/knowledge_application.rs|crates/aikit-cli/src/app/mod.rs|crates/aikit-cli/src/app/knowledge.rs)$'
          while IFS= read -r file; do
            if [[ "$file" =~ ^crates/ ]] && [[ ! "$file" =~ $allowed ]]; then
              git checkout -- "$file"
            fi
          done < <(git diff --name-only)
      - name: Commit production integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(knowledge): own production materialisation and history"
          git push origin HEAD:agent/knowledge-navigation-production-closure
      - name: Compile focused crates
        run: cargo check -p aikit-core -p aikit-store -p aikit-cli
      - name: Test Knowledge core and store
        run: |
          cargo test -p aikit-core knowledge --lib
          cargo test -p aikit-store knowledge_application --lib
