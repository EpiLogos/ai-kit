name: Provider closure one-shot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-current-cmux-probe:
    if: ${{ github.head_ref == 'agent/session-space-provider-closure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-space-provider-closure
          fetch-depth: 0
      - name: Reconcile cmux v0.64.22 capability methods with stable CLI commands
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/aikit-adapters/src/mux/cmux.rs')
          text = path.read_text()

          old = '''pub struct CmuxProbe {
    pub version: Option<String>,
    pub commands: BTreeSet<String>,
    pub features: BTreeMap<String, bool>,
'''
          new = '''pub struct CmuxProbe {
    pub version: Option<String>,
    /// Legacy/user-facing CLI commands reported by older capability responses.
    pub commands: BTreeSet<String>,
    /// Current cmux v2 socket methods. v0.64.22 keeps the legacy CLI command
    /// contract while advertising these method names from `capabilities`.
    pub methods: BTreeSet<String>,
    pub features: BTreeMap<String, bool>,
'''
          assert text.count(old) == 1, 'CmuxProbe field anchor changed'
          text = text.replace(old, new, 1)

          old = '''    pub fn has_command(&self, name: &str) -> bool {
        self.commands.contains(name)
    }
'''
          new = '''    pub fn has_command(&self, name: &str) -> bool {
        if self.commands.contains(name) {
            return true;
        }

        // cmux v0.64.22's `capabilities` response advertises the v2 socket
        // method registry instead of the still-supported compatibility CLI
        // command list. Keep AIKit on the documented CLI contract, but accept a
        // method as evidence that its corresponding CLI operation is present.
        let method = match name {
            "new-workspace" => "workspace.create",
            "new-window" => "window.create",
            "move-workspace-to-window" => "workspace.move_to_window",
            "new-split" => "surface.split",
            "new-pane" => "pane.create",
            "list-panes" => "pane.list",
            "list-pane-surfaces" => "pane.surfaces",
            "rename-tab" => "tab.action",
            "workspace-action" => "workspace.action",
            "notify" => "notification.create",
            "markdown" => "markdown.open",
            "respawn-pane" => "surface.respawn",
            "close-surface" => "surface.close",
            "close-workspace" => "workspace.close",
            "select-workspace" => "workspace.select",
            _ => return false,
        };
        self.methods.contains(method)
    }
'''
          assert text.count(old) == 1, 'has_command anchor changed'
          text = text.replace(old, new, 1)

          old = '''        let features = object
            .get("features")
'''
          new = '''        let methods = object
            .get("methods")
            .and_then(|m| m.as_array())
            .map(|items| {
                items
                    .iter()
                    .filter_map(|i| i.as_str())
                    .map(str::to_string)
                    .collect()
            })
            .unwrap_or_default();

        let features = object
            .get("features")
'''
          assert text.count(old) == 1, 'features parse anchor changed'
          text = text.replace(old, new, 1)

          old = '''            commands,
            features,
            reachable: true,
'''
          new = '''            commands,
            methods,
            features,
            reachable: true,
'''
          assert text.count(old) == 1, 'CmuxProbe construction anchor changed'
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit exact repair
        run: |
          rm .github/workflows/zz-provider-closure-one-shot.yml
          git config user.name 'EpiLogos provider closure'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/aikit-adapters/src/mux/cmux.rs .github/workflows/zz-provider-closure-one-shot.yml
          git commit -m 'fix(v2): read current cmux capability methods'
          git push origin HEAD:agent/session-space-provider-closure
