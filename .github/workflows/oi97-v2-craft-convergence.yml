name: OI97 V2 craft convergence

on:
  push:
    branches: [converge/oi97-v2-human-instruction-craft]
    paths:
      - '.github/workflows/oi97-v2-craft-convergence.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi97-v2-human-instruction-craft
          fetch-depth: 0
      - name: Recover only the owned #106 then #107 deltas
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            42127820d6e5bf4ea5ee248e88e305e14c5c1a7c \
            b217b27ad0935a94e2e5aeb6387f547df918f1a1 \
            3c3500b914731e278f81310f2661af06a6d434d7

          git diff --binary \
            42127820d6e5bf4ea5ee248e88e305e14c5c1a7c \
            b217b27ad0935a94e2e5aeb6387f547df918f1a1 -- \
            scripts/verify-native-skills.py \
            skills/fixtures/human-authority/cases.toml \
            skills/registry/capsules/guidance/aikit/living-project-collaboration/payload/guidance.md \
            skills/registry/capsules/skill/aikit/product-understanding/payload/SKILL.md \
            > /tmp/106.patch
          git apply --3way --index /tmp/106.patch

          git diff --binary \
            b217b27ad0935a94e2e5aeb6387f547df918f1a1 \
            3c3500b914731e278f81310f2661af06a6d434d7 -- \
            .github/workflows/native-skills.yml \
            scripts/verify-instruction-craft.py \
            skills/fixtures/instruction-craft/cases.toml \
            skills/registry/capsules/skill/aikit/skill-authoring/manifest.toml \
            skills/registry/capsules/skill/aikit/skill-authoring/payload/SKILL.md \
            skills/registry/capsules/skill/aikit/skill-authoring/payload/references/instruction-architecture-review.md \
            > /tmp/107.patch
          git apply --3way --index /tmp/107.patch
      - name: Prove current native Skill corpus
        run: |
          python3 scripts/verify-native-skills.py
          python3 scripts/verify-instruction-craft.py
      - name: Ensure no merge markers or patch sediment
        run: |
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!Cargo.lock'
          git diff --check --cached
      - name: Commit semantic convergence and retire one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oi97-v2-craft-convergence.yml
          git add -A
          git commit -m 'feat(v2): converge human authority and instruction craft'
          git push origin HEAD:converge/oi97-v2-human-instruction-craft
