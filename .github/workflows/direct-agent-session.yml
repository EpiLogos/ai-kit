name: Direct accepted Agent session
on:
  push:
    branches: [agent/direct-accepted-agent-session-20260920]
  pull_request:
    paths:
      - 'crates/aikit-cli/src/direct_agent_session.rs'
      - 'crates/aikit-cli/src/encounter_service.rs'
      - 'crates/aikit-cli/tests/direct_agent_session.rs'
      - 'crates/aikit-adapters/src/connection_process.rs'
      - 'crates/aikit-adapters/tests/human_authority_environment.rs'
      - 'tests/direct_agent_native_join.py'
      - '.github/workflows/direct-agent-session.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install repository formatter and lint
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: Publish the preserved bounded native implementation
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = agent/direct-accepted-agent-session-20260920
          if test -f .github/finish-direct.py; then
            python3 .github/finish-direct.py
            rustfmt --edition 2024 --config skip_children=true crates/aikit-cli/src/direct_agent_session.rs crates/aikit-cli/src/encounter_service.rs crates/aikit-cli/src/session_space_cli.rs crates/aikit-cli/tests/direct_agent_session.rs
            python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          allowed={'crates/aikit-cli/src/direct_agent_session.rs','crates/aikit-cli/src/encounter_service.rs','crates/aikit-cli/src/session_space_cli.rs','crates/aikit-cli/tests/direct_agent_session.rs'}
          assert changed <= allowed, changed
          PY
            git add crates/aikit-cli/src/direct_agent_session.rs crates/aikit-cli/src/encounter_service.rs crates/aikit-cli/src/session_space_cli.rs crates/aikit-cli/tests/direct_agent_session.rs
            git rm .github/finish-direct.py .github/repair-direct.py .github/disclose-direct.py
            git config user.name Epii
            git config user.email agent-session@users.noreply.github.com
            git commit -m 'feat(agent): disclose effective World and Skill prerequisites and recover the exact failed native body'
            git push origin HEAD:refs/heads/agent/direct-accepted-agent-session-20260920
          fi
      - name: Record actual source and interrupted changes
        if: always()
        run: |
          mkdir -p direct-agent-evidence
          git rev-parse HEAD > direct-agent-evidence/source-revision.txt
          git diff > direct-agent-evidence/uncommitted.patch
          git archive --format=tar.gz HEAD > direct-agent-evidence/source.tar.gz
      - name: Direct-session validation
        id: direct
        continue-on-error: true
        shell: bash
        run: cargo test --locked -p aikit-cli --test direct_agent_session 2>&1 | tee direct-agent-evidence/direct.log
      - name: Actual child-process authority boundary
        id: environment
        continue-on-error: true
        shell: bash
        run: cargo test --locked -p aikit-adapters --test human_authority_environment 2>&1 | tee direct-agent-evidence/environment.log
      - name: Full native regression suite
        id: all
        continue-on-error: true
        shell: bash
        run: cargo test --all-targets --locked 2>&1 | tee direct-agent-evidence/all.log
      - name: Full native strict lint
        id: lint
        continue-on-error: true
        shell: bash
        run: cargo clippy --all-targets --locked -- -D warnings 2>&1 | tee direct-agent-evidence/clippy.log
      - name: Build native CLI
        id: build
        continue-on-error: true
        shell: bash
        run: |
          cargo build --locked -p aikit-cli --bin aikit 2>&1 | tee direct-agent-evidence/build.log
          cp target/debug/aikit direct-agent-evidence/aikit
          strip direct-agent-evidence/aikit
          sha256sum direct-agent-evidence/aikit > direct-agent-evidence/binary-sha256.txt
      - name: Exact Central source acceptance dependency
        id: central
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/central-agent-owner
          printf '%s\n' d0001cb7ca9eb2886c7158f05aa65272da198fa1 > direct-agent-evidence/central-source-revision.txt
          curl --fail --silent --show-error --location https://codeload.github.com/EpiLogos/Central/tar.gz/d0001cb7ca9eb2886c7158f05aa65272da198fa1 | tar xz --strip-components=1 -C /tmp/central-agent-owner
          cargo build --locked --manifest-path /tmp/central-agent-owner/Cargo.toml -p ctrl --bin ctrl 2>&1 | tee direct-agent-evidence/central-build.log
      - name: Real native Central to ACP work and consequential recovery
        id: join
        continue-on-error: true
        shell: bash
        run: |
          python3 tests/direct_agent_native_join.py --ctrl /tmp/central-agent-owner/target/debug/ctrl --aikit "$PWD/target/debug/aikit" 2>&1 | tee direct-agent-evidence/native-join.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-agent-session-evidence
          path: direct-agent-evidence/
          retention-days: 7
      - name: Preserve every failed or unexecuted gate
        if: always()
        env:
          OUTCOMES: ${{ steps.direct.outcome }},${{ steps.environment.outcome }},${{ steps.all.outcome }},${{ steps.lint.outcome }},${{ steps.build.outcome }},${{ steps.central.outcome }},${{ steps.join.outcome }}
        run: test "$OUTCOMES" = 'success,success,success,success,success,success,success'
