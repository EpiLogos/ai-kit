name: Direct accepted Agent session
on:
  push:
    branches: [agent/direct-accepted-agent-session-20260920]
  pull_request:
    paths: ['crates/aikit-cli/src/direct_agent_session.rs', 'crates/aikit-cli/tests/direct_agent_session.rs', 'crates/aikit-adapters/src/connection_process.rs', 'crates/aikit-adapters/tests/human_authority_environment.rs', '.github/workflows/direct-agent-session.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Publish bounded native scope join on the owned branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = agent/direct-accepted-agent-session-20260920
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/aikit-cli/src/direct_agent_session.rs');s=p.read_text()
          needle='pub fn prepare(service: &Service, request: PrepareRequest) -> Result<Value> {'
          if 'pub fn scope(service:' not in s:
              assert s.count(needle)==1
              s=s.replace(needle,'''/// Read the actual native ProjectBinding, without preparation or authority.
          pub fn scope(service: &Service) -> Result<Value> {
              let cwd = std::fs::canonicalize(service.invocation_cwd()).map_err(io)?;
              let binding = aikit_tui::PaletteBackend::project_binding(service)?.ok_or_else(||
                  failure("direct_agent.scope_unbound", "No native Project binding at the disclosed location"))?;
              let central = crate::temporal::central_root_enclosing(Some(&cwd)).ok_or_else(||
                  failure("direct_agent.central_unbound", "The disclosed location is not in Central"))?;
              let central = std::fs::canonicalize(central).map_err(io)?;
              Ok(json!({"schema":"aikit.direct-agent-scope/v1", "project_ref":binding.project,
                  "cwd":cwd, "central_root":central, "binding":binding,
                  "execution_authority_granted":false, "provider_started":false}))
          }
          
          '''+needle)
              old='"profile_revision":binding.request.expected_revision,"prepared":ready'
              assert s.count(old)==1
              s=s.replace(old,'"profile_revision":binding.request.expected_revision,"project_ref":binding.project_context.project,"prepared":ready')
              p.write_text(s)
              p=Path('crates/aikit-cli/src/session_space_cli.rs');s=p.read_text()
              assert s.count('enum Command {')==1
              s=s.replace('enum Command {','enum Command {\n    /// Read the native ProjectBinding; no session or provider is created.\n    AgentSessionScope,',1)
              needle='        Command::AgentSessionPrepare { request_json } => emit('
              assert s.count(needle)==1
              s=s.replace(needle,'        Command::AgentSessionScope => emit(&crate::direct_agent_session::scope(&service)?),\n'+needle)
              p.write_text(s)
          PY
          rustfmt --edition 2024 --config skip_children=true crates/aikit-cli/src/direct_agent_session.rs crates/aikit-cli/src/session_space_cli.rs
          git config user.name Epii
          git config user.email agent-session@users.noreply.github.com
          git add crates/aikit-cli/src/direct_agent_session.rs crates/aikit-cli/src/session_space_cli.rs
          if ! git diff --cached --quiet; then
            git commit -m 'feat(agent): disclose native root and child Project bindings for Direct session consumers'
            git push origin HEAD:refs/heads/agent/direct-accepted-agent-session-20260920
          fi
      - name: Record exact committed source
        run: |
          mkdir -p direct-agent-evidence
          git rev-parse HEAD > direct-agent-evidence/source-revision.txt
          git diff --exit-code
          git archive --format=tar.gz HEAD > direct-agent-evidence/source.tar.gz
      - name: Direct-session validation
        id: direct
        continue-on-error: true
        shell: bash
        run: cargo test --locked -p aikit-cli --test direct_agent_session 2>&1 | tee direct-agent-evidence/direct.log
      - name: Actual child-process authority boundary
        id: environment
        continue-on-error: true
        shell: bash
        run: cargo test --locked -p aikit-adapters --test human_authority_environment 2>&1 | tee direct-agent-evidence/environment.log
      - name: Full native regression suite
        id: all
        continue-on-error: true
        shell: bash
        run: cargo test --all-targets --locked 2>&1 | tee direct-agent-evidence/all.log
      - name: Full native strict lint
        id: lint
        continue-on-error: true
        shell: bash
        run: cargo clippy --all-targets --locked -- -D warnings 2>&1 | tee direct-agent-evidence/clippy.log
      - name: Build native CLI
        id: build
        continue-on-error: true
        shell: bash
        run: |
          cargo build --locked -p aikit-cli --bin aikit 2>&1 | tee direct-agent-evidence/build.log
          cp target/debug/aikit direct-agent-evidence/aikit
          strip direct-agent-evidence/aikit
          sha256sum direct-agent-evidence/aikit > direct-agent-evidence/binary-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-agent-session-evidence
          path: direct-agent-evidence/
          retention-days: 7
      - name: Preserve every failed gate
        if: steps.direct.outcome != 'success' || steps.environment.outcome != 'success' || steps.all.outcome != 'success' || steps.lint.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
