name: Direct accepted Agent session
on:
  push:
    branches: [agent/direct-accepted-agent-session-20260920]
  pull_request:
    paths: ['crates/aikit-cli/src/direct_agent_session.rs', 'crates/aikit-cli/tests/direct_agent_session.rs', 'crates/aikit-adapters/src/connection_process.rs', 'crates/aikit-adapters/tests/human_authority_environment.rs', '.github/workflows/direct-agent-session.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Repair the three compiler errors on this isolated branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = agent/direct-accepted-agent-session-20260920
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/aikit-cli/src/direct_agent_session.rs');t=p.read_text()
          bad='let output = runner.run(&executable, &args, None)?;'
          if bad not in t: raise SystemExit(0)
          assert t.count(bad)==2
          t=t.replace(bad,'let mut argv = vec![executable];\n    argv.extend(args);\n    let output = runner.run(&argv)?;')
          old='SessionSpaceRef::parse(format!("session-space/direct-{id}"))';assert t.count(old)==1
          t=t.replace(old,'SessionSpaceRef::parse(&format!("session-space/direct-{id}"))');p.write_text(t)
          PY
          rustup component add rustfmt clippy
          rustfmt --edition 2024 --config skip_children=true crates/aikit-cli/src/direct_agent_session.rs
          git config user.name Epii
          git config user.email agent-session@users.noreply.github.com
          git add crates/aikit-cli/src/direct_agent_session.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(agent): use native argv seam and borrowed SessionSpace reference'
            git push origin HEAD:refs/heads/agent/direct-accepted-agent-session-20260920
          fi
      - name: Exact source and exit-preserving command recorder
        if: always()
        run: |
          set -euo pipefail
          mkdir -p direct-agent-evidence
          git rev-parse HEAD > direct-agent-evidence/source-revision.txt
          git diff > direct-agent-evidence/uncommitted.patch
          git archive --format=tar.gz HEAD > direct-agent-evidence/source.tar.gz
          cat > /tmp/direct-check.py <<'PY'
          import json,pathlib,subprocess,sys
          name,*command=sys.argv[1:]
          root=pathlib.Path('direct-agent-evidence')
          with (root/(name+'.log')).open('w') as log:
              process=subprocess.Popen(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              for line in process.stdout:
                  log.write(line);log.flush();sys.stdout.write(line);sys.stdout.flush()
              status=process.wait()
          (root/(name+'.exit.json')).write_text(json.dumps({'command':command,'exit_code':status}))
          raise SystemExit(status)
          PY
      - name: Native Direct-session validation
        id: direct
        continue-on-error: true
        run: python3 /tmp/direct-check.py direct cargo test --locked -p aikit-cli --test direct_agent_session
      - name: Real child-process authority boundary
        id: environment
        continue-on-error: true
        run: python3 /tmp/direct-check.py environment cargo test --locked -p aikit-adapters --test human_authority_environment
      - name: Full native regression suite
        id: all
        continue-on-error: true
        run: python3 /tmp/direct-check.py all cargo test --all-targets --locked
      - name: Strict full native lint
        id: lint
        continue-on-error: true
        run: python3 /tmp/direct-check.py clippy cargo clippy --all-targets --locked -- -D warnings
      - name: Build executable for owner integration
        id: build
        continue-on-error: true
        run: python3 /tmp/direct-check.py build cargo build --locked -p aikit-cli --bin aikit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-agent-session-evidence
          path: direct-agent-evidence/
          retention-days: 7
      - name: Assert every recorded command actually succeeded
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('direct-agent-evidence');failed=[]
          for name in ['direct','environment','all','clippy','build']:
              p=root/(name+'.exit.json')
              if not p.exists() or json.loads(p.read_text())['exit_code']!=0: failed.append(name)
          if failed: raise SystemExit('Failing or unexecuted checks: '+', '.join(failed))
          PY
