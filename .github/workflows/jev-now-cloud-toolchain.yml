name: Jev NOW cloud engineering toolchain

# A bounded engineering aid for environments whose only GitHub access is the
# connected API. These artifacts are build inputs, never runtime acceptance.
on:
  pull_request:
    paths: ['.github/workflows/jev-now-cloud-toolchain.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: ai-kit
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: EpiLogos/Central
          ref: 918fed159bee26b4fd1f20341f955cb6f60e1cbe
          path: Central
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: EpiLogos/Workcell
          ref: 58ceb4a6a0d4b8f25a6b2d01201798e5092b88c4
          path: Workcell
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: EpiLogos/Factory
          ref: e2d16dbdfabec4157e47028d1bbe7a8cf7b8fc59
          path: Factory
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: EpiLogos/Actuation
          ref: b88fa2a097f790222fd63f0ffd1b9b5a4cefde09
          path: Actuation
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: EpiLogos/QL-MEF
          ref: 2bcdc78c2f97ce13312bf96011bd18bea7b73ea5
          path: QL-MEF
          persist-credentials: false
      - name: Fetch the locked native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          mkdir -p evidence/toolchain
          rustc +1.98.0 -Vv > evidence/toolchain/versions.txt
          cargo +1.98.0 -V >> evidence/toolchain/versions.txt
          for repo in ai-kit Central Workcell Factory Actuation QL-MEF; do
            printf '%s %s\n' "$repo" "$(git -C "$repo" rev-parse HEAD)" >> evidence/toolchain/revisions.txt
            cargo +1.98.0 fetch --locked --manifest-path "$repo/Cargo.toml"
          done
          # No ~/.cargo/config or credentials are exported. Sparse registry and
          # package content are public immutable dependency inputs only.
          tar -C "${RUSTUP_HOME:-$HOME/.rustup}/toolchains" -czf evidence/toolchain/rust-1.98.0-linux.tar.gz 1.98.0-x86_64-unknown-linux-gnu
          tar -C "${CARGO_HOME:-$HOME/.cargo}" -czf evidence/toolchain/cargo-registry.tar.gz registry
      - name: Retain disposable-world native service tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y redis-server redis-tools ripgrep tmux
          mkdir -p evidence/toolchain/bin
          for tool in redis-server redis-cli rg tmux; do
            cp "$(command -v "$tool")" "evidence/toolchain/bin/$tool"
            ldd "$(command -v "$tool")" >> evidence/toolchain/native-libraries.txt
          done
          redis-server --version >> evidence/toolchain/versions.txt
          redis-cli --version >> evidence/toolchain/versions.txt
          rg --version >> evidence/toolchain/versions.txt
          tmux -V >> evidence/toolchain/versions.txt
          # Package contents, not machine/service state. Missing shared libraries
          # in the receiving sandbox are explicit, never a fake tool fallback.
          (cd evidence/toolchain && sha256sum *.tar.gz bin/* > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jev-now-cloud-engineering-toolchain
          path: evidence/toolchain/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
