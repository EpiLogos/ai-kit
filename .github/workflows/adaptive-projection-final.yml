name: Adaptive projection final verification
on:
  push:
    branches: [agent/adaptive-wiki-projection-20260920]
    paths: [.github/workflows/adaptive-projection-final.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/adaptive-wiki-projection-20260920
      - name: Bound status text as well as guidance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/adaptive-wiki-projection-20260920
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/aikit-cli/src/wiki_projection.rs')
          s = p.read_text()
          start = s.index('    let mut blocks = Vec::new();', s.index('pub fn context_blocks('))
          s = s[:start] + r'''    // Reserve a whole unavailable/withheld notification for every source first.
              // Otherwise a nearly full admitted fragment could push later status
              // messages beyond the bound or silently omit a revoked source.
              let notices: Vec<_> = sources.iter().map(|source| {
                  let address = source.as_str().unwrap();
                  let text = format!("[Wiki projection unavailable] {address}: unavailable or beyond context budget. Do not substitute a cached projection; resolve the current source before relying on it.");
                  let cost = aikit_core::estimate_tokens(&text).saturating_add(1);
                  (text, cost)
              }).collect();
              let reserved = notices.iter().fold(0_u32, |sum, (_, cost)| sum.saturating_add(*cost));
              if reserved > MAX_CONTEXT_TOKENS {
                  return Err(error("wiki_projection.source_budget", "declared source addresses exceed the disclosure budget; select a smaller bounded set"));
              }
              let mut blocks = Vec::new();
              let mut warnings = Vec::new();
              let mut remaining = MAX_CONTEXT_TOKENS - reserved;
              for (source, (notice, reserved_cost)) in sources.iter().zip(notices) {
                  let address = source.as_str().unwrap();
                  let result = address_path(address, project, central).and_then(|p| read(&p));
                  let block = match result {
                      Ok(reading) => {
                          let text = format!("[Current Wiki operational projection]\nSource: {address}\nSHA-256: {}\nThis replaces earlier operational guidance from this same source only. It does not rewrite governance or change permissions, trust or invocation policy. An empty body clears this source's prior projection.\n\n{}", reading.revision, reading.body);
                          let cost = aikit_core::estimate_tokens(&text).saturating_add(1);
                          if cost > remaining + reserved_cost {
                              warnings.push(format!("{address}: whole projection withheld by context budget; no partial rule injected"));
                              notice
                          } else {
                              remaining = remaining + reserved_cost - cost;
                              text
                          }
                      }
                      Err(e) => {
                          warnings.push(format!("{address}: {}", e.code()));
                          notice
                      }
                  };
                  blocks.push(block);
              }
              Ok((blocks, warnings))
          }
          '''
          p.write_text(s)
          p = Path('crates/aikit-cli/tests/wiki_projection.rs')
          p.write_text(p.read_text() + r'''
          #[test]
          fn unavailable_statuses_share_the_same_total_budget_as_guidance() {
              let temp = tempfile::tempdir().unwrap();
              let root = temp.path().canonicalize().unwrap();
              let file = source(&root);
              write(&file, &"guidance ".repeat(850));
              let addresses: Vec<toml::Value> = std::iter::once("project:ProjectCentral/agents/wiki/projection.md".to_string())
                  .chain((1..8).map(|i| format!("project:ProjectCentral/agents/wiki/missing-{i}.md")))
                  .map(toml::Value::String).collect();
              let config = toml::value::Table::from_iter([("sources".to_string(), toml::Value::Array(addresses))]);
              let (blocks, warnings) = projection::context_blocks(&config, Some(&root), None).unwrap();
              assert_eq!(blocks.len(), 8);
              assert!(!warnings.is_empty());
              assert!(aikit_core::estimate_tokens(&blocks.join("\n\n")) <= 2048);
              assert!(blocks.iter().skip(1).all(|s| s.contains("Do not substitute a cached projection")));
          }

          #[test]
          fn source_address_overflow_is_explicit_not_unbounded_context() {
              let addresses: Vec<_> = (0..8).map(|i| toml::Value::String(format!("project:{}-{i}.md", "x".repeat(4096)))).collect();
              let config = toml::value::Table::from_iter([("sources".to_string(), toml::Value::Array(addresses))]);
              let error = projection::context_blocks(&config, None, None).unwrap_err();
              assert_eq!(error.code(), "wiki_projection.source_budget");
          }
          ''')
          PY
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustfmt +1.98.0 --edition 2021 --config skip_children=true crates/aikit-cli/src/wiki_projection.rs crates/aikit-cli/tests/wiki_projection.rs
          rm .github/workflows/adaptive-projection-final.yml
          git add crates/aikit-cli/src/wiki_projection.rs crates/aikit-cli/tests/wiki_projection.rs .github/workflows/adaptive-projection-final.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: bound source revocation notices with operative projection context'
          git rev-parse HEAD > /tmp/adaptive-final-revision.txt
          git archive --format=tar.gz HEAD -o /tmp/adaptive-final-source.tar.gz
          git push origin HEAD:refs/heads/agent/adaptive-wiki-projection-20260920
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Native correction loop and all CLI library regressions
        shell: bash
        run: |
          set -o pipefail
          cargo +1.98.0 test --locked -p aikit-cli --test wiki_projection --test guidance_delivery --test skill_overlay --test hook_stdout_inject --test hook_bypass 2>&1 | tee /tmp/adaptive-final-integration.log
          cargo +1.98.0 test --locked -p aikit-cli --lib 2>&1 | tee /tmp/adaptive-final-library.log
          cargo +1.98.0 clippy --locked -p aikit-cli --lib --bin aikit --test wiki_projection -- -D warnings 2>&1 | tee /tmp/adaptive-final-clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-final-${{ github.run_id }}
          path: /tmp/adaptive-final-*
          retention-days: 7
