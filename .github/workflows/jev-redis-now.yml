name: Jev Redis NOW native integration

on:
  push:
    branches: [agent/388-jev-redis-now]
  pull_request:
    paths:
      - '.github/workflows/jev-redis-now.yml'
      - 'crates/**'
      - 'scripts/jev-redis/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-redis-now-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'

jobs:
  basis:
    name: Exact cloud source basis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Capture current native owners without touching an installed World
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jev-now-basis/repos" "$RUNNER_TEMP/jev-now-basis/export"
          git rev-parse HEAD > "$RUNNER_TEMP/jev-now-basis/aikit.sha"
          for owner in Central Workcell Factory Actuation O-I QL-MEF; do
            git clone --quiet --depth=1 --branch main "https://github.com/EpiLogos/$owner.git" "$RUNNER_TEMP/jev-now-basis/repos/$owner"
          done
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'jev-now-basis'
          repos = {'ai-kit': pathlib.Path(os.environ['GITHUB_WORKSPACE'])}
          repos.update({p.name: p for p in (root / 'repos').iterdir()})
          basis = {}
          with tarfile.open(root / 'native-source-basis.tar.gz', 'w:gz') as archive:
              for name, repo in sorted(repos.items()):
                  sha = subprocess.check_output(['git', '-C', str(repo), 'rev-parse', 'HEAD'], text=True).strip()
                  basis[name] = {'revision': sha, 'source': 'current main' if name != 'ai-kit' else 'candidate head'}
                  paths = subprocess.check_output(['git', '-C', str(repo), 'ls-files', '-z']).split(b'\0')
                  for item in paths:
                      if not item:
                          continue
                      path = repo / os.fsdecode(item)
                      if not path.is_file() or path.is_symlink() or path.stat().st_size > 2_000_000:
                          continue
                      try:
                          content = path.read_bytes()
                          content.decode('utf-8')
                      except (UnicodeError, OSError):
                          continue
                      if b'\0' not in content:
                          archive.add(path, arcname=name + '/' + os.fsdecode(item), recursive=False)
          (root / 'basis.json').write_text(json.dumps(basis, indent=2) + '\n')
          print(json.dumps(basis, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jev-redis-now-source-basis
          path: |
            ${{ runner.temp }}/jev-now-basis/basis.json
            ${{ runner.temp }}/jev-now-basis/native-source-basis.tar.gz
          if-no-files-found: error
          retention-days: 7

  native-regression:
    name: Native AIKit context regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install declared native Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Exercise existing native core and storage
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-core -p aikit-store --lib -- --nocapture 2>&1 | tee "$RUNNER_TEMP/jev-now-native.log"
      - name: Record actual source and toolchain
        if: always()
        run: |
          { git rev-parse HEAD; rustc -Vv; cargo -V; } > "$RUNNER_TEMP/jev-now-toolchain.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-redis-now-native-regression
          path: |
            ${{ runner.temp }}/jev-now-native.log
            ${{ runner.temp }}/jev-now-toolchain.txt
          if-no-files-found: error


  real-redis-now:
    name: Real Redis NOW persistence and native operator
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AIKIT_TEST_REDIS_ADDR: 127.0.0.1:6381
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install declared native Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Start disposable persistent Redis 8.10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/redis-now-data"
          chmod 0777 "$RUNNER_TEMP/redis-now-data"
          docker run --detach --name aikit-jev-now-redis \
            --publish 6381:6379 \
            --volume "$RUNNER_TEMP/redis-now-data:/data" \
            redis:8.10 \
            redis-server \
              --appendonly yes \
              --appendfsync everysec \
              --save 60 1 \
              --maxmemory 134217728 \
              --maxmemory-policy noeviction
          for _ in $(seq 1 80); do
            if docker exec aikit-jev-now-redis redis-cli PING | grep -qx PONG; then break; fi
            sleep 0.25
          done
          docker exec aikit-jev-now-redis redis-cli PING | grep -qx PONG
          docker exec aikit-jev-now-redis redis-server --version | tee "$RUNNER_TEMP/redis-version.txt"
          docker inspect aikit-jev-now-redis --format '{{.Config.Image}} {{.Image}}' | tee "$RUNNER_TEMP/redis-image.txt"
      - name: Exercise real Redis store and native command surface
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-store --test redis_now_context -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/real-redis-now.log"
          cargo test --locked -p aikit-cli --lib -- --nocapture \
            2>&1 | tee -a "$RUNNER_TEMP/real-redis-now.log"
          AIKIT_TEST_REDIS_ADDR=127.0.0.1:6381 \
            cargo test --locked -p aikit-cli --test now_context_encounter -- --nocapture \
            2>&1 | tee -a "$RUNNER_TEMP/real-redis-now.log"
          cargo build --locked -p aikit-cli
          target/debug/aikit jev --help | tee "$RUNNER_TEMP/jev-help.txt"
          target/debug/aikit now-context --help | tee "$RUNNER_TEMP/now-context-help.txt"
          cat > "$RUNNER_TEMP/redis-now-config.json" <<'JSON'
          {
            "schema": "aikit.redis-now-config/v1",
            "address": "127.0.0.1:6381",
            "database": 0,
            "key_prefix": "aikit-cloud-proof",
            "username": null,
            "credential_ref": null,
            "allow_remote": false,
            "connect_timeout_ms": 1000,
            "io_timeout_ms": 1000,
            "prepared_ttl_seconds": 3600,
            "coordination_retention_seconds": 3600
          }
          JSON
          target/debug/aikit --json now-context status \
            --config-file "$RUNNER_TEMP/redis-now-config.json" \
            | tee "$RUNNER_TEMP/redis-status-before.json"
          before="$(docker exec aikit-jev-now-redis redis-cli DBSIZE)"
          test "$before" -gt 0
          printf '%s\n' "$before" > "$RUNNER_TEMP/redis-dbsize-before.txt"
      - name: Restart Redis over the same persisted data and prove recovery
        shell: bash
        run: |
          set -euo pipefail
          docker stop aikit-jev-now-redis
          set +e
          target/debug/aikit --json now-context status \
            --config-file "$RUNNER_TEMP/redis-now-config.json" \
            >"$RUNNER_TEMP/redis-unavailable.txt" 2>&1
          unavailable_rc=$?
          set -e
          test "$unavailable_rc" -ne 0
          printf 'exit_code=%s\n' "$unavailable_rc" >> "$RUNNER_TEMP/redis-unavailable.txt"
          docker rm aikit-jev-now-redis
          docker run --detach --name aikit-jev-now-redis \
            --publish 6381:6379 \
            --volume "$RUNNER_TEMP/redis-now-data:/data" \
            redis:8.10 \
            redis-server \
              --appendonly yes \
              --appendfsync everysec \
              --save 60 1 \
              --maxmemory 134217728 \
              --maxmemory-policy noeviction
          for _ in $(seq 1 80); do
            if docker exec aikit-jev-now-redis redis-cli PING | grep -qx PONG; then break; fi
            sleep 0.25
          done
          docker exec aikit-jev-now-redis redis-cli PING | grep -qx PONG
          after="$(docker exec aikit-jev-now-redis redis-cli DBSIZE)"
          before="$(cat "$RUNNER_TEMP/redis-dbsize-before.txt")"
          test "$after" -ge "$before"
          test "$after" -gt 0
          printf '%s\n' "$after" > "$RUNNER_TEMP/redis-dbsize-after.txt"
          target/debug/aikit --json now-context status \
            --config-file "$RUNNER_TEMP/redis-now-config.json" \
            | tee "$RUNNER_TEMP/redis-status-after.json"
          AIKIT_TEST_REDIS_ADDR=127.0.0.1:6381 \
            cargo test --locked -p aikit-store --test redis_now_context -- --nocapture \
            2>&1 | tee -a "$RUNNER_TEMP/real-redis-now.log"
      - name: Record exact tested source
        if: always()
        shell: bash
        run: |
          { git rev-parse HEAD; rustc -Vv; cargo -V; } > "$RUNNER_TEMP/real-redis-toolchain.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-redis-now-real-redis
          path: |
            ${{ runner.temp }}/real-redis-now.log
            ${{ runner.temp }}/real-redis-toolchain.txt
            ${{ runner.temp }}/redis-version.txt
            ${{ runner.temp }}/redis-image.txt
            ${{ runner.temp }}/redis-dbsize-before.txt
            ${{ runner.temp }}/redis-dbsize-after.txt
            ${{ runner.temp }}/redis-status-before.json
            ${{ runner.temp }}/redis-status-after.json
            ${{ runner.temp }}/redis-unavailable.txt
            ${{ runner.temp }}/jev-help.txt
            ${{ runner.temp }}/now-context-help.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable Redis container
        if: always()
        run: docker rm --force aikit-jev-now-redis >/dev/null 2>&1 || true

  joined-native-proof:
    name: Joined Central BKMR Factory Redis Jev episode
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Resolve current native owner mains
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch main https://github.com/EpiLogos/Central.git "$RUNNER_TEMP/Central"
          git clone --quiet --depth=1 --branch main https://github.com/EpiLogos/Factory.git "$RUNNER_TEMP/Factory"
          git clone --quiet --depth=1 --branch main https://github.com/EpiLogos/Actuation.git "$RUNNER_TEMP/Actuation"
          {
            printf 'ai-kit %s\n' "$(git rev-parse HEAD)"
            printf 'Central %s\n' "$(git -C "$RUNNER_TEMP/Central" rev-parse HEAD)"
            printf 'Factory %s\n' "$(git -C "$RUNNER_TEMP/Factory" rev-parse HEAD)"
            printf 'Actuation %s\n' "$(git -C "$RUNNER_TEMP/Actuation" rev-parse HEAD)"
          } | tee "$RUNNER_TEMP/joined-owner-revisions.txt"
      - name: Install real BKMR 7.6.7 and native Rust
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/bkmr"
          "$RUNNER_TEMP/bkmr/bin/pip" install --disable-pip-version-check 'bkmr==7.6.7'
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          {
            "$RUNNER_TEMP/bkmr/bin/bkmr" --version
            rustc -Vv
            cargo -V
          } | tee "$RUNNER_TEMP/joined-toolchain.txt"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: jev-now-joined
          workspaces: |
            . -> target
            ${{ runner.temp }}/Central -> target
            ${{ runner.temp }}/Factory -> target
            ${{ runner.temp }}/Actuation -> target
      - name: Build actual owner and consumer binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p aikit-cli --bin aikit 2>&1 | tee "$RUNNER_TEMP/joined-build.log"
          (cd "$RUNNER_TEMP/Central" && cargo build --locked -p ctrl) 2>&1 | tee -a "$RUNNER_TEMP/joined-build.log"
          (cd "$RUNNER_TEMP/Factory" && cargo build --locked -p epilogos-factory --bin factory) 2>&1 | tee -a "$RUNNER_TEMP/joined-build.log"
          (cd "$RUNNER_TEMP/Actuation" && cargo build --locked -p actuation-cli --bin actuation) 2>&1 | tee -a "$RUNNER_TEMP/joined-build.log"
          sha256sum \
            target/debug/aikit \
            "$RUNNER_TEMP/Central/target/debug/ctrl" \
            "$RUNNER_TEMP/Factory/target/debug/factory" \
            "$RUNNER_TEMP/Actuation/target/debug/actuation" \
            | tee "$RUNNER_TEMP/joined-binaries.sha256"
      - name: Start disposable persistent Redis 8.10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/joined-redis"
          chmod 0777 "$RUNNER_TEMP/joined-redis"
          docker run --detach --name aikit-jev-now-joined-redis \
            --publish 6382:6379 \
            --volume "$RUNNER_TEMP/joined-redis:/data" \
            redis:8.10 redis-server \
              --appendonly yes --appendfsync everysec --save 60 1 \
              --maxmemory 134217728 --maxmemory-policy noeviction
          for _ in $(seq 1 80); do
            docker exec aikit-jev-now-joined-redis redis-cli PING | grep -qx PONG && break
            sleep 0.25
          done
          docker exec aikit-jev-now-joined-redis redis-cli PING | grep -qx PONG
          docker exec aikit-jev-now-joined-redis redis-server --version | tee "$RUNNER_TEMP/joined-redis-version.txt"
      - name: Run joined controlled episode through native binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/jev-redis/joined_proof.py \
            --aikit "$PWD/target/debug/aikit" \
            --ctrl "$RUNNER_TEMP/Central/target/debug/ctrl" \
            --bkmr "$RUNNER_TEMP/bkmr/bin/bkmr" \
            --central-repo "$RUNNER_TEMP/Central" \
            --factory "$RUNNER_TEMP/Factory/target/debug/factory" \
            --factory-state "$RUNNER_TEMP/Factory/contracts/factory/fixtures/oi-self-hosting-state.json" \
            --actuation "$RUNNER_TEMP/Actuation/target/debug/actuation" \
            --redis-address 127.0.0.1:6382 \
            --jev-mode controlled \
            --output "$RUNNER_TEMP/joined-proof.json" \
            2>&1 | tee "$RUNNER_TEMP/joined-proof.log"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "joined-proof.json"
          value = json.loads(p.read_text())
          assert value["participant_isolation"]["verifier_canary_isolated"] is True
          assert value["stale_version_refused"] is True
          assert value["source_change_during_jev_refused"] is True
          assert value["provider_malformed_refused"] is True
          assert value["revoked_read_refused"] is True
          assert value["durable_return"]["later_participant_used_revised_wiki"] is True
          assert value["durable_return"]["matrix_pressure"]["warranted"] is True
          assert value["comparison"]["arms"]["redis_prepared_no_jev"]["redis_prepared"] is True
          assert value["comparison"]["arms"]["jev_assisted"]["jev_calls"] == 1
          assert value["general_jev"]["standing"] == "controlled-protocol"
          declared = value["sources"]["declared_matrix_inventory"]
          assert len(declared) == value["comparison"]["conditions"]["matrix_total_capabilities"]
          assert declared == value["comparison"]["conditions"]["declared_matrix_inventory"]
          assert len(declared) >= 3
          assert value["actuation"]["usage"]["event"]["kind"] == "model-usage"
          assert value["actuation"]["activity"]["invocation_ref"] == value["general_jev"]["invocation_ref"]
          assert value["actuation"]["activity"]["run_ref"] == value["sources"]["factory_run_ref"]
          PY
      - name: Preserve Redis restart evidence for the joined state
        shell: bash
        run: |
          set -euo pipefail
          before="$(docker exec aikit-jev-now-joined-redis redis-cli DBSIZE)"
          docker stop aikit-jev-now-joined-redis
          docker rm aikit-jev-now-joined-redis
          docker run --detach --name aikit-jev-now-joined-redis \
            --publish 6382:6379 \
            --volume "$RUNNER_TEMP/joined-redis:/data" \
            redis:8.10 redis-server \
              --appendonly yes --appendfsync everysec --save 60 1 \
              --maxmemory 134217728 --maxmemory-policy noeviction
          for _ in $(seq 1 80); do
            docker exec aikit-jev-now-joined-redis redis-cli PING | grep -qx PONG && break
            sleep 0.25
          done
          after="$(docker exec aikit-jev-now-joined-redis redis-cli DBSIZE)"
          test "$before" -gt 0
          test "$after" -ge "$before"
          printf 'before=%s\nafter=%s\n' "$before" "$after" | tee "$RUNNER_TEMP/joined-redis-restart.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-redis-now-joined-proof
          path: |
            ${{ runner.temp }}/joined-owner-revisions.txt
            ${{ runner.temp }}/joined-toolchain.txt
            ${{ runner.temp }}/joined-build.log
            ${{ runner.temp }}/joined-binaries.sha256
            ${{ runner.temp }}/joined-redis-version.txt
            ${{ runner.temp }}/joined-redis-restart.txt
            ${{ runner.temp }}/joined-proof.json
            ${{ runner.temp }}/joined-proof.log
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable Redis
        if: always()
        run: docker rm --force aikit-jev-now-joined-redis >/dev/null 2>&1 || true


  independent-joined-review:
    name: Independent joined evidence review
    needs: joined-native-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: jev-redis-now-joined-proof
          path: joined-proof
      - name: Review joined evidence from a fresh runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("joined-proof")
          proof_path = root / "joined-proof.json"
          owners_path = root / "joined-owner-revisions.txt"
          proof = json.loads(proof_path.read_text())
          owners = owners_path.read_text().splitlines()

          assert proof["schema"] == "aikit.jev-redis-now-joined-proof/v1"
          assert proof["general_jev"]["standing"] == "controlled-protocol"
          assert proof["participant_isolation"]["verifier_canary_isolated"] is True
          assert proof["stale_version_refused"] is True
          assert proof["source_change_during_jev_refused"] is True
          assert proof["provider_malformed_refused"] is True
          assert proof["revoked_read_refused"] is True
          assert proof["durable_return"]["later_participant_used_revised_wiki"] is True
          assert proof["durable_return"]["matrix_pressure"]["warranted"] is True
          assert proof["actuation"]["activity"]["invocation_ref"] == proof["general_jev"]["invocation_ref"]
          assert proof["actuation"]["activity"]["run_ref"] == proof["sources"]["factory_run_ref"]

          arms = proof["comparison"]["arms"]
          assert arms["ordinary"]["jev_calls"] == 0
          assert arms["ordinary"]["redis_prepared"] is False
          assert arms["redis_prepared_no_jev"]["jev_calls"] == 0
          assert arms["redis_prepared_no_jev"]["redis_prepared"] is True
          assert arms["jev_assisted"]["jev_calls"] == 1
          assert arms["jev_assisted"]["redis_prepared"] is True

          required_owners = ("ai-kit ", "Central ", "Factory ", "Actuation ")
          for prefix in required_owners:
              assert any(line.startswith(prefix) for line in owners), prefix

          digest = hashlib.sha256(proof_path.read_bytes()).hexdigest()
          review = {
              "schema": "aikit.jev-redis-now-independent-review/v1",
              "standing": "fresh-runner-controlled-evidence-review-not-human-acceptance",
              "joined_proof_sha256": digest,
              "owner_revisions": owners,
              "checks": [
                  "participant isolation",
                  "stale version and source-basis refusal",
                  "malformed provider refusal",
                  "revocation",
                  "durable Wiki Return and later-participant reuse",
                  "matrix pressure kept proposal-only",
                  "Actuation invocation/run attribution",
                  "three matched comparison arms"
              ],
              "passed": True
          }
          pathlib.Path("independent-review.json").write_text(json.dumps(review, indent=2) + "\n")
          print(json.dumps(review, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jev-redis-now-independent-review
          path: independent-review.json
          if-no-files-found: error
          retention-days: 14


  workcell-redis-lifecycle:
    name: Workcell-owned Redis lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout current Workcell owner
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch main https://github.com/EpiLogos/Workcell.git "$RUNNER_TEMP/Workcell"
          git -C "$RUNNER_TEMP/Workcell" rev-parse HEAD | tee "$RUNNER_TEMP/workcell-revision.txt"
      - name: Install native Rust and build Workcell
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          cd "$RUNNER_TEMP/Workcell"
          cargo test --locked -p epilogos-workcell-runtime redis_now -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/workcell-redis-tests.log"
          cargo build --locked -p epilogos-workcell-cli --bin workcell \
            2>&1 | tee -a "$RUNNER_TEMP/workcell-redis-tests.log"
      - name: Prepare Workcell-owned target service declaration
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/workcell-now"
          data="$root/data"
          mkdir -p "$root" "$data"
          chmod 0777 "$data"
          cat > "$root/status.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          test "$(docker inspect -f '{{.State.Running}}' workcell-redis-now 2>/dev/null)" = true
          docker exec workcell-redis-now redis-cli --raw PING | grep -qx PONG
          SH
          cat > "$root/start.sh" <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          if docker inspect workcell-redis-now >/dev/null 2>&1; then
            docker start workcell-redis-now >/dev/null
          else
            docker run --detach --name workcell-redis-now \
              --publish 6383:6379 \
              --volume "$data:/data" \
              redis:8.10 redis-server \
                --appendonly yes --appendfsync everysec --save 60 1 \
                --maxmemory 134217728 --maxmemory-policy noeviction >/dev/null
          fi
          SH
          cat > "$root/stop.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          docker stop workcell-redis-now >/dev/null
          SH
          cat > "$root/restart.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          docker restart workcell-redis-now >/dev/null
          SH
          chmod 0755 "$root/"*.sh
          cat > "$root/services.json" <<JSON
          {
            "schema": "workcell.service-declaration/v1",
            "services": [{
              "logical_ref": "service:redis-now/cloud-proof",
              "endpoint": "redis://127.0.0.1:6383",
              "lifetime": "target-owned",
              "acquisition": "ensure-running",
              "status": {"program": "$root/status.sh", "args": []},
              "readiness": {
                "program": "$root/status.sh", "args": [],
                "timeout_ms": 5000, "interval_ms": 50
              },
              "start": {"program": "$root/start.sh", "args": []},
              "stop": {"program": "$root/stop.sh", "args": []},
              "restart": {"program": "$root/restart.sh", "args": []},
              "metadata": {
                "target": "redis",
                "target_minimum_series": "8.10",
                "configuration_owner": "workcell",
                "semantic_state_owner": "central+aikit+factory",
                "persistence_policy": "aof+operator-rdb",
                "eviction_policy": "noeviction",
                "binding": "loopback"
              }
            }]
          }
          JSON
      - name: Materialise Redis through Workcell and prove command-exit persistence
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/workcell-now"
          wc="$RUNNER_TEMP/Workcell/target/debug/workcell"
          "$wc" --state-root "$root/state" --services "$root/services.json" --json discover \
            | tee "$RUNNER_TEMP/workcell-discover-before.json"
          "$wc" --state-root "$root/state" --services "$root/services.json" \
            --receipt "$root/world.json" --json prepare \
            --demand-ref demand:redis-now-cloud \
            --connect service:redis-now/cloud-proof \
            --persistence workcell --retention release \
            | tee "$RUNNER_TEMP/workcell-prepare.json"
          "$root/status.sh"
          docker exec workcell-redis-now redis-cli SET oi65-proof retained | grep -qx OK
          "$wc" --state-root "$root/state" --services "$root/services.json" \
            --receipt "$root/world.json" --json observe \
            | tee "$RUNNER_TEMP/workcell-observe-before.json"
          docker exec workcell-redis-now redis-server --version \
            | tee "$RUNNER_TEMP/workcell-redis-version.txt"
      - name: Lose the process, recover through Workcell, then owner-release it
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/workcell-now"
          wc="$RUNNER_TEMP/Workcell/target/debug/workcell"
          docker stop workcell-redis-now >/dev/null
          if "$root/status.sh"; then
            echo "stopped Redis unexpectedly remained healthy" >&2
            exit 1
          fi
          "$wc" --state-root "$root/state" --services "$root/services.json" \
            --receipt "$root/world.json" --json recover \
            | tee "$RUNNER_TEMP/workcell-recover.json"
          "$root/status.sh"
          test "$(docker exec workcell-redis-now redis-cli --raw GET oi65-proof)" = retained
          "$wc" --state-root "$root/state" --services "$root/services.json" \
            --receipt "$root/world.json" --json release \
            | tee "$RUNNER_TEMP/workcell-release.json"
          if "$root/status.sh"; then
            echo "owner-scoped release failed to stop Workcell-started Redis" >&2
            exit 1
          fi
          docker rm workcell-redis-now >/dev/null
          test -d "$root/data"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-redis-now-workcell-lifecycle
          path: |
            ${{ runner.temp }}/workcell-revision.txt
            ${{ runner.temp }}/workcell-redis-tests.log
            ${{ runner.temp }}/workcell-discover-before.json
            ${{ runner.temp }}/workcell-prepare.json
            ${{ runner.temp }}/workcell-observe-before.json
            ${{ runner.temp }}/workcell-redis-version.txt
            ${{ runner.temp }}/workcell-recover.json
            ${{ runner.temp }}/workcell-release.json
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup disposable Workcell Redis material
        if: always()
        shell: bash
        run: docker rm --force workcell-redis-now >/dev/null 2>&1 || true
