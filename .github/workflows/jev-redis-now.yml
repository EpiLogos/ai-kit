name: Jev Redis NOW native integration

on:
  push:
    branches: [agent/388-jev-redis-now]
  pull_request:
    paths:
      - '.github/workflows/jev-redis-now.yml'
      - 'crates/**'
      - 'scripts/jev-redis/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-redis-now-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'

jobs:
  basis:
    name: Exact cloud source basis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Capture current native owners without touching an installed World
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jev-now-basis/repos" "$RUNNER_TEMP/jev-now-basis/export"
          git rev-parse HEAD > "$RUNNER_TEMP/jev-now-basis/aikit.sha"
          for owner in Central Workcell Factory Actuation O-I QL-MEF; do
            git clone --quiet --depth=1 --branch main "https://github.com/EpiLogos/$owner.git" "$RUNNER_TEMP/jev-now-basis/repos/$owner"
          done
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'jev-now-basis'
          repos = {'ai-kit': pathlib.Path(os.environ['GITHUB_WORKSPACE'])}
          repos.update({p.name: p for p in (root / 'repos').iterdir()})
          basis = {}
          with tarfile.open(root / 'native-source-basis.tar.gz', 'w:gz') as archive:
              for name, repo in sorted(repos.items()):
                  sha = subprocess.check_output(['git', '-C', str(repo), 'rev-parse', 'HEAD'], text=True).strip()
                  basis[name] = {'revision': sha, 'source': 'current main' if name != 'ai-kit' else 'candidate head'}
                  paths = subprocess.check_output(['git', '-C', str(repo), 'ls-files', '-z']).split(b'\0')
                  for item in paths:
                      if not item:
                          continue
                      path = repo / os.fsdecode(item)
                      if not path.is_file() or path.is_symlink() or path.stat().st_size > 2_000_000:
                          continue
                      try:
                          content = path.read_bytes()
                          content.decode('utf-8')
                      except (UnicodeError, OSError):
                          continue
                      if b'\0' not in content:
                          archive.add(path, arcname=name + '/' + os.fsdecode(item), recursive=False)
          (root / 'basis.json').write_text(json.dumps(basis, indent=2) + '\n')
          print(json.dumps(basis, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jev-redis-now-source-basis
          path: |
            ${{ runner.temp }}/jev-now-basis/basis.json
            ${{ runner.temp }}/jev-now-basis/native-source-basis.tar.gz
          if-no-files-found: error
          retention-days: 7

  native-regression:
    name: Native AIKit context regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install declared native Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Exercise existing native core and storage
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-core -p aikit-store --lib -- --nocapture 2>&1 | tee "$RUNNER_TEMP/jev-now-native.log"
      - name: Record actual source and toolchain
        if: always()
        run: |
          { git rev-parse HEAD; rustc -Vv; cargo -V; } > "$RUNNER_TEMP/jev-now-toolchain.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-redis-now-native-regression
          path: |
            ${{ runner.temp }}/jev-now-native.log
            ${{ runner.temp }}/jev-now-toolchain.txt
          if-no-files-found: error


  real-redis-now:
    name: Real Redis NOW persistence and native operator
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AIKIT_TEST_REDIS_ADDR: 127.0.0.1:6381
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install declared native Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Start disposable persistent Redis 8.10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/redis-now-data"
          chmod 0777 "$RUNNER_TEMP/redis-now-data"
          docker run --detach --name aikit-jev-now-redis \
            --publish 6381:6379 \
            --volume "$RUNNER_TEMP/redis-now-data:/data" \
            redis:8.10 \
            redis-server \
              --appendonly yes \
              --appendfsync everysec \
              --save 60 1 \
              --maxmemory 134217728 \
              --maxmemory-policy noeviction
          for _ in $(seq 1 80); do
            if docker exec aikit-jev-now-redis redis-cli PING | grep -qx PONG; then break; fi
            sleep 0.25
          done
          docker exec aikit-jev-now-redis redis-cli PING | grep -qx PONG
          docker exec aikit-jev-now-redis redis-server --version | tee "$RUNNER_TEMP/redis-version.txt"
          docker inspect aikit-jev-now-redis --format '{{.Config.Image}} {{.Image}}' | tee "$RUNNER_TEMP/redis-image.txt"
      - name: Exercise real Redis store and native command surface
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-store --test redis_now_context -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/real-redis-now.log"
          cargo test --locked -p aikit-cli --lib -- --nocapture \
            2>&1 | tee -a "$RUNNER_TEMP/real-redis-now.log"
          cargo build --locked -p aikit-cli
          target/debug/aikit jev --help | tee "$RUNNER_TEMP/jev-help.txt"
          target/debug/aikit now-context --help | tee "$RUNNER_TEMP/now-context-help.txt"
          cat > "$RUNNER_TEMP/redis-now-config.json" <<'JSON'
          {
            "schema": "aikit.redis-now-config/v1",
            "address": "127.0.0.1:6381",
            "database": 0,
            "key_prefix": "aikit-cloud-proof",
            "username": null,
            "credential_ref": null,
            "allow_remote": false,
            "connect_timeout_ms": 1000,
            "io_timeout_ms": 1000,
            "prepared_ttl_seconds": 3600,
            "coordination_retention_seconds": 3600
          }
          JSON
          target/debug/aikit --json now-context status \
            --config-file "$RUNNER_TEMP/redis-now-config.json" \
            | tee "$RUNNER_TEMP/redis-status-before.json"
          before="$(docker exec aikit-jev-now-redis redis-cli DBSIZE)"
          test "$before" -gt 0
          printf '%s\n' "$before" > "$RUNNER_TEMP/redis-dbsize-before.txt"
      - name: Restart Redis over the same persisted data and prove recovery
        shell: bash
        run: |
          set -euo pipefail
          docker stop aikit-jev-now-redis
          docker rm aikit-jev-now-redis
          docker run --detach --name aikit-jev-now-redis \
            --publish 6381:6379 \
            --volume "$RUNNER_TEMP/redis-now-data:/data" \
            redis:8.10 \
            redis-server \
              --appendonly yes \
              --appendfsync everysec \
              --save 60 1 \
              --maxmemory 134217728 \
              --maxmemory-policy noeviction
          for _ in $(seq 1 80); do
            if docker exec aikit-jev-now-redis redis-cli PING | grep -qx PONG; then break; fi
            sleep 0.25
          done
          docker exec aikit-jev-now-redis redis-cli PING | grep -qx PONG
          after="$(docker exec aikit-jev-now-redis redis-cli DBSIZE)"
          before="$(cat "$RUNNER_TEMP/redis-dbsize-before.txt")"
          test "$after" -ge "$before"
          test "$after" -gt 0
          printf '%s\n' "$after" > "$RUNNER_TEMP/redis-dbsize-after.txt"
          target/debug/aikit --json now-context status \
            --config-file "$RUNNER_TEMP/redis-now-config.json" \
            | tee "$RUNNER_TEMP/redis-status-after.json"
          AIKIT_TEST_REDIS_ADDR=127.0.0.1:6381 \
            cargo test --locked -p aikit-store --test redis_now_context -- --nocapture \
            2>&1 | tee -a "$RUNNER_TEMP/real-redis-now.log"
      - name: Record exact tested source
        if: always()
        shell: bash
        run: |
          { git rev-parse HEAD; rustc -Vv; cargo -V; } > "$RUNNER_TEMP/real-redis-toolchain.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-redis-now-real-redis
          path: |
            ${{ runner.temp }}/real-redis-now.log
            ${{ runner.temp }}/real-redis-toolchain.txt
            ${{ runner.temp }}/redis-version.txt
            ${{ runner.temp }}/redis-image.txt
            ${{ runner.temp }}/redis-dbsize-before.txt
            ${{ runner.temp }}/redis-dbsize-after.txt
            ${{ runner.temp }}/redis-status-before.json
            ${{ runner.temp }}/redis-status-after.json
            ${{ runner.temp }}/jev-help.txt
            ${{ runner.temp }}/now-context-help.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable Redis container
        if: always()
        run: docker rm --force aikit-jev-now-redis >/dev/null 2>&1 || true
