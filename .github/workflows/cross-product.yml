name: Cross-product (weekly)

# Every check that checks out or builds another repository runs here weekly
# and on demand, not per push: each sibling gates its own main. A red job is
# a rotted pin or a moved seam, repaired in its own change.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  factory-developmental-real:
    name: Real Factory developmental consumer conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Checkout exact Factory owner revision
        uses: actions/checkout@v7.0.1
        with:
          repository: EpiLogos/agent-system-design
          ref: 12a721dbbb51e3c70d52ef00220efa859ef930fd
          path: factory-owner
      - name: Build native Factory CLI
        working-directory: factory-owner
        run: cargo build --locked -p epilogos-factory --bin factory
      - name: Consume owner-generated state through the real Factory CLI
        env:
          AIKIT_FACTORY_REAL_BIN: ${{ github.workspace }}/factory-owner/target/debug/factory
          AIKIT_FACTORY_COMMISSION_REQUEST: ${{ github.workspace }}/factory-owner/contracts/factory/fixtures/oi-self-hosting-commission-request.json
          AIKIT_FACTORY_TEST_STATE_OUT: ${{ runner.temp }}/factory-developmental-state.json
          AIKIT_FACTORY_TEST_MANIFEST_OUT: ${{ runner.temp }}/factory-developmental-manifest.json
        run: |
          cargo test --locked -p aikit-adapters --test factory_developmental_native -- --ignored --nocapture
          cargo test --locked -p aikit-cli --test factory_start_work_native -- --ignored --nocapture
          cargo test --locked -p aikit-cli --test factory_work_tui_native -- --ignored --nocapture
          project_ref=$(python3 -c 'import json; print(json.load(open("${{ runner.temp }}/factory-developmental-manifest.json"))["projectRef"])')
          echo "AIKIT_FACTORY_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"
      - name: Resolve the Factory WorkflowUnit through AIKit's real structured CLI
        env:
          AIKIT_HOME: ${{ runner.temp }}/aikit-home
          AIKIT_FACTORY_BIN: ${{ github.workspace }}/factory-owner/target/debug/factory
          AIKIT_FACTORY_STATE: ${{ runner.temp }}/factory-developmental-state.json
        run: |
          mkdir -p ${{ runner.temp }}/aikit-project/.aikit
          cargo run --locked -p aikit-cli --bin aikit -- --json -C ${{ runner.temp }}/aikit-project search implement > ${{ runner.temp }}/aikit-factory-search.json
          grep -q '"resource_kind":"workflow-unit"' ${{ runner.temp }}/aikit-factory-search.json

  deepseek-cordis-real:
    name: Real DeepSeek Cordis SessionSpace activation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
          path: deepseek-harness
      - name: Install pinned DeepSeek Harness workspace
        working-directory: deepseek-harness
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Prove current upstream Web/Cordis launch seam
        working-directory: deepseek-harness
        shell: bash
        run: |
          set -euo pipefail
          report_failure() {
            tail -n 100 /tmp/deepseek-cordis.log > /tmp/deepseek-cordis-focus.log || true
            message=$(cat /tmp/deepseek-cordis-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=Upstream DeepSeek Web/Cordis launch failure::$message"
          }
          node --import tsx apps/cli/src/bin.ts web > /tmp/deepseek-cordis.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 100); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'DeepSeek Web/Cordis process exited before readiness:'
              cat /tmp/deepseek-cordis.log
              report_failure
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/3080) 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'DeepSeek Web/Cordis process did not expose 127.0.0.1:3080:'
            cat /tmp/deepseek-cordis.log
            report_failure
            exit 1
          fi
          echo 'DeepSeek Web/Cordis endpoint is live at 127.0.0.1:3080'
          cleanup
          trap - EXIT
      - name: Run real Cordis activation through SessionSpace
        shell: bash
        env:
          AIKIT_REQUIRE_DEEPSEEK_CORDIS_REAL: "1"
          AIKIT_DEEPSEEK_HARNESS_CHECKOUT: ${{ github.workspace }}/deepseek-harness
        run: |
          set +e
          cargo test --locked -p aikit-adapters --test deepseek_cordis_real -- --nocapture --test-threads=1 2>&1 | tee /tmp/aikit-cordis.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^error(\[|:)|^failures:|^test result:|^thread .*panicked|^  left:|^ right:|^note:|^help:|session_space|cordis\.process|Cordis provider)' /tmp/aikit-cordis.log | tail -n 120 > /tmp/aikit-cordis-focus.log || true
            message=$(cat /tmp/aikit-cordis-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=Real DeepSeek Cordis SessionSpace failure::$message"
          fi
          exit "$status"
  collapsed-local-workcell:
    name: AIKit Surface ↔ Workcell managed-service proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AIKit candidate
        uses: actions/checkout@v7.0.1

      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Prove AIKit persistent Surface identity and rebinding
        run: cargo test --locked -p aikit-core --test surface_material_v2 -- --nocapture --test-threads=1

      - name: Checkout pinned Workcell collapsed-local substrate
        uses: actions/checkout@v7.0.1
        with:
          repository: EpiLogos/Workcell
          ref: 8184f9ba95c5efc0077701a4b58c1abb2943bd6e
          path: workcell

      - name: Prove real local managed-service lifecycle in Workcell
        working-directory: workcell
        run: cargo test --locked -p epilogos-workcell-runtime --test managed_host_service -- --nocapture --test-threads=1

      - name: Record pre-physical boundary
        shell: bash
        run: |
          cat <<'EOF'
          Persistent Surface conformance passed against Workcell 8184f9ba95c5efc0077701a4b58c1abb2943bd6e.
          This gate proves collapsed-local process/service readiness, observation, disappearance,
          release/rematerialisation and AIKit identity-preserving Surface rebinding.
          It deliberately does not claim Ubuntu/Tailscale/Fabric physical acceptance.
          EOF

  native-composition:
    name: Native composition and Wiki scope — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CENTRAL_SHA: 2a604574774c41921003ed99a2eed73b4c9f4266
      ACTUATION_SHA: 4af495f6509bb0dd779112a225d71a9df8145b6e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Admit existing owned product scratch and retain native command facts
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v python3
          command -v cargo
          command -v git
          umask 077
          scratch="$GITHUB_WORKSPACE/ProjectCentral/now/tmp"
          mkdir -p "$scratch"
          evidence="$scratch/native-composition-${GITHUB_RUN_ID}-${RUNNER_OS}"
          mkdir "$evidence"
          mkdir "$evidence/images" "$evidence/source"
          printf 'NATIVE_COMPOSITION_EVIDENCE=%s\nAIKIT_NATIVE_TEST_ARTIFACT_ROOT=%s\n' "$evidence" "$evidence" >> "$GITHUB_ENV"
          cp ProjectCentral/project.json "$evidence/product-manifest.json"
          {
            id
            uname -a
            python3 --version
            rustc -Vv
            cargo -Vv
          } > "$evidence/host-tools.txt" 2>&1
          cat > "$evidence/record-command.sh" <<'SH'
          record_command() {
            label="$1"; shift
            printf '%s\0' "$@" > "$NATIVE_COMPOSITION_EVIDENCE/$label.argv"
            pwd > "$NATIVE_COMPOSITION_EVIDENCE/$label.cwd"
            set +e
            "$@" > "$NATIVE_COMPOSITION_EVIDENCE/$label.stdout" 2> "$NATIVE_COMPOSITION_EVIDENCE/$label.stderr"
            command_status=$?
            set -e
            printf '%s\n' "$command_status" > "$NATIVE_COMPOSITION_EVIDENCE/$label.exit"
            cat "$NATIVE_COMPOSITION_EVIDENCE/$label.stdout"
            cat "$NATIVE_COMPOSITION_EVIDENCE/$label.stderr" >&2
            return "$command_status"
          }
          SH
          cat > "$evidence/audit.py" <<'PY'
          import hashlib,json,os,stat,sys
          from pathlib import Path
          out=Path(os.environ['NATIVE_COMPOSITION_EVIDENCE'])
          workspace=Path(os.environ['GITHUB_WORKSPACE'])
          roles=[
           {'name':'ctrl','receipt':'compiler-central.stdout','root':str(Path(os.environ['RUNNER_TEMP'])/'Central'),'target':'ctrl','kind':'bin','test':False},
           {'name':'aikit','receipt':'compiler-integration.stdout','root':str(workspace),'target':'aikit','kind':'bin','test':False},
           {'name':'compose-native','receipt':'compiler-integration.stdout','root':str(workspace),'target':'compose_native_central','kind':'test','test':True},
           {'name':'wiki-native','receipt':'compiler-integration.stdout','root':str(workspace),'target':'knowledge_wiki_scope_native','kind':'test','test':True},
           {'name':'project-scope','receipt':'compiler-project-scope.stdout','root':str(workspace),'target':'aikit_cli','kind':'lib','test':True},
          ]
          actor=[
           'explicit_compose_discloses_authored_basis_and_refuses_broken_source',
           'unreadable_authored_profile_refuses_context_and_projection_with_actual_owner_error',
           'ambiguous_native_profiles_refuse_context_and_projection_without_guessing',
           'invalid_actual_model_bearing_refuses_context_and_projection_but_absence_remains_valid',
           'explicitly_independent_project_without_actor_sources_remains_useful',
          ]
          wiki=[
           'actual_native_wiki_id_differs_from_folder_and_sibling_label_cannot_grant_scope',
           'actual_owner_created_external_identity_missing_or_ambiguous_refuses_broad_query',
           'actual_native_duplicate_id_is_withheld_from_every_internal_project_scope',
          ]
          def write(name,value):
           (out/name).write_text(json.dumps(value,indent=2)+'\n')
          def facts(s):
           return dict(device=s.st_dev,inode=s.st_ino,mode=s.st_mode,links=s.st_nlink,uid=s.st_uid,gid=s.st_gid,bytes=s.st_size,mtime_ns=s.st_mtime_ns,ctime_ns=s.st_ctime_ns)
          def held(path,root,copy=None,limit=1073741824):
           p=Path(path);root=Path(root)
           row={'path':str(p),'requested_root':str(root),'sha256':None,'cause':None}
           try:
            row['named_before']=facts(os.lstat(p));actual_root=root.resolve(strict=True);physical=p.resolve(strict=True)
            row['physical_root']=str(actual_root);row['physical_path']=str(physical)
            if not p.is_absolute() or not p.is_relative_to(root) or not physical.is_relative_to(actual_root):
             raise ValueError('original coordinate is outside the selected lexical/physical compiler root')
            fd=os.open(p,os.O_RDONLY|os.O_NONBLOCK|os.O_NOFOLLOW|os.O_CLOEXEC)
            with os.fdopen(fd,'rb') as f:
             row['held_before']=facts(os.fstat(f.fileno()))
             first=row['held_before']
             if not stat.S_ISREG(first['mode']) or first['uid']!=os.geteuid() or first['bytes']>limit:
              raise ValueError('nonregular/foreign/over-capacity original; no byte read admitted')
             if first!=row['named_before']:
              raise ValueError('named original changed before held read; digest unavailable')
             digest=hashlib.sha256();observed=0;prefix=b'';sink=None
             try:
              if copy is not None:
               sink=os.fdopen(os.open(copy,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o700),'wb')
              while chunk:=f.read(1048576):
               if not prefix:prefix=chunk[:64]
               observed+=len(chunk)
               if observed>limit:raise ValueError('held original exceeded bounded read capacity')
               digest.update(chunk)
               if sink:sink.write(chunk)
              if sink:sink.flush()
             finally:
              if sink:sink.close()
             row['held_after']=facts(os.fstat(f.fileno()));row['named_after']=facts(os.lstat(p))
             if first!=row['held_after'] or first!=row['named_after'] or p.resolve(strict=True)!=physical or root.resolve(strict=True)!=actual_root:
              raise ValueError('held/named original or parent alias affiliation changed; digest unavailable')
             row['sha256']=digest.hexdigest();row['observed_bytes']=observed;row['header_hex']=prefix.hex()
             row['standing']='bounded unchanged held regular original; original links observed, not required one; checkpoints are not atomic exclusion of external writers'
             if copy is not None:
              row['private_copy']={'path':str(copy),'metadata':facts(os.lstat(copy))}
              if not stat.S_ISREG(row['private_copy']['metadata']['mode']) or row['private_copy']['metadata']['links']!=1:
               raise ValueError('private evidence image must be ordinary single-link')
           except (OSError,ValueError) as e:
            row['sha256']=None;row['cause']={'type':type(e).__name__,'errno':getattr(e,'errno',None),'message':str(e)}
           return row
          def artifacts(file):
           used=0;result=[]
           with Path(file).open('rb') as stream:
            for raw in stream:
             used+=len(raw)
             if used>67108864 or len(raw)>1048576:raise ValueError('compiler receipt capacity exceeded')
             item=json.loads(raw)
             if item.get('reason')=='compiler-artifact':result.append(item)
           return result
          def bounded_text(path):
           with Path(path).open('rb') as stream:raw=stream.read(1048577)
           if len(raw)>1048576:raise ValueError('test receipt exceeded one MiB selection capacity')
           return raw.decode('utf-8',errors='strict')
          mode=sys.argv[1]
          if mode=='prepare':
           records=[];total=0
           for role in roles:
            rows=[r for r in artifacts(out/role['receipt']) if r['target']['name']==role['target'] and r.get('executable') and role['kind'] in r['target']['kind'] and r['profile']['test']==role['test']]
            if len(rows)!=1:raise ValueError('exactly one actual CompilerArtifact required for '+role['name'])
            artifact=rows[0];root=Path(role['root']);image=Path(artifact['executable'])
            row={'role':role,'compiler_artifact':artifact,'image':held(image,root/'target'/'debug',out/'images'/role['name'],min(1073741824,3221225472-total))}
            records.append(row);write('images.before.json',records)
            if row['image']['cause']:raise ValueError('original image digest/admission failed; actual cause retained')
            total+=row['image']['observed_bytes']
            if total>3221225472:raise ValueError('aggregate retained image capacity exceeded')
            # Original physical digest is recorded before semantic form/profile refusal.
            header=row['image']['header_hex'][:8]
            expected={'Linux':['7f454c46'],'Darwin':['cffaedfe','feedfacf','cefaedfe','feedface','cafebabe','bebafeca','cafebabf','bfbafeca']}
            if header not in expected[os.uname().sysname] or not row['image']['held_before']['mode']&0o111:
             raise ValueError('actual native platform image form/executable mode mismatch')
            if 'codex-account-native' in artifact.get('features',[]):raise ValueError('credential-free gate cannot select account feature')
            row['source']=held(artifact['target']['src_path'],root);row['manifest']=held(artifact['manifest_path'],root)
            write('images.before.json',records)
            if row['source']['cause'] or row['manifest']['cause']:raise ValueError('compiled source/manifest basis unavailable')
            (out/(role['name']+'.path')).write_text(str(image)+'\n')
           write('images.before.json',records)
           archive_rows=[]
           for path in sorted((out/'source').glob('*.tar')):
            archive_rows.append(held(path,out/'source'));write('source-archives.json',archive_rows)
            if archive_rows[-1]['cause']:raise ValueError('source archive digest unavailable')
           if len(archive_rows)!=3:raise ValueError('exact three actual product source archives required')
           write('environment.json',{'os':os.uname().sysname,'python':sys.version,'values':{key:os.environ.get(key) for key in ['GITHUB_RUN_ID','GITHUB_SHA','GITHUB_REPOSITORY','RUSTFLAGS','RUSTC_WRAPPER','CARGO_TARGET_DIR','CARGO_BUILD_TARGET','AIKIT_NATIVE_TEST_ARTIFACT_ROOT','AIKIT_CENTRAL_REAL_BIN','CENTRAL_CTRL_BIN']},'limits':{'original_image_bytes':1073741824,'aggregate_image_bytes':3221225472,'compiler_bytes':67108864,'compiler_line_bytes':1048576},'standing':'hosted test-owned material; no installed/original/provider/human acceptance'})
          elif mode=='roster':
           kind=sys.argv[2];expected=actor if kind=='actor' else wiki
           text=bounded_text(out/(kind+'-list.stdout'))
           actual=[line.removesuffix(': test') for line in text.splitlines() if line.endswith(': test')]
           row={'kind':kind,'expected':expected,'actual':actual,'status':int((out/(kind+'-list.exit')).read_text()),'match':len(actual)==len(expected) and sorted(actual)==sorted(expected)}
           write(kind+'-roster.json',row)
           if row['status']!=0 or not row['match']:raise ValueError('compiled ignored census differs from required '+kind+' roster')
          elif mode=='project-roster':
           expected=['app::knowledge::project_scope_tests::a_clearing_drops_whole_from_a_project_scope']
           text=bounded_text(out/'project-scope-list.stdout')
           actual=[line.removesuffix(': test') for line in text.splitlines() if line.endswith(': test')]
           status=int((out/'project-scope-list.exit').read_text())
           row={'kind':'project-scope','expected':expected,'actual':actual,'status':status,'match':status==0 and actual==expected}
           write('project-scope-roster.json',row)
           if not row['match']:raise ValueError('actual compiled library Project-scope case is missing or ambiguous')
          elif mode=='results':
           kind=sys.argv[2];expected=actor if kind=='actor' else wiki;rows=[]
           for name in expected:
            text=bounded_text(out/(name+'.stdout'));status=int((out/(name+'.exit')).read_text())
            summary='test result: ok. 1 passed; 0 failed; 0 ignored;'
            row={'name':name,'status':status,'actual_test_line':('test '+name+' ... ok') in text,'one_pass_zero_fail_zero_ignored':summary in text}
            rows.append(row);write(kind+'-execution-results.json',{'expected':expected,'actual':rows,'standing':'actual executable raw result assertions, not badge/census inference'})
           if len(rows)!=len(expected) or not all(r['status']==0 and r['actual_test_line'] and r['one_pass_zero_fail_zero_ignored'] for r in rows):
            raise ValueError('exact required '+kind+' execution assertions failed')
          elif mode=='after':
           before=json.loads((out/'images.before.json').read_text());rows=[];failed=len(before)!=len(roles)
           for row in before:
            after=held(row['image']['path'],Path(row['role']['root'])/'target'/'debug')
            same=not after['cause'] and after['sha256']==row['image']['sha256'] and after['held_before']==row['image'].get('held_after')
            rows.append({'role':row['role'],'original_before':row['image'],'current_after':after,'same_original':same});failed|=not same
           write('images.after.json',{'actual':rows,'complete_roles':len(before)==len(roles),'all_unchanged':not failed,'standing':'actual held source-image checkpoints; no universal process cleanup/EOF claim'})
           if failed:raise ValueError('original native image basis changed or incomplete')
          else:raise ValueError('unknown evidence operation')
          PY
      - name: Exact native owner dependencies
        shell: bash
        run: |
          set -euo pipefail
          for owner in Central Actuation; do
            revision="$CENTRAL_SHA"
            if [ "$owner" = Actuation ]; then revision="$ACTUATION_SHA"; fi
            root="$RUNNER_TEMP/$owner"
            git init -q "$root"
            git -C "$root" remote add origin "https://github.com/EpiLogos/$owner.git"
            git -C "$root" fetch --depth=1 origin "$revision"
            git -C "$root" checkout --detach FETCH_HEAD
            test "$(git -C "$root" rev-parse HEAD)" = "$revision"
            test -z "$(git -C "$root" status --porcelain)"
            git -C "$root" archive --format=tar HEAD > "$NATIVE_COMPOSITION_EVIDENCE/source/$owner.tar"
            git -C "$root" ls-tree -r HEAD > "$NATIVE_COMPOSITION_EVIDENCE/source/$owner-tree-modes.txt"
            git -C "$root" rev-parse HEAD 'HEAD^{tree}' > "$NATIVE_COMPOSITION_EVIDENCE/source/$owner-head-tree.txt"
          done
          git archive --format=tar HEAD > "$NATIVE_COMPOSITION_EVIDENCE/source/AIKit.tar"
          git ls-tree -r HEAD > "$NATIVE_COMPOSITION_EVIDENCE/source/AIKit-tree-modes.txt"
          git rev-parse HEAD 'HEAD^{tree}' > "$NATIVE_COMPOSITION_EVIDENCE/source/AIKit-head-tree.txt"
          printf '%s\n' "$RUNNER_TEMP/Central/target/debug" "$RUNNER_TEMP/Actuation/target/release" >> "$GITHUB_PATH"
          printf 'AIKIT_CENTRAL_REAL_BIN=%s\nCENTRAL_CTRL_BIN=%s\n' "$RUNNER_TEMP/Central/target/debug/ctrl" "$RUNNER_TEMP/Central/target/debug/ctrl" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            .
            ${{ runner.temp }}/Central
            ${{ runner.temp }}/Actuation
      - name: Build native Central
        shell: bash
        run: |
          set -euo pipefail
          source "$NATIVE_COMPOSITION_EVIDENCE/record-command.sh"
          record_command compiler-central cargo build --manifest-path "$RUNNER_TEMP/Central/Cargo.toml" --locked --bin ctrl --message-format=json
      - name: Build native Actuation
        shell: bash
        run: |
          set -euo pipefail
          source "$NATIVE_COMPOSITION_EVIDENCE/record-command.sh"
          record_command compiler-actuation cargo build --manifest-path "$RUNNER_TEMP/Actuation/Cargo.toml" --locked -p actuation-cli --message-format=json
      - name: Compile original composition and required Wiki targets and retain actual images
        shell: bash
        run: |
          set -euo pipefail
          source "$NATIVE_COMPOSITION_EVIDENCE/record-command.sh"
          record_command compiler-integration cargo test --locked -p aikit-cli --test compose_native_central --test knowledge_wiki_scope_native --no-run --message-format=json
          record_command compiler-project-scope cargo test --locked -p aikit-cli --lib --no-run --message-format=json
          python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" prepare
      - name: Run native composition and exact source-byte receipt regression first
        shell: bash
        run: |
          set -euo pipefail
          source "$NATIVE_COMPOSITION_EVIDENCE/record-command.sh"
          image="$(cat "$NATIVE_COMPOSITION_EVIDENCE/compose-native.path")"
          record_command actor-list "$image" --list --ignored
          python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" roster actor
          for case in \
            explicit_compose_discloses_authored_basis_and_refuses_broken_source \
            unreadable_authored_profile_refuses_context_and_projection_with_actual_owner_error \
            ambiguous_native_profiles_refuse_context_and_projection_without_guessing \
            invalid_actual_model_bearing_refuses_context_and_projection_but_absence_remains_valid \
            explicitly_independent_project_without_actor_sources_remains_useful; do
            record_command "$case" "$image" --exact "$case" --ignored --nocapture --test-threads=1
          done
          python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" results actor
      - name: Run existing exact project scope computations
        shell: bash
        run: |
          set -euo pipefail
          source "$NATIVE_COMPOSITION_EVIDENCE/record-command.sh"
          image="$(cat "$NATIVE_COMPOSITION_EVIDENCE/project-scope.path")"
          case=app::knowledge::project_scope_tests::a_clearing_drops_whole_from_a_project_scope
          record_command project-scope-list "$image" --exact "$case" --list --format terse
          python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" project-roster
          record_command project-scope "$image" --exact "$case" --nocapture --test-threads=1
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$NATIVE_COMPOSITION_EVIDENCE/project-scope.stdout"
      - name: Require compiled three-case Wiki roster and execute every genuine native case
        shell: bash
        run: |
          set -euo pipefail
          source "$NATIVE_COMPOSITION_EVIDENCE/record-command.sh"
          image="$(cat "$NATIVE_COMPOSITION_EVIDENCE/wiki-native.path")"
          record_command wiki-list "$image" --list --ignored
          python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" roster wiki
          for case in \
            actual_native_wiki_id_differs_from_folder_and_sibling_label_cannot_grant_scope \
            actual_owner_created_external_identity_missing_or_ambiguous_refuses_broad_query \
            actual_native_duplicate_id_is_withheld_from_every_internal_project_scope; do
            record_command "$case" "$image" --exact "$case" --ignored --nocapture --test-threads=1
          done
          python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" results wiki
      - name: Retain current held image basis and exact execution context on success or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${NATIVE_COMPOSITION_EVIDENCE:-$GITHUB_WORKSPACE/ProjectCentral/now/tmp/native-composition-${GITHUB_RUN_ID}-${RUNNER_OS}}"
          {
            echo "AIKit=$(git rev-parse HEAD)"
            echo "Central=$CENTRAL_SHA"
            echo "Actuation=$ACTUATION_SHA"
            echo 'Standing=native deterministic composition/Wiki scope; no live provider or human acceptance'
            rustc -Vv
          } > "$RUNNER_TEMP/composition-basis.txt"
          if [ -d "$evidence" ]; then
            cp "$RUNNER_TEMP/composition-basis.txt" "$evidence/composition-basis.txt"
            git status --porcelain > "$evidence/AIKit-status-after.txt"
            for owner in Central Actuation; do
              if [ -d "$RUNNER_TEMP/$owner/.git" ]; then git -C "$RUNNER_TEMP/$owner" status --porcelain > "$evidence/$owner-status-after.txt"; fi
            done
            if [ -f "$evidence/audit.py" ]; then python3 "$evidence/audit.py" after; fi
          else
            echo 'Native evidence root unavailable; no compilation/case/custody proof' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-field-native-composition-${{ runner.os }}-${{ github.sha }}
          path: |
            ${{ github.workspace }}/ProjectCentral/now/tmp/native-composition-${{ github.run_id }}-${{ runner.os }}/
            ${{ runner.temp }}/composition-basis.txt
          if-no-files-found: error

  native-current-source:
    name: Current native Source and consumer — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CENTRAL_SHA: 7a0e2c21505ad7cf6590db8701fc473102fd399b
      AIKIT_REQUIRE_RIPGREP_REAL: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require a real nonroot host and search providers
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          if ! command -v rg >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install ripgrep
            else
              sudo apt-get update -qq
              sudo apt-get install -y ripgrep
            fi
          fi
          rg --version
          python -m pip install 'bkmr==7.6.7'
          bkmr --version
          echo "CENTRAL_BKMR_BIN=$(command -v bkmr)" >> "$GITHUB_ENV"
      - name: Checkout the exact qualified native Source owner
        shell: bash
        run: |
          set -euo pipefail
          owner="$RUNNER_TEMP/current-source-central"
          git init -q "$owner"
          git -C "$owner" remote add origin https://github.com/EpiLogos/Central.git
          git -C "$owner" fetch --depth=1 origin "$CENTRAL_SHA"
          git -C "$owner" checkout --detach FETCH_HEAD
          test "$(git -C "$owner" rev-parse HEAD)" = "$CENTRAL_SHA"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            .
            ${{ runner.temp }}/current-source-central
      - name: Build the native owner
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path "$RUNNER_TEMP/current-source-central/Cargo.toml" --locked --bin ctrl
          ctrl="$RUNNER_TEMP/current-source-central/target/debug/ctrl"
          echo "AIKIT_CENTRAL_REAL_BIN=$ctrl" >> "$GITHUB_ENV"
          echo "CENTRAL_CTRL_BIN=$ctrl" >> "$GITHUB_ENV"
      - name: Require every selected native exercise definition
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-adapters --test central_file_map -- --ignored --list > "$RUNNER_TEMP/current-source-file-map-cases.txt"
          cargo test --locked -p aikit-adapters --test central_world_sources -- --ignored --list > "$RUNNER_TEMP/current-source-world-cases.txt"
          cargo test --locked -p aikit-cli --test wiki_commands -- --ignored --list > "$RUNNER_TEMP/current-source-wiki-cases.txt"
          python - <<'PYCASE'
          import json
          import os
          import pathlib
          required = {'file-map': ['live_native_identity_revision_withdrawal_and_new_source_survive_one_attachment', 'actual_indexed_native_search_and_retained_routes_withhold_withdrawn_or_changed_origins', 'completed_native_search_receipt_cannot_validate_changed_current_payload', 'nonowners_decline_before_current_central_and_independent_work_owners', 'attached_now_preserves_registered_project_identity_current_payload_and_native_failure', 'selected_now_roster_is_bounded_without_capping_unselected_world_sources', 'native_now_operation_budget_preserves_actual_transport_failure_without_fallback', 'native_now_does_not_stamp_a_later_revision_on_an_original_rg_match'], 'world': ['native_bare_prefixed_and_slash_ids_use_owner_ref_without_remint', 'native_source_override_exclusion_and_every_provenance_hop_reach_context', 'native_present_target_with_missing_ancestor_never_uses_root_fallback', 'native_manifest_less_existing_member_differs_from_nonexistent_member', 'native_malformed_wrong_form_and_missing_owner_do_not_become_declaration_absence', 'native_manifest_eacces_retains_actual_owner_cause_and_never_assumes_root', 'native_shared_probe_limits_and_final_identity_reobservation_are_operative', 'native_unchanged_root_alias_works_and_retargeted_owner_ref_is_refused', 'native_non_utf8_coordinate_refuses_before_selecting_lossy_owner', 'native_final_manifest_alias_and_fifo_refuse_without_opening_replacement', 'native_runner_decode_and_timeout_failures_never_become_absent_owner'], 'wiki': ['configured_native_root_survives_missing_user_aperture_and_external_invocation_cwd', 'actual_native_source_and_ancestor_withdrawal_refuse_corpus_target_without_output_effects', 'relative_native_floor_keeps_absolute_selected_alias_ancestor_and_actual_cwd', 'relative_invocation_cwd_and_root_preserve_marked_selected_alias_ancestor']}
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          actual = {}
          for group, names in required.items():
              lines = (temp / f"current-source-{group}-cases.txt").read_text().splitlines()
              listed = {line[:-6] for line in lines if line.endswith(": test")}
              assert len(names) == len(set(names)), f"Duplicate required {group} case"
              assert set(names) <= listed, f"Missing native {group} cases: {set(names) - listed}"
              if group != "wiki":
                  assert set(names) == listed, f"Unaccounted native {group} cases: {listed - set(names)}"
              actual[group] = {"required": names, "listed": sorted(listed), "selected_count": len(names)}
          (temp / "current-source-case-inventory.json").write_text(json.dumps(actual, indent=2) + "\n")
          PYCASE
      - name: Exercise native Source, World and Wiki consumers
        id: native-source
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-adapters --test central_file_map -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/current-source-file-map.log"
          cargo test --locked -p aikit-adapters --test central_world_sources -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/current-source-world.log"
          for case in \
            configured_native_root_survives_missing_user_aperture_and_external_invocation_cwd \
            actual_native_source_and_ancestor_withdrawal_refuse_corpus_target_without_output_effects \
            relative_native_floor_keeps_absolute_selected_alias_ancestor_and_actual_cwd \
            relative_invocation_cwd_and_root_preserve_marked_selected_alias_ancestor; do
            cargo test --locked -p aikit-cli --test wiki_commands "$case" -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/current-source-wiki-$case.log"
          done
          python - <<'PYRUN'
          import json
          import os
          import pathlib
          import re
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          inventory = json.loads((temp / "current-source-case-inventory.json").read_text())
          for group in ("file-map", "world"):
              text = (temp / f"current-source-{group}.log").read_text()
              for name in inventory[group]["required"]:
                  assert re.search(r"(?m)^test " + re.escape(name) + r" \.\.\. ok$", text), f"Native case did not pass: {name}"
              count = len(inventory[group]["required"])
              assert re.search(r"test result: ok\. " + str(count) + r" passed; 0 failed; 0 ignored;", text), f"Wrong native executed count: {group}"
          for name in inventory["wiki"]["required"]:
              text = (temp / f"current-source-wiki-{name}.log").read_text()
              assert re.search(r"(?m)^test " + re.escape(name) + r" \.\.\. ok$", text), f"Native Wiki case not executed: {name}"
              assert re.search(r"test result: ok\. 1 passed; 0 failed; 0 ignored;", text), f"Native Wiki case count mismatch: {name}"
          PYRUN
      - name: Retain the actual qualification cut
        if: always()
        shell: bash
        env:
          SOURCE_EXERCISE_OUTCOME: ${{ steps.native-source.outcome }}
        run: |
          python - <<'PYBASIS'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import subprocess
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          def observe(argv):
              try:
                  result = subprocess.run(argv, capture_output=True, text=True, timeout=15)
                  return {"argv": argv, "exit_code": result.returncode, "stdout": result.stdout, "stderr": result.stderr}
              except (OSError, subprocess.TimeoutExpired) as error:
                  return {"argv": argv, "error": str(error), "errno": getattr(error, "errno", None)}
          def material(path):
              return {"bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()} if path.is_file() else {"absent": True}
          ctrl = os.environ.get("AIKIT_CENTRAL_REAL_BIN")
          files = sorted(temp.glob("current-source-*.txt")) + sorted(temp.glob("current-source-*.log"))
          files.append(temp / "current-source-case-inventory.json")
          reading = {
              "schema": "aikit.native-current-source-qualification/v1",
              "aikit": observe(["git", "rev-parse", "HEAD"]),
              "central_expected": os.environ["CENTRAL_SHA"],
              "central": observe(["git", "-C", str(temp / "current-source-central"), "rev-parse", "HEAD"]),
              "ctrl": observe([ctrl, "--version"]) if ctrl else {"unavailable": "Native build did not publish a binary"},
              "ctrl_material": material(pathlib.Path(ctrl)) if ctrl else {"absent": True},
              "ctrl_variables_equal": ctrl is not None and ctrl == os.environ.get("CENTRAL_CTRL_BIN"),
              "bkmr": observe(["bkmr", "--version"]),
              "ripgrep": observe(["rg", "--version"]),
              "rust": observe(["rustc", "-Vv"]),
              "account": observe(["id"]),
              "platform": platform.platform(),
              "aikit_manifest": material(pathlib.Path("Cargo.toml")),
              "aikit_lock": material(pathlib.Path("Cargo.lock")),
              "exercise_outcome": os.environ["SOURCE_EXERCISE_OUTCOME"],
              "logs": {path.name: material(path) for path in files},
              "scope": "Actual built native owner and selected consumer fixtures. No installed world, model provider, retained Service identity or human acceptance claim.",
          }
          (temp / "current-source-basis.json").write_text(json.dumps(reading, indent=2) + "\n")
          PYBASIS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-current-source-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/current-source-*.txt
            ${{ runner.temp }}/current-source-*.log
            ${{ runner.temp }}/current-source-case-inventory.json
            ${{ runner.temp }}/current-source-basis.json
          if-no-files-found: error

  native-seat-guard:
    name: Native seat guard — ${{ matrix.os }} — ${{ matrix.scope }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            scope: full-three
            full: true
            minutes: 90
          - os: macos-15
            scope: bounded-two
            full: false
            minutes: 25
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    env:
      # Exact Root-admitted paired Source; no latest/installed claim.
      SEAT_GUARD_GATE_PRODUCT_REVISION: 0b4117930d8c16550ac8409ed663c9c32189fc51
      SEAT_GUARD_GATE_IGNORE_SHA256: fc51b0e55f8b89452cecc78be45d5db070689e72ed745a39c480c3f7f9729c8f
      SEAT_GUARD_GATE_RUN_SHA256: 36f6061f5cc7a73d34a06b3d98faabffdfbfeb70cd15d6356a036926956bc77a
      SEAT_GUARD_GATE_MANIFEST_SHA256: c5c7cd0560ae11388d95c27e90fa5965daef7b210359cb33022cb15117f51a40
      SEAT_GUARD_PRECOMMIT_CANDIDATE: ${{ github.workspace }}/crates/aikit-adapters/tests/fixtures/central-seat-guard/v2/pre-commit
      SEAT_GUARD_PREPUSH_CANDIDATE: ${{ github.workspace }}/crates/aikit-adapters/tests/fixtures/central-seat-guard/v2/pre-push
    steps:
      - name: Checkout exact AIKit qualification source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the existing native Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        if: matrix.full
        with:
          node-version: "22"
      - name: Require actual nonroot tools and preserve their homes
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v git
          command -v python3
          command -v mkfifo
          command -v cargo
          command -v rustc
          guard_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          guard_rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          test -d "$guard_cargo_home"
          test -d "$guard_rustup_home"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "$guard_cargo_home" "$guard_rustup_home" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/seat-guard-browser-engines" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/seat-guard-browser-engines"
      - name: Checkout the exact declared O:I producer source
        if: matrix.full
        shell: bash
        run: |
          set -euo pipefail
          owner="$RUNNER_TEMP/seat-guard-oi"
          git init -q "$owner"
          git -C "$owner" remote add origin https://github.com/EpiLogos/O-I.git
          git -C "$owner" fetch origin "$SEAT_GUARD_GATE_PRODUCT_REVISION"
          git -C "$owner" checkout --detach FETCH_HEAD
          test "$(git -C "$owner" rev-parse HEAD)" = "$SEAT_GUARD_GATE_PRODUCT_REVISION"
          test -z "$(git -C "$owner" status --porcelain)"
          echo "SEAT_GUARD_GATE_PRODUCT_REPOSITORY=$owner" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Provision the actual existing landing-tier browser prerequisites
        if: matrix.full
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY/desktop/cradle" --no-audit --no-fund
          cd "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY/desktop/cradle"
          npx playwright install --with-deps chromium webkit
          test -d "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Build the actual owners required by the declared editor gate
        if: matrix.full
        shell: bash
        run: |
          set -euo pipefail
          central="$RUNNER_TEMP/seat-guard-central"
          central_revision=2a604574774c41921003ed99a2eed73b4c9f4266
          git init -q "$central"
          git -C "$central" remote add origin https://github.com/EpiLogos/Central.git
          git -C "$central" fetch --depth=1 origin "$central_revision"
          git -C "$central" checkout --detach FETCH_HEAD
          test "$(git -C "$central" rev-parse HEAD)" = "$central_revision"
          git -C "$central" rev-parse HEAD > "$RUNNER_TEMP/seat-guard-native-central.revision"
          cd "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY"
          python3 desktop/cradle/tests/wiki-native-binaries.py \
            --target OI_BIN cli/Cargo.toml oi \
            --target OI_CENTRAL_CTRL_BIN "$central/ctrl/Cargo.toml" ctrl \
            --target OI_KERNEL_BIN desktop/cradle/kernel/Cargo.toml walk-bridge \
            --receipt "$RUNNER_TEMP/seat-guard-native-binaries.json"
      - name: Require all three genuine ignored definitions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-adapters --test native_seat_guard -- --ignored --list 2>&1 | tee "$RUNNER_TEMP/seat-guard-cases.log"
          python3 - <<'PYCASES'
          import json
          import os
          import pathlib
          names = ["real_precommit_qualifies_register_and_refuses_material_or_shape_failure", "real_precommit_preserves_primary_nested_foreign_legacy_and_stray_scope", "real_prepush_uses_third_destination_token_and_actual_full_tip_receipt"]
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          listed = [line[:-6] for line in (temp / "seat-guard-cases.log").read_text().splitlines() if line.endswith(": test")]
          assert len(listed) == len(set(listed)) == 3, listed
          assert set(listed) == set(names), (listed, names)
          reading = {"schema":"central.seat-guard-test-selection/v1", "listed":listed, "linux_selected":names, "mac_selected":names[:2], "mac_main_positive":"unqualified"}
          (temp / "seat-guard-case-inventory.json").write_text(json.dumps(reading, indent=2) + "\n")
          PYCASES
      - name: Exercise all actual Linux cases including fresh full owner gates
        id: full
        if: matrix.full
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-adapters --test native_seat_guard -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/seat-guard-full.log"
          python3 - <<'PYFULL'
          import json
          import os
          import pathlib
          import re
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          text = (temp / "seat-guard-full.log").read_text()
          names = json.loads((temp / "seat-guard-case-inventory.json").read_text())["linux_selected"]
          for name in names:
              assert re.search(r"(?m)^test " + re.escape(name) + r" \.\.\. ok$", text), name
          assert re.search(r"test result: ok\. 3 passed; 0 failed; 0 ignored;", text), text
          PYFULL
      - name: Exercise the two actual bounded Mac cases
        id: bounded
        if: ${{ !matrix.full }}
        shell: bash
        run: |
          set -euo pipefail
          for case in \
            real_precommit_qualifies_register_and_refuses_material_or_shape_failure \
            real_precommit_preserves_primary_nested_foreign_legacy_and_stray_scope; do
            cargo test --locked -p aikit-adapters --test native_seat_guard "$case" -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/seat-guard-$case.log"
          done
          python3 - <<'PYBOUNDED'
          import json
          import os
          import pathlib
          import re
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          names = json.loads((temp / "seat-guard-case-inventory.json").read_text())["mac_selected"]
          for name in names:
              text = (temp / f"seat-guard-{name}.log").read_text()
              assert re.search(r"(?m)^test " + re.escape(name) + r" \.\.\. ok$", text), name
              assert re.search(r"test result: ok\. 1 passed; 0 failed; 0 ignored;", text), text
          PYBOUNDED
      - name: Retain actual source, host, tools and evidence hashes
        if: always()
        shell: bash
        env:
          GUARD_SCOPE: ${{ matrix.scope }}
          GUARD_FULL_OUTCOME: ${{ steps.full.outcome }}
          GUARD_BOUNDED_OUTCOME: ${{ steps.bounded.outcome }}
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            git status --porcelain
            id
            uname -a
            git --version
            python3 --version
            rustc -Vv
            cargo --version
            if command -v node >/dev/null 2>&1; then node --version; fi
            if test -n "${SEAT_GUARD_GATE_PRODUCT_REPOSITORY:-}"; then
              printf 'actual declared O:I producer root: %s\n' "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY"
              git -C "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY" rev-parse HEAD
              git -C "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY" status --porcelain
            else
              printf 'O:I full producer: unselected on this bounded host\n'
            fi
          } > "$RUNNER_TEMP/seat-guard-actual-tools.log" 2>&1
          python3 - <<'PYBASIS'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = root / "ProjectCentral/now/tmp/native-seat-guard-evidence"
          def material(path):
              if not path.is_file():
                  return {"absent": True}
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  while block := source.read(65536):
                      digest.update(block)
              return {"bytes":path.stat().st_size,"sha256":digest.hexdigest()}
          paths = [root / "Cargo.toml", root / "Cargo.lock", root / "crates/aikit-adapters/Cargo.toml", root / "crates/aikit-adapters/src/runner.rs", root / "crates/aikit-adapters/tests/native_seat_guard.rs", pathlib.Path(os.environ["SEAT_GUARD_PRECOMMIT_CANDIDATE"]), pathlib.Path(os.environ["SEAT_GUARD_PREPUSH_CANDIDATE"])]
          producer = os.environ.get("SEAT_GUARD_GATE_PRODUCT_REPOSITORY")
          producer_root = pathlib.Path(producer) if producer else None
          producer_evidence = producer_root / "ProjectCentral/now/tmp/native-seat-guard-evidence" if producer_root else None
          if producer_root:
              paths.extend(producer_root / member for member in [".gitignore", "gates/run.mjs", "gates/manifest.json", "desktop/cradle/package-lock.json"])
          reading = {"schema":"central.seat-guard-hosted-qualification/v1", "scope":os.environ["GUARD_SCOPE"], "platform":platform.platform(), "full_outcome":os.environ["GUARD_FULL_OUTCOME"], "bounded_outcome":os.environ["GUARD_BOUNDED_OUTCOME"], "oi_initial_source":os.environ["SEAT_GUARD_GATE_PRODUCT_REVISION"], "source_files":{str(path):material(path) for path in paths}, "evidence":{str(path.relative_to(evidence)):material(path) for path in sorted(evidence.rglob("*")) if path.is_file()} if evidence.is_dir() else {"absent":True}, "standing":"actual controlled test evidence only; no protected install, private Original or human acceptance", "mac_main_positive":"unqualified", "fresh_receipt_required":"Linux actual producer in controlled clone; no transported predecessor"}
          reading["oi_paired_source"] = os.environ["SEAT_GUARD_GATE_PRODUCT_REVISION"]
          native_receipt = temp / "seat-guard-native-binaries.json"
          native_bindings = json.loads(native_receipt.read_text()) if native_receipt.is_file() else {}
          reading["actual_native_bindings"] = {name:{"path":value,**material(pathlib.Path(value))} for name,value in native_bindings.items()}
          reading["native_prerequisite_source"] = {"receipt":material(native_receipt),"central_revision":(temp / "seat-guard-native-central.revision").read_text().strip() if (temp / "seat-guard-native-central.revision").is_file() else None,"oi_build_helper":material(producer_root / "desktop/cradle/tests/wiki-native-binaries.py") if producer_root else {"unselected":True},"not_personal_installation":True}
          reading["evidence_roots"] = {"aikit_project":str(root), "oi_producer_project":str(producer_root) if producer_root else None}
          reading["producer_evidence_selected"] = producer_root is not None
          reading["producer_evidence"] = {str(path.relative_to(producer_evidence)):material(path) for path in sorted(producer_evidence.rglob("*")) if path.is_file()} if producer_evidence is not None and producer_evidence.is_dir() else {"absent":True}
          (temp / "seat-guard-hosted-basis.json").write_text(json.dumps(reading, indent=2) + "\n")
          PYBASIS
      - name: Retain full actual qualification outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-seat-guard-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/seat-guard-*.log
            ${{ runner.temp }}/seat-guard-case-inventory.json
            ${{ runner.temp }}/seat-guard-hosted-basis.json
            ${{ runner.temp }}/seat-guard-native-binaries.json
            ${{ runner.temp }}/seat-guard-native-central.revision
            ProjectCentral/now/tmp/native-seat-guard-evidence/
            ${{ runner.temp }}/seat-guard-oi/ProjectCentral/now/tmp/native-seat-guard-evidence/
          retention-days: 14
