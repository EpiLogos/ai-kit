name: Cross-product (weekly)

# Every check that checks out or builds another repository runs here weekly
# and on demand, not per push: each sibling gates its own main. A red job is
# a rotted pin or a moved seam, repaired in its own change.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  factory-developmental-real:
    name: Real Factory developmental consumer conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Checkout exact Factory owner revision
        uses: actions/checkout@v7.0.1
        with:
          repository: EpiLogos/agent-system-design
          ref: 12a721dbbb51e3c70d52ef00220efa859ef930fd
          path: factory-owner
      - name: Build native Factory CLI
        working-directory: factory-owner
        run: cargo build --locked -p epilogos-factory --bin factory
      - name: Consume owner-generated state through the real Factory CLI
        env:
          AIKIT_FACTORY_REAL_BIN: ${{ github.workspace }}/factory-owner/target/debug/factory
          AIKIT_FACTORY_COMMISSION_REQUEST: ${{ github.workspace }}/factory-owner/contracts/factory/fixtures/oi-self-hosting-commission-request.json
          AIKIT_FACTORY_TEST_STATE_OUT: ${{ runner.temp }}/factory-developmental-state.json
          AIKIT_FACTORY_TEST_MANIFEST_OUT: ${{ runner.temp }}/factory-developmental-manifest.json
        run: |
          cargo test --locked -p aikit-adapters --test factory_developmental_native -- --ignored --nocapture
          cargo test --locked -p aikit-cli --test factory_start_work_native -- --ignored --nocapture
          cargo test --locked -p aikit-cli --test factory_work_tui_native -- --ignored --nocapture
          project_ref=$(python3 -c 'import json; print(json.load(open("${{ runner.temp }}/factory-developmental-manifest.json"))["projectRef"])')
          echo "AIKIT_FACTORY_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"
      - name: Resolve the Factory WorkflowUnit through AIKit's real structured CLI
        env:
          AIKIT_HOME: ${{ runner.temp }}/aikit-home
          AIKIT_FACTORY_BIN: ${{ github.workspace }}/factory-owner/target/debug/factory
          AIKIT_FACTORY_STATE: ${{ runner.temp }}/factory-developmental-state.json
        run: |
          mkdir -p ${{ runner.temp }}/aikit-project/.aikit
          cargo run --locked -p aikit-cli --bin aikit -- --json -C ${{ runner.temp }}/aikit-project search implement > ${{ runner.temp }}/aikit-factory-search.json
          grep -q '"resource_kind":"workflow-unit"' ${{ runner.temp }}/aikit-factory-search.json

  deepseek-cordis-real:
    name: Real DeepSeek Cordis SessionSpace activation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
          path: deepseek-harness
      - name: Install pinned DeepSeek Harness workspace
        working-directory: deepseek-harness
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Prove current upstream Web/Cordis launch seam
        working-directory: deepseek-harness
        shell: bash
        run: |
          set -euo pipefail
          report_failure() {
            tail -n 100 /tmp/deepseek-cordis.log > /tmp/deepseek-cordis-focus.log || true
            message=$(cat /tmp/deepseek-cordis-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=Upstream DeepSeek Web/Cordis launch failure::$message"
          }
          node --import tsx apps/cli/src/bin.ts web > /tmp/deepseek-cordis.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 100); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'DeepSeek Web/Cordis process exited before readiness:'
              cat /tmp/deepseek-cordis.log
              report_failure
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/3080) 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'DeepSeek Web/Cordis process did not expose 127.0.0.1:3080:'
            cat /tmp/deepseek-cordis.log
            report_failure
            exit 1
          fi
          echo 'DeepSeek Web/Cordis endpoint is live at 127.0.0.1:3080'
          cleanup
          trap - EXIT
      - name: Run real Cordis activation through SessionSpace
        shell: bash
        env:
          AIKIT_REQUIRE_DEEPSEEK_CORDIS_REAL: "1"
          AIKIT_DEEPSEEK_HARNESS_CHECKOUT: ${{ github.workspace }}/deepseek-harness
        run: |
          set +e
          cargo test --locked -p aikit-adapters --test deepseek_cordis_real -- --nocapture --test-threads=1 2>&1 | tee /tmp/aikit-cordis.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^error(\[|:)|^failures:|^test result:|^thread .*panicked|^  left:|^ right:|^note:|^help:|session_space|cordis\.process|Cordis provider)' /tmp/aikit-cordis.log | tail -n 120 > /tmp/aikit-cordis-focus.log || true
            message=$(cat /tmp/aikit-cordis-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=Real DeepSeek Cordis SessionSpace failure::$message"
          fi
          exit "$status"
  collapsed-local-workcell:
    name: AIKit Surface ↔ Workcell managed-service proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AIKit candidate
        uses: actions/checkout@v7.0.1

      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Prove AIKit persistent Surface identity and rebinding
        run: cargo test --locked -p aikit-core --test surface_material_v2 -- --nocapture --test-threads=1

      - name: Checkout pinned Workcell collapsed-local substrate
        uses: actions/checkout@v7.0.1
        with:
          repository: EpiLogos/Workcell
          ref: 8184f9ba95c5efc0077701a4b58c1abb2943bd6e
          path: workcell

      - name: Prove real local managed-service lifecycle in Workcell
        working-directory: workcell
        run: cargo test --locked -p epilogos-workcell-runtime --test managed_host_service -- --nocapture --test-threads=1

      - name: Record pre-physical boundary
        shell: bash
        run: |
          cat <<'EOF'
          Persistent Surface conformance passed against Workcell 8184f9ba95c5efc0077701a4b58c1abb2943bd6e.
          This gate proves collapsed-local process/service readiness, observation, disappearance,
          release/rematerialisation and AIKit identity-preserving Surface rebinding.
          It deliberately does not claim Ubuntu/Tailscale/Fabric physical acceptance.
          EOF

  native-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CENTRAL_SHA: 4cd0fe52b10fb0e09a5a9e4486ea3d40d4946c5c
      ACTUATION_SHA: 4af495f6509bb0dd779112a225d71a9df8145b6e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact native owner dependencies
        shell: bash
        run: |
          set -euo pipefail
          for owner in Central Actuation; do
            revision="$CENTRAL_SHA"
            if [ "$owner" = Actuation ]; then revision="$ACTUATION_SHA"; fi
            root="$RUNNER_TEMP/$owner"
            git init -q "$root"
            git -C "$root" remote add origin "https://github.com/EpiLogos/$owner.git"
            git -C "$root" fetch --depth=1 origin "$revision"
            git -C "$root" checkout --detach FETCH_HEAD
            test "$(git -C "$root" rev-parse HEAD)" = "$revision"
          done
          printf '%s\n' "$RUNNER_TEMP/Central/target/debug" "$RUNNER_TEMP/Actuation/target/release" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            .
            ${{ runner.temp }}/Central
            ${{ runner.temp }}/Actuation
      - name: Build native Central
        run: cargo build --manifest-path "$RUNNER_TEMP/Central/Cargo.toml" --locked --bin ctrl
      - name: Build native Actuation
        run: cargo build --manifest-path "$RUNNER_TEMP/Actuation/Cargo.toml" --locked -p actuation-cli
      - name: Run native composition and exact source-byte receipt regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-cli --test compose_native_central -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/composition.log"
      - name: Retain exact execution context
        if: always()
        shell: bash
        run: |
          {
            echo "AIKit=$(git rev-parse HEAD)"
            echo "Central=$CENTRAL_SHA"
            echo "Actuation=$ACTUATION_SHA"
            echo 'Standing=native deterministic composition; no live provider or human acceptance'
            rustc -Vv
          } > "$RUNNER_TEMP/composition-basis.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-field-native-composition
          path: |
            ${{ runner.temp }}/composition.log
            ${{ runner.temp }}/composition-basis.txt
          if-no-files-found: error

  native-seat-guard:
    name: Native seat guard — ${{ matrix.os }} — ${{ matrix.scope }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            scope: full-three
            full: true
            minutes: 90
          - os: macos-15
            scope: bounded-two
            full: false
            minutes: 25
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    env:
      # Root-declared initial isolated test basis. No latest/installed claim.
      SEAT_GUARD_GATE_PRODUCT_REVISION: 7220e83dc3dc3cc72a0bceebbf33533f86117c96
      SEAT_GUARD_GATE_RUN_SHA256: 36f6061f5cc7a73d34a06b3d98faabffdfbfeb70cd15d6356a036926956bc77a
      SEAT_GUARD_GATE_MANIFEST_SHA256: c5c7cd0560ae11388d95c27e90fa5965daef7b210359cb33022cb15117f51a40
      SEAT_GUARD_PRECOMMIT_CANDIDATE: ${{ github.workspace }}/crates/aikit-adapters/tests/fixtures/central-seat-guard/v2/pre-commit
      SEAT_GUARD_PREPUSH_CANDIDATE: ${{ github.workspace }}/crates/aikit-adapters/tests/fixtures/central-seat-guard/v2/pre-push
    steps:
      - name: Checkout exact AIKit qualification source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the existing native Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        if: matrix.full
        with:
          node-version: "22"
      - name: Require actual nonroot tools and preserve their homes
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v git
          command -v python3
          command -v mkfifo
          command -v cargo
          command -v rustc
          guard_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          guard_rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          test -d "$guard_cargo_home"
          test -d "$guard_rustup_home"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "$guard_cargo_home" "$guard_rustup_home" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/seat-guard-browser-engines" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/seat-guard-browser-engines"
      - name: Checkout the exact declared O:I producer source
        if: matrix.full
        shell: bash
        run: |
          set -euo pipefail
          owner="$RUNNER_TEMP/seat-guard-oi"
          git init -q "$owner"
          git -C "$owner" remote add origin https://github.com/EpiLogos/O-I.git
          git -C "$owner" fetch --depth=1 origin "$SEAT_GUARD_GATE_PRODUCT_REVISION"
          git -C "$owner" checkout --detach FETCH_HEAD
          test "$(git -C "$owner" rev-parse HEAD)" = "$SEAT_GUARD_GATE_PRODUCT_REVISION"
          test -z "$(git -C "$owner" status --porcelain)"
          echo "SEAT_GUARD_GATE_PRODUCT_REPOSITORY=$owner" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Provision the actual existing landing-tier browser prerequisites
        if: matrix.full
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY/desktop/cradle" --no-audit --no-fund
          cd "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY/desktop/cradle"
          npx playwright install --with-deps chromium webkit
          test -d "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Require all three genuine ignored definitions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-adapters --test native_seat_guard -- --ignored --list 2>&1 | tee "$RUNNER_TEMP/seat-guard-cases.log"
          python3 - <<'PYCASES'
          import json
          import os
          import pathlib
          names = ["real_precommit_qualifies_register_and_refuses_material_or_shape_failure", "real_precommit_preserves_primary_nested_foreign_legacy_and_stray_scope", "real_prepush_uses_third_destination_token_and_actual_full_tip_receipt"]
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          listed = [line[:-6] for line in (temp / "seat-guard-cases.log").read_text().splitlines() if line.endswith(": test")]
          assert len(listed) == len(set(listed)) == 3, listed
          assert set(listed) == set(names), (listed, names)
          reading = {"schema":"central.seat-guard-test-selection/v1", "listed":listed, "linux_selected":names, "mac_selected":names[:2], "mac_main_positive":"unqualified"}
          (temp / "seat-guard-case-inventory.json").write_text(json.dumps(reading, indent=2) + "\n")
          PYCASES
      - name: Exercise all actual Linux cases including fresh full owner gates
        id: full
        if: matrix.full
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-adapters --test native_seat_guard -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/seat-guard-full.log"
          python3 - <<'PYFULL'
          import json
          import os
          import pathlib
          import re
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          text = (temp / "seat-guard-full.log").read_text()
          names = json.loads((temp / "seat-guard-case-inventory.json").read_text())["linux_selected"]
          for name in names:
              assert re.search(r"(?m)^test " + re.escape(name) + r" \.\.\. ok$", text), name
          assert re.search(r"test result: ok\. 3 passed; 0 failed; 0 ignored;", text), text
          PYFULL
      - name: Exercise the two actual bounded Mac cases
        id: bounded
        if: ${{ !matrix.full }}
        shell: bash
        run: |
          set -euo pipefail
          for case in \
            real_precommit_qualifies_register_and_refuses_material_or_shape_failure \
            real_precommit_preserves_primary_nested_foreign_legacy_and_stray_scope; do
            cargo test --locked -p aikit-adapters --test native_seat_guard "$case" -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/seat-guard-$case.log"
          done
          python3 - <<'PYBOUNDED'
          import json
          import os
          import pathlib
          import re
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          names = json.loads((temp / "seat-guard-case-inventory.json").read_text())["mac_selected"]
          for name in names:
              text = (temp / f"seat-guard-{name}.log").read_text()
              assert re.search(r"(?m)^test " + re.escape(name) + r" \.\.\. ok$", text), name
              assert re.search(r"test result: ok\. 1 passed; 0 failed; 0 ignored;", text), text
          PYBOUNDED
      - name: Retain actual source, host, tools and evidence hashes
        if: always()
        shell: bash
        env:
          GUARD_SCOPE: ${{ matrix.scope }}
          GUARD_FULL_OUTCOME: ${{ steps.full.outcome }}
          GUARD_BOUNDED_OUTCOME: ${{ steps.bounded.outcome }}
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            git status --porcelain
            id
            uname -a
            git --version
            python3 --version
            rustc -Vv
            cargo --version
            if command -v node >/dev/null 2>&1; then node --version; fi
          } > "$RUNNER_TEMP/seat-guard-actual-tools.log" 2>&1
          python3 - <<'PYBASIS'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = root / "ProjectCentral/now/tmp/native-seat-guard-evidence"
          def material(path):
              if not path.is_file():
                  return {"absent": True}
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  while block := source.read(65536):
                      digest.update(block)
              return {"bytes":path.stat().st_size,"sha256":digest.hexdigest()}
          paths = [root / "Cargo.toml", root / "Cargo.lock", root / "crates/aikit-adapters/Cargo.toml", root / "crates/aikit-adapters/src/runner.rs", root / "crates/aikit-adapters/tests/native_seat_guard.rs", pathlib.Path(os.environ["SEAT_GUARD_PRECOMMIT_CANDIDATE"]), pathlib.Path(os.environ["SEAT_GUARD_PREPUSH_CANDIDATE"])]
          producer = os.environ.get("SEAT_GUARD_GATE_PRODUCT_REPOSITORY")
          if producer:
              paths.extend(pathlib.Path(producer) / member for member in ["gates/run.mjs", "gates/manifest.json", "desktop/cradle/package-lock.json"])
          reading = {"schema":"central.seat-guard-hosted-qualification/v1", "scope":os.environ["GUARD_SCOPE"], "platform":platform.platform(), "full_outcome":os.environ["GUARD_FULL_OUTCOME"], "bounded_outcome":os.environ["GUARD_BOUNDED_OUTCOME"], "oi_initial_source":os.environ["SEAT_GUARD_GATE_PRODUCT_REVISION"], "source_files":{str(path):material(path) for path in paths}, "evidence":{str(path.relative_to(evidence)):material(path) for path in sorted(evidence.rglob("*")) if path.is_file()} if evidence.is_dir() else {"absent":True}, "standing":"actual controlled test evidence only; no protected install, private Original or human acceptance", "mac_main_positive":"unqualified", "fresh_receipt_required":"Linux actual producer in controlled clone; no transported predecessor"}
          (temp / "seat-guard-hosted-basis.json").write_text(json.dumps(reading, indent=2) + "\n")
          PYBASIS
      - name: Retain full actual qualification outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-seat-guard-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/seat-guard-*.log
            ${{ runner.temp }}/seat-guard-case-inventory.json
            ${{ runner.temp }}/seat-guard-hosted-basis.json
            ProjectCentral/now/tmp/native-seat-guard-evidence/
          retention-days: 14
          if-no-files-found: error
