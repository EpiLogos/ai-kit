      - name: Require complete R4 compiled rosters and every selected body
        shell: bash
        run: |
          set -euo pipefail
          source "$NATIVE_COMPOSITION_EVIDENCE/record-command.sh"
          test "$(id -u)" -ne 0
          test "$(python3 -c 'import os; print(os.path.realpath(os.environ["AIKIT_CENTRAL_REAL_BIN"]))')" = "$(python3 -c 'import os; print(os.path.realpath(os.environ["CENTRAL_CTRL_BIN"]))')"
          python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" r4-plan
          while IFS=$'\t' read -r group role filter; do
            image="$(cat "$NATIVE_COMPOSITION_EVIDENCE/$role.path")"
            args=(); if [ "$filter" != - ]; then args+=("$filter"); fi
            record_command "$group-list" "$image" "${args[@]}" --list --format terse
            record_command "$group-ignored-list" "$image" "${args[@]}" --list --ignored --format terse
            python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" r4-roster "$group"
          done < "$NATIVE_COMPOSITION_EVIDENCE/r4-groups.tsv"
          while IFS=$'\t' read -r prefix role case ignored; do
            image="$(cat "$NATIVE_COMPOSITION_EVIDENCE/$role.path")"
            args=(); if [ "$ignored" = 1 ]; then args+=(--ignored); fi
            # Retain actual status/raw even on failure before asserting the result.
            if record_command "$prefix" "$image" --exact "$case" "${args[@]}" --nocapture --test-threads=1; then
              case_status=0
            else
              case_status=$?
            fi
            python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" r4-result "$prefix" "$case"
            test "$case_status" -eq 0
          done < "$NATIVE_COMPOSITION_EVIDENCE/r4-cases.tsv"
          python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" r4-results
      - name: Retain current held image basis and exact execution context on success or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${NATIVE_COMPOSITION_EVIDENCE:-$GITHUB_WORKSPACE/ProjectCentral/now/tmp/native-composition-${GITHUB_RUN_ID}-${RUNNER_OS}}"
          {
            echo "AIKit=$(git rev-parse HEAD)"
            echo "Central=$CENTRAL_SHA"
            echo "Actuation=$ACTUATION_SHA"
            echo 'Standing=native deterministic composition/Wiki scope; no live provider or human acceptance'
            rustc -Vv
          } > "$RUNNER_TEMP/composition-basis.txt"
          if [ -d "$evidence" ]; then
            cp "$RUNNER_TEMP/composition-basis.txt" "$evidence/composition-basis.txt"
            git status --porcelain > "$evidence/AIKit-status-after.txt"
            for owner in Central Actuation; do
              if [ -d "$RUNNER_TEMP/$owner/.git" ]; then git -C "$RUNNER_TEMP/$owner" status --porcelain > "$evidence/$owner-status-after.txt"; fi
            done
            if [ -f "$evidence/audit.py" ]; then python3 "$evidence/audit.py" after; fi
          else
            echo 'Native evidence root unavailable; no compilation/case/custody proof' >&2
            exit 1
          fi
      - name: Admit portable native evidence paths and retain known partial output
        id: r4-upload-paths
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$NATIVE_COMPOSITION_EVIDENCE/audit.py"
          python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" upload-paths
      - uses: actions/upload-artifact@v4
        if: always() && steps.r4-upload-paths.outputs.paths != ''
        with:
          name: development-field-native-composition-${{ runner.os }}-${{ github.sha }}
          path: |
            ${{ steps.r4-upload-paths.outputs.paths }}
            ${{ runner.temp }}/composition-basis.txt
          if-no-files-found: error

  native-seat-guard:
    name: Native seat guard — ${{ matrix.os }} — ${{ matrix.scope }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            scope: full-three
            full: true
            minutes: 90
          - os: macos-15
            scope: bounded-two
            full: false
            minutes: 25
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.minutes }}
    env:
      # Exact Root-admitted paired Source; no latest/installed claim.
      SEAT_GUARD_GATE_PRODUCT_REVISION: 0b4117930d8c16550ac8409ed663c9c32189fc51
      SEAT_GUARD_GATE_IGNORE_SHA256: fc51b0e55f8b89452cecc78be45d5db070689e72ed745a39c480c3f7f9729c8f
      SEAT_GUARD_GATE_RUN_SHA256: 36f6061f5cc7a73d34a06b3d98faabffdfbfeb70cd15d6356a036926956bc77a
      SEAT_GUARD_GATE_MANIFEST_SHA256: c5c7cd0560ae11388d95c27e90fa5965daef7b210359cb33022cb15117f51a40
      SEAT_GUARD_PRECOMMIT_CANDIDATE: ${{ github.workspace }}/crates/aikit-adapters/tests/fixtures/central-seat-guard/v2/pre-commit
      SEAT_GUARD_PREPUSH_CANDIDATE: ${{ github.workspace }}/crates/aikit-adapters/tests/fixtures/central-seat-guard/v2/pre-push
    steps:
      - name: Checkout exact AIKit qualification source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the existing native Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        if: matrix.full
        with:
          node-version: "22"
      - name: Require actual nonroot tools and preserve their homes
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v git
          command -v python3
          command -v mkfifo
          command -v cargo
          command -v rustc
          guard_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          guard_rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          test -d "$guard_cargo_home"
          test -d "$guard_rustup_home"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "$guard_cargo_home" "$guard_rustup_home" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/seat-guard-browser-engines" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/seat-guard-browser-engines"
      - name: Checkout the exact declared O:I producer source
        if: matrix.full
        shell: bash
        run: |
          set -euo pipefail
          owner="$RUNNER_TEMP/seat-guard-oi"
          git init -q "$owner"
          git -C "$owner" remote add origin https://github.com/EpiLogos/O-I.git
          git -C "$owner" fetch origin "$SEAT_GUARD_GATE_PRODUCT_REVISION"
          git -C "$owner" checkout --detach FETCH_HEAD
          test "$(git -C "$owner" rev-parse HEAD)" = "$SEAT_GUARD_GATE_PRODUCT_REVISION"
          test -z "$(git -C "$owner" status --porcelain)"
          echo "SEAT_GUARD_GATE_PRODUCT_REPOSITORY=$owner" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Provision the actual existing landing-tier browser prerequisites
        if: matrix.full
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY/desktop/cradle" --no-audit --no-fund
          cd "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY/desktop/cradle"
          npx playwright install --with-deps chromium webkit
          test -d "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Build the actual owners required by the declared editor gate
        if: matrix.full
        shell: bash
        run: |
          set -euo pipefail
          central="$RUNNER_TEMP/seat-guard-central"
          central_revision=2a604574774c41921003ed99a2eed73b4c9f4266
          git init -q "$central"
          git -C "$central" remote add origin https://github.com/EpiLogos/Central.git
          git -C "$central" fetch --depth=1 origin "$central_revision"
          git -C "$central" checkout --detach FETCH_HEAD
          test "$(git -C "$central" rev-parse HEAD)" = "$central_revision"
          git -C "$central" rev-parse HEAD > "$RUNNER_TEMP/seat-guard-native-central.revision"
          cd "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY"
          python3 desktop/cradle/tests/wiki-native-binaries.py \
            --target OI_BIN cli/Cargo.toml oi \
            --target OI_CENTRAL_CTRL_BIN "$central/ctrl/Cargo.toml" ctrl \
            --target OI_KERNEL_BIN desktop/cradle/kernel/Cargo.toml walk-bridge \
            --receipt "$RUNNER_TEMP/seat-guard-native-binaries.json"
      - name: Require all three genuine ignored definitions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-adapters --test native_seat_guard -- --ignored --list 2>&1 | tee "$RUNNER_TEMP/seat-guard-cases.log"
          python3 - <<'PYCASES'
          import json
          import os
          import pathlib
          names = ["real_precommit_qualifies_register_and_refuses_material_or_shape_failure", "real_precommit_preserves_primary_nested_foreign_legacy_and_stray_scope", "real_prepush_uses_third_destination_token_and_actual_full_tip_receipt"]
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          listed = [line[:-6] for line in (temp / "seat-guard-cases.log").read_text().splitlines() if line.endswith(": test")]
          assert len(listed) == len(set(listed)) == 3, listed
          assert set(listed) == set(names), (listed, names)
          reading = {"schema":"central.seat-guard-test-selection/v1", "listed":listed, "linux_selected":names, "mac_selected":names[:2], "mac_main_positive":"unqualified"}
          (temp / "seat-guard-case-inventory.json").write_text(json.dumps(reading, indent=2) + "\n")
          PYCASES
      - name: Exercise all actual Linux cases including fresh full owner gates
        id: full
        if: matrix.full
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-adapters --test native_seat_guard -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/seat-guard-full.log"
          python3 - <<'PYFULL'
          import json
          import os
          import pathlib
          import re
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          text = (temp / "seat-guard-full.log").read_text()
          names = json.loads((temp / "seat-guard-case-inventory.json").read_text())["linux_selected"]
          for name in names:
              assert re.search(r"(?m)^test " + re.escape(name) + r" \.\.\. ok$", text), name
          assert re.search(r"test result: ok\. 3 passed; 0 failed; 0 ignored;", text), text
          PYFULL
      - name: Exercise the two actual bounded Mac cases
        id: bounded
        if: ${{ !matrix.full }}
        shell: bash
        run: |
          set -euo pipefail
          for case in \
            real_precommit_qualifies_register_and_refuses_material_or_shape_failure \
            real_precommit_preserves_primary_nested_foreign_legacy_and_stray_scope; do
            cargo test --locked -p aikit-adapters --test native_seat_guard "$case" -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/seat-guard-$case.log"
          done
          python3 - <<'PYBOUNDED'
          import json
          import os
          import pathlib
          import re
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          names = json.loads((temp / "seat-guard-case-inventory.json").read_text())["mac_selected"]
          for name in names:
              text = (temp / f"seat-guard-{name}.log").read_text()
              assert re.search(r"(?m)^test " + re.escape(name) + r" \.\.\. ok$", text), name
              assert re.search(r"test result: ok\. 1 passed; 0 failed; 0 ignored;", text), text
          PYBOUNDED
      - name: Retain actual source, host, tools and evidence hashes
        if: always()
        shell: bash
        env:
          GUARD_SCOPE: ${{ matrix.scope }}
          GUARD_FULL_OUTCOME: ${{ steps.full.outcome }}
          GUARD_BOUNDED_OUTCOME: ${{ steps.bounded.outcome }}
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            git status --porcelain
            id
            uname -a
            git --version
            python3 --version
            rustc -Vv
            cargo --version
            if command -v node >/dev/null 2>&1; then node --version; fi
            if test -n "${SEAT_GUARD_GATE_PRODUCT_REPOSITORY:-}"; then
              printf 'actual declared O:I producer root: %s\n' "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY"
              git -C "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY" rev-parse HEAD
              git -C "$SEAT_GUARD_GATE_PRODUCT_REPOSITORY" status --porcelain
            else
              printf 'O:I full producer: unselected on this bounded host\n'
            fi
          } > "$RUNNER_TEMP/seat-guard-actual-tools.log" 2>&1
          python3 - <<'PYBASIS'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = root / "ProjectCentral/now/tmp/native-seat-guard-evidence"
          def material(path):
              if not path.is_file():
                  return {"absent": True}
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  while block := source.read(65536):
                      digest.update(block)
              return {"bytes":path.stat().st_size,"sha256":digest.hexdigest()}
          paths = [root / "Cargo.toml", root / "Cargo.lock", root / "crates/aikit-adapters/Cargo.toml", root / "crates/aikit-adapters/src/runner.rs", root / "crates/aikit-adapters/tests/native_seat_guard.rs", pathlib.Path(os.environ["SEAT_GUARD_PRECOMMIT_CANDIDATE"]), pathlib.Path(os.environ["SEAT_GUARD_PREPUSH_CANDIDATE"])]
          producer = os.environ.get("SEAT_GUARD_GATE_PRODUCT_REPOSITORY")
          producer_root = pathlib.Path(producer) if producer else None
          producer_evidence = producer_root / "ProjectCentral/now/tmp/native-seat-guard-evidence" if producer_root else None
          if producer_root:
              paths.extend(producer_root / member for member in [".gitignore", "gates/run.mjs", "gates/manifest.json", "desktop/cradle/package-lock.json"])
          reading = {"schema":"central.seat-guard-hosted-qualification/v1", "scope":os.environ["GUARD_SCOPE"], "platform":platform.platform(), "full_outcome":os.environ["GUARD_FULL_OUTCOME"], "bounded_outcome":os.environ["GUARD_BOUNDED_OUTCOME"], "oi_initial_source":os.environ["SEAT_GUARD_GATE_PRODUCT_REVISION"], "source_files":{str(path):material(path) for path in paths}, "evidence":{str(path.relative_to(evidence)):material(path) for path in sorted(evidence.rglob("*")) if path.is_file()} if evidence.is_dir() else {"absent":True}, "standing":"actual controlled test evidence only; no protected install, private Original or human acceptance", "mac_main_positive":"unqualified", "fresh_receipt_required":"Linux actual producer in controlled clone; no transported predecessor"}
          reading["oi_paired_source"] = os.environ["SEAT_GUARD_GATE_PRODUCT_REVISION"]
          native_receipt = temp / "seat-guard-native-binaries.json"
          native_bindings = json.loads(native_receipt.read_text()) if native_receipt.is_file() else {}
          reading["actual_native_bindings"] = {name:{"path":value,**material(pathlib.Path(value))} for name,value in native_bindings.items()}
          reading["native_prerequisite_source"] = {"receipt":material(native_receipt),"central_revision":(temp / "seat-guard-native-central.revision").read_text().strip() if (temp / "seat-guard-native-central.revision").is_file() else None,"oi_build_helper":material(producer_root / "desktop/cradle/tests/wiki-native-binaries.py") if producer_root else {"unselected":True},"not_personal_installation":True}
          reading["evidence_roots"] = {"aikit_project":str(root), "oi_producer_project":str(producer_root) if producer_root else None}
          reading["producer_evidence_selected"] = producer_root is not None
          reading["producer_evidence"] = {str(path.relative_to(producer_evidence)):material(path) for path in sorted(producer_evidence.rglob("*")) if path.is_file()} if producer_evidence is not None and producer_evidence.is_dir() else {"absent":True}
          (temp / "seat-guard-hosted-basis.json").write_text(json.dumps(reading, indent=2) + "\n")
          PYBASIS
      - name: Retain full actual qualification outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-seat-guard-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/seat-guard-*.log
            ${{ runner.temp }}/seat-guard-case-inventory.json
            ${{ runner.temp }}/seat-guard-hosted-basis.json
            ${{ runner.temp }}/seat-guard-native-binaries.json
            ${{ runner.temp }}/seat-guard-native-central.revision
            ProjectCentral/now/tmp/native-seat-guard-evidence/
            ${{ runner.temp }}/seat-guard-oi/ProjectCentral/now/tmp/native-seat-guard-evidence/
          retention-days: 14
          if-no-files-found: error
