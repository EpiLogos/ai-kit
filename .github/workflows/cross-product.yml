      - name: Admit actual R4 lexical providers without embedding or model substitutes
        shell: bash
        run: |
          set -euo pipefail
          source "$NATIVE_COMPOSITION_EVIDENCE/record-command.sh"
          if ! command -v rg >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              record_command ripgrep-install sudo apt-get install -y ripgrep
            else
              record_command ripgrep-install brew install ripgrep
            fi
          fi
          record_command ripgrep-version rg --version
          rg_selected="$(command -v rg)"
          case "$rg_selected" in /*) ;; *) echo 'Selected rg must be an actual absolute executable' >&2; exit 1 ;; esac
          if [ "$RUNNER_OS" = Linux ]; then
            record_command ripgrep-package dpkg-query -S "$rg_selected"
            grep -Fx "ripgrep: $rg_selected" "$NATIVE_COMPOSITION_EVIDENCE/ripgrep-package.stdout"
            record_command ripgrep-package-version dpkg-query -W -f='${Package}\t${Version}\t${Status}\n' ripgrep
          else
            record_command ripgrep-package-root brew --prefix ripgrep
            record_command ripgrep-package-list brew list --verbose ripgrep
          fi
          printf 'R4_RG_BIN=%s\n' "$rg_selected" >> "$GITHUB_ENV"
          record_command bkmr-venv python3 -m venv "$RUNNER_TEMP/r4-bkmr"
          record_command bkmr-install "$RUNNER_TEMP/r4-bkmr/bin/pip" install --disable-pip-version-check --report "$NATIVE_COMPOSITION_EVIDENCE/bkmr-install-report.json" 'bkmr==7.6.7'
          record_command bkmr-version "$RUNNER_TEMP/r4-bkmr/bin/bkmr" --version
          grep -Fx 'bkmr 7.6.7' "$NATIVE_COMPOSITION_EVIDENCE/bkmr-version.stdout"
          printf '%s\n' "$RUNNER_TEMP/r4-bkmr/bin" >> "$GITHUB_PATH"
          printf 'CENTRAL_BKMR_BIN=%s\n' "$RUNNER_TEMP/r4-bkmr/bin/bkmr" >> "$GITHUB_ENV"
          command -v mkfifo
      - name: Exact native owner dependencies
        shell: bash
        run: |
          set -euo pipefail
          for owner in Central Actuation; do
            revision="$CENTRAL_SHA"
            if [ "$owner" = Actuation ]; then revision="$ACTUATION_SHA"; fi
            root="$RUNNER_TEMP/$owner"
            git init -q "$root"
            git -C "$root" remote add origin "https://github.com/EpiLogos/$owner.git"
            git -C "$root" fetch --depth=1 origin "$revision"
            git -C "$root" checkout --detach FETCH_HEAD
            test "$(git -C "$root" rev-parse HEAD)" = "$revision"
            test -z "$(git -C "$root" status --porcelain)"
            git -C "$root" archive --format=tar HEAD > "$NATIVE_COMPOSITION_EVIDENCE/source/$owner.tar"
            git -C "$root" ls-tree -r HEAD > "$NATIVE_COMPOSITION_EVIDENCE/source/$owner-tree-modes.txt"
            git -C "$root" rev-parse HEAD 'HEAD^{tree}' > "$NATIVE_COMPOSITION_EVIDENCE/source/$owner-head-tree.txt"
          done
          git archive --format=tar HEAD > "$NATIVE_COMPOSITION_EVIDENCE/source/AIKit.tar"
          git ls-tree -r HEAD > "$NATIVE_COMPOSITION_EVIDENCE/source/AIKit-tree-modes.txt"
          git rev-parse HEAD 'HEAD^{tree}' > "$NATIVE_COMPOSITION_EVIDENCE/source/AIKit-head-tree.txt"
          printf '%s\n' "$RUNNER_TEMP/Central/target/debug" "$RUNNER_TEMP/Actuation/target/release" >> "$GITHUB_PATH"
          printf 'AIKIT_CENTRAL_REAL_BIN=%s\nCENTRAL_CTRL_BIN=%s\n' "$RUNNER_TEMP/Central/target/debug/ctrl" "$RUNNER_TEMP/Central/target/debug/ctrl" >> "$GITHUB_ENV"
