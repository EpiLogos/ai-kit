            invalid_actual_model_bearing_refuses_context_and_projection_but_absence_remains_valid \
            explicitly_independent_project_without_actor_sources_remains_useful; do
            record_command "$case" "$image" --exact "$case" --ignored --nocapture --test-threads=1
          done
          python3 "$NATIVE_COMPOSITION_EVIDENCE/audit.py" results actor
      - name: Run existing exact project scope computations
        shell: bash
