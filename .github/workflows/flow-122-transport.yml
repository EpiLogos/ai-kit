name: Flow 122 transport

on:
  push:
    branches:
      - feat/flow-context-122

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/apply-flow-122-transport.py
      - name: Commit Flow transport contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[FLOW] Add structured contemplation transport return"
          git push origin HEAD:feat/flow-context-122
