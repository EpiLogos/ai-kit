name: Development Field S3 QL parity landing

on:
  push:
    branches:
      - agent/261-development-field-s3

permissions:
  contents: write

jobs:
  land-correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/261-development-field-s3
          fetch-depth: 0

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Apply accepted QL S6 carrier transport correction
        run: |
          python3 .github/dev-field-s3-ql-parity.py
          rustfmt --edition 2024 crates/aikit-core/src/resource/development_field.rs
          git diff --check

      - name: Verify corrected S3 surface before publishing
        run: |
          cargo test -p aikit-core development_field
          cargo test -p aikit-cli --test development_field

      - name: Publish clean product head
        run: |
          rm -f .github/dev-field-s3-ql-parity.py
          rm -f .github/workflows/dev-field-s3-ql-parity.yml
          rm -f .github/workflows/dev-field-s3-ql-parity-v2.yml
          git diff --check
          git config user.name Epii
          git config user.email EpiLogos@users.noreply.github.com
          git add -A
          git commit -m 'development-field: align accepted QL S6 carrier (#261)'
          git push origin HEAD:agent/261-development-field-s3
