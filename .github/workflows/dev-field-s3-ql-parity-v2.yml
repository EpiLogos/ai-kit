name: Development Field S3 QL parity patch v2

# Manual retrigger after verifying the accepted QL-MEF S6 structural carrier contract.
on:
  push:
    branches:
      - agent/261-development-field-s3

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/261-development-field-s3
          fetch-depth: 0

      - name: Compose live main basis
        run: |
          git fetch origin main
          git config user.name Epii
          git config user.email EpiLogos@users.noreply.github.com
          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicted="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n%s\n' \
              'crates/aikit-adapters/src/projectcentral.rs' \
              'crates/aikit-core/src/projectcentral.rs' | sort)"
            if [ "$conflicted" != "$expected" ]; then
              echo "Unexpected live-main merge conflicts:"
              printf '%s\n' "$conflicted"
              git status --short
              exit 1
            fi
            # #269 moved these owner seams out of the old ProjectCentral modules;
            # they are not part of S3, so preserve current main's deletion.
            git rm crates/aikit-adapters/src/projectcentral.rs crates/aikit-core/src/projectcentral.rs
            git commit --no-edit
          fi

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Apply QL S6 carrier parity
        run: |
          python3 .github/dev-field-s3-ql-parity.py
          rustfmt --edition 2024 crates/aikit-core/src/resource/development_field.rs

      - name: Verify repository-owned gate
        run: |
          cargo fmt --all -- --check
          bash scripts/verify
          git diff --check

      - name: Commit verified live-basis correction
        run: |
          rm -f .github/dev-field-s3-ql-parity.py
          rm -f .github/workflows/dev-field-s3-ql-parity.yml
          rm -f .github/workflows/dev-field-s3-ql-parity-v2.yml
          git diff --check
          git add -A
          git commit -m 'development-field: align QL S6 carrier parity (#261)'
          git push origin HEAD:agent/261-development-field-s3
