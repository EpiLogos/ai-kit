name: Integrate and verify prepared canvas context
on:
  push:
    branches: [agent/canvas-context-20260920]
    paths: ['.github/workflows/canvas-context-return.yml']
permissions:
  contents: write
jobs:
  return:
    if: github.ref == 'refs/heads/agent/canvas-context-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Apply bounded native integration
        shell: python
        run: |
          from pathlib import Path
          p=Path('crates/aikit-store/src/encounter.rs');s=p.read_text()
          assert 'pub mod context;' not in s
          s=s.replace('pub use delivery::{DeliveryReservation, EncounterDelivery};','pub use delivery::{DeliveryReservation, EncounterDelivery};\n#[path = "encounter_context.rs"]\npub mod context;')
          s=s.replace('        delivery::install(&connection)?;','        delivery::install(&connection)?;\n        context::install(&connection)?;')
          old='    pub fn submit(\n        &self,\n        session: &ResourceRef,\n        basis: u64,\n        dispatch: impl FnOnce(&str) -> Result<()>,\n    ) -> Result<EncounterDraft> {'
          assert old in s
          s=s.replace(old,'    pub fn submit(&self, session: &ResourceRef, basis: u64, dispatch: impl FnOnce(&str) -> Result<()>) -> Result<EncounterDraft> {\n        self.submit_context(session, basis, None, dispatch)\n    }\n    pub fn submit_context(\n        &self,\n        session: &ResourceRef,\n        basis: u64,\n        expectation: Option<&context::ContextExpectation>,\n        dispatch: impl FnOnce(&str) -> Result<()>,\n    ) -> Result<EncounterDraft> {')
          s=s.replace('        dispatch(&draft.text)?;','        let prepared=context::prepare_submission(&transaction,session,expectation)?;\n        let payload=context::compose(&draft.text,prepared.as_ref())?;\n        dispatch(&payload)?;')
          s=s.replace('"kind":"user-message","text":draft.text,"draft_revision":basis','"kind":"user-message","text":draft.text,"draft_revision":basis,"prepared_context":prepared,"payload_digest":format!("blake3:{}",blake3::hash(payload.as_bytes()).to_hex())')
          s=s.replace('            transaction.commit().map_err(failure)\n        })();','            context::clear_submitted(&transaction,prepared.as_ref())?;\n            transaction.commit().map_err(failure)\n        })();',1)
          s=s.replace('"draft":draft_in(&connection,session)?','"draft":draft_in(&connection,session)?,"prepared_context_receipts":context::receipts_in(&connection,session)?')
          p.write_text(s)
          p=Path('crates/aikit-cli/src/encounter_service.rs');s=p.read_text()
          s=s.replace('use aikit_store::{encounter::EncounterStore,','use aikit_store::encounter::context::{ContextRequest, ContextOperation, ContextExpectation, ContextScope};\nuse aikit_store::{encounter::EncounterStore,')
          s=s.replace('pub enum EncounterRequest {','pub enum EncounterRequest {\n    Context { request: ContextRequest },\n    PromptContext { agent_session: ResourceRef, draft_revision: u64, context: ContextExpectation },')
          old='        match request {\n';assert s.count(old)==1
          s=s.replace(old,'''        match request {
                      EncounterRequest::Context { request } => {
                          self.check_context_scope(&request.scope)?;
                          let data=match request.request {
                              ContextOperation::Read=>self.store.prepared_context(&request.scope)?,
                              ContextOperation::Edit{basis,mutation}=>self.store.edit_context(&request.scope,basis,*mutation)?,
                              ContextOperation::Adopt{basis,project_basis}=>self.store.adopt_context(&request.scope,basis,project_basis)?,
                          };
                          Ok(json!(data))
                      }
                      EncounterRequest::PromptContext { agent_session, draft_revision, context } => {
                          self.check_context_scope(&context.scope)?;
                          let resident=self.resident(&agent_session)?;
                          let _operation=resident.operations.lock().map_err(error)?;
                          let _agency_lock=self.lock_agency(&agent_session)?;
                          self.check_resident_context(&agent_session,&resident,"before-prompt")?;
                          let cleared=self.store.submit_context(&agent_session,draft_revision,Some(&context),|text|{
                              let text=self.prepare_agency_text(&agent_session,text)?;
                              let handle=resident.lane.prompt(resident.prompt_payload(&text))?;
                              drop(handle);Ok(())
                          })?;
                          Ok(json!({"accepted":true,"draft":cleared,"context_revision":context.revision,"context_digest":context.digest}))
                      }
          ''',1)
          s=s.replace('    fn check_context(\n','''    fn check_context_scope(&self, scope:&ContextScope)->Result<()> {
                  let project=ResourceRef::parse(&scope.project)?;
                  if let Some(session)=&scope.agent_session {
                      self.require_attached(session)?;
                      if !SessionSpaceApplicationStore::new(self.home.clone()).list()?.iter().any(|space|
                          space.definition.projects.contains(&project)&&space.agent_sessions.contains_key(session)) {
                          return Err(AikitError::new("encounter.context_scope","Session is not attached to the selected Project"));
                      }
                  }
                  Ok(())
              }
              fn check_context(
          ''')
          s=s.replace('{"ref":"aikit.encounter.draft","enabled":true,"reason":null},','{"ref":"aikit.encounter.draft","enabled":true,"reason":null},\n                    {"ref":"aikit.encounter.context","enabled":true,"reason":null},')
          p.write_text(s)
      - name: Commit only bounded Rust changes
        run: |
          rustfmt --edition 2021 --config skip_children=true crates/aikit-store/src/encounter_context.rs crates/aikit-store/tests/encounter_selected_context.rs
          git diff --check
          git add crates/aikit-store/src/encounter.rs crates/aikit-store/src/encounter_context.rs crates/aikit-store/tests/encounter_selected_context.rs crates/aikit-cli/src/encounter_service.rs
          git -c user.name='O:I canvas implementation' -c user.email='noreply@openai.com' commit -m 'feat(context): join prepared selections to native draft dispatch'
          git rev-parse HEAD | tee source-head.txt
          git push origin HEAD:refs/heads/agent/canvas-context-20260920
      - name: Exact selection and dispatch regressions
        run: set -o pipefail; cargo test --locked -p aikit-store --test encounter_selected_context 2>&1 | tee context-tests.log
      - name: Native CLI integration check
        run: set -o pipefail; cargo check --locked -p aikit-cli 2>&1 | tee context-cli.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-native-context-proof
          path: |
            source-head.txt
            context-tests.log
            context-cli.log
          retention-days: 7
