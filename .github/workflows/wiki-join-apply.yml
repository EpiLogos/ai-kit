name: Native Wiki source navigation integration
on:
  push:
    branches: [agent/wiki-source-constellation-20260920]
    paths: [.github/workflows/wiki-join-apply.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'EpiLogos/ai-kit' && github.ref == 'refs/heads/agent/wiki-source-constellation-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      - name: Verify and apply the bounded patch and returned defect repairs
        run: |
          mkdir -p /tmp/wiki-native-join
          python3 - <<'PY'
          import base64, zlib, hashlib, pathlib, subprocess
          encoded=pathlib.Path('.github/wiki-join.patch.z64').read_text().strip()
          for old,new in [('DEDlni4I2rd','DEDlni4rd'),('XzRPFyKuw','XzRPFyuw'),('3bzVJJtu','3bzVJtu'),('dnLinLinb','dnLinb')]:
              encoded=encoded.replace(old,new)
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='091c1875db7c2b5a32fc8073d5ce683f3f3dc5228ce1287075ccb83f453e6b5f'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          repairs = [
            ('crates/aikit-core/src/knowledge_navigation.rs',
             '        self.augment_project_map_relations(address.resource_ref(), &mut view)?;\n        Ok(view)',
             '        if depth > 0 { self.augment_project_map_relations(address.resource_ref(), &mut view)?; }\n        Ok(view)'),
            ('crates/aikit-adapters/src/wiki_document.rs',
             '.filter(|edge| edge.to == reading.resource)',
             '.filter(|edge| edge.to == reading.resource && edge.authored_relation.is_some())'),
          ]
          for path, old, new in repairs:
              p=pathlib.Path(path); text=p.read_text()
              assert text.count(old)==1, (path, 'source basis differs')
              p.write_text(text.replace(old,new))
          PY
      - name: Compile the actual native CLI
        run: |
          cargo fmt --all
          cargo check --locked -q -p aikit-cli
      - name: Verify application reader, graph, backlinks and native regressions
        env:
          WIKI_READER_FIXTURE: /tmp/wiki-native-join/reader-fixture.json
        run: |
          set -euo pipefail
          {
            cargo test --locked -q -p aikit-cli --test wiki_document_end_to_end -- --nocapture
            cargo test --locked -q -p aikit-cli --test knowledge_application_v2
            cargo test --locked -q -p aikit-adapters --lib wiki_document
            cargo test --locked -q -p aikit-adapters --lib wiki_media_tests
            cargo test --locked -q -p aikit-adapters --lib markdown_document
            cargo test --locked -q -p aikit-core --lib knowledge
          } 2>&1 | tee /tmp/wiki-native-join/tests.log
      - name: Commit verified production files on this branch only
        run: |
          test "$(git ls-remote origin refs/heads/agent/wiki-source-constellation-20260920 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/aikit-core/src/knowledge_navigation.rs crates/aikit-adapters/src/{central_file_map,lib,wiki_document,wiki_graph}.rs crates/aikit-cli/src/{app/knowledge.rs,cli.rs,main.rs} crates/aikit-cli/tests/wiki_document_end_to_end.rs
          git rm .github/wiki-join.patch.z64 .github/workflows/wiki-join-apply.yml
          git commit -m 'feat(wiki): join native source navigation, rich Markdown and metadata graph'
          git push origin HEAD:refs/heads/agent/wiki-source-constellation-20260920
      - name: Retain exact source and any failing work
        if: always()
        run: |
          mkdir -p /tmp/wiki-native-join
          git rev-parse HEAD > /tmp/wiki-native-join/revision.txt
          git diff > /tmp/wiki-native-join/uncommitted.diff
          tar -czf /tmp/wiki-native-join/source.tar.gz crates Cargo.toml Cargo.lock rust-toolchain.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiki-native-join-${{ github.run_id }}
          path: /tmp/wiki-native-join/
          retention-days: 7
