name: Publish BKMR 154 consumer checkpoint
on:
  push:
    branches: [agent/central-bkmr-154-consumer]
    paths: [.github/workflows/bkmr-154-publish.yml]
permissions:
  contents: write
concurrency:
  group: bkmr-154-consumer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/central-bkmr-154-consumer
      - name: Apply source checkpoint and remove transfer scaffolding
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = ''''''
          # Integrity guards prevent a transfer error from changing any source.
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '9c336e1312087179a3617bd19ea61bafbd58275dcc9d6ebc44af91a9f2404001'
          subprocess.run(['git', 'apply', '--index', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'rm', '.github/workflows/bkmr-154-publish.yml'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'Epii'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'noreply@github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat(bkmr): consume Central maps and revisioned skill source trees'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:agent/central-bkmr-154-consumer'], check=True)
