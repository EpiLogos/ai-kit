name: Native session documentation and verification
on:
  push:
    branches: [agent/native-session-controls-20260920]
    paths: [.github/workflows/native-session-doc-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/agent/native-session-controls-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install repository toolchain and checks
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Repair only the claimed documentation block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/aikit-adapters/src/agent_session_host.rs')
          s=p.read_text()
          needle='    /// Ask the real adapter, under the same identity/lane gate as writes. No'
          assert s.count(needle)==1, 'Expected exact native control documentation block'
          p.write_text(s.replace(needle,'    ///\n'+needle,1))
          PY
          rustfmt --edition 2021 crates/aikit-adapters/src/agent_session_host.rs
          git diff --check
          git rm .github/workflows/native-session-doc-verify.yml
          git add crates/aikit-adapters/src/agent_session_host.rs
          git -c user.name=Epii -c user.email=agent-session@users.noreply.github.com commit -m 'fix(encounter): separate native control documentation from preceding list'
          git push origin HEAD:refs/heads/agent/native-session-controls-20260920
          git rev-parse HEAD | tee /tmp/native-verified-head.txt
      - name: Full native lint
        id: lint
        continue-on-error: true
        run: cargo clippy --all-targets --locked -- -D warnings > /tmp/native-lint.log 2>&1
      - name: Adapter and host regressions
        id: adapters
        continue-on-error: true
        run: cargo test --locked -p aikit-adapters --test native_model_controls --test interactive_connection_v2 --test agent_session_host_v2 > /tmp/native-adapters.log 2>&1
      - name: Production handler regressions
        id: handlers
        continue-on-error: true
        run: cargo test --locked -p aikit-cli --test agent_session_protocol --test encounter_context_admission --test encounter_shutdown > /tmp/native-handlers.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-full-verification
          path: /tmp/native-*
          retention-days: 7
      - name: Preserve original failure status
        if: steps.lint.outcome != 'success' || steps.adapters.outcome != 'success' || steps.handlers.outcome != 'success'
        run: exit 1
