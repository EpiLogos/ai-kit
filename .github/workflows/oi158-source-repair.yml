name: OI158 source repair

on:
  push:
    branches:
      - feat/current-world-composition-readiness
    paths:
      - '.github/workflows/oi158-source-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/current-world-composition-readiness
          fetch-depth: 0
      - name: Repair inherited gateway test shadowing and remove repair carrier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/aikit-adapters/src/gateway_service.rs')
          text = path.read_text()
          before = '''        let gateway = gateway();
          persist_gateway_state(&gateway, Some(&state)).unwrap();
          let encoded = fs::read_to_string(&state).unwrap();
          assert!(!encoded.contains("pid"));
          assert!(!encoded.contains("socket"));
          assert!(!encoded.contains("workcell"));
          let restored = restore_gateway_state(gateway(), Some(&state)).unwrap();
          assert_eq!(restored.status(), gateway.status());'''
          after = '''        let initial_gateway = gateway();
          persist_gateway_state(&initial_gateway, Some(&state)).unwrap();
          let encoded = fs::read_to_string(&state).unwrap();
          assert!(!encoded.contains("pid"));
          assert!(!encoded.contains("socket"));
          assert!(!encoded.contains("workcell"));
          let restored = restore_gateway_state(gateway(), Some(&state)).unwrap();
          assert_eq!(restored.status(), initial_gateway.status());'''
          if text.count(before) != 1:
              raise SystemExit('expected exact inherited gateway test block once')
          path.write_text(text.replace(before, after))
          Path('.github/workflows/oi158-source-repair.yml').unlink()
          PY
      - name: Commit exact repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/aikit-adapters/src/gateway_service.rs .github/workflows/oi158-source-repair.yml
          git commit -m 'fix(gateway): remove semantic-state test shadowing'
          git push origin HEAD:feat/current-world-composition-readiness
