name: OI158 source repair

on:
  push:
    branches:
      - feat/current-world-composition-readiness
    paths:
      - '.github/workflows/oi158-source-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/current-world-composition-readiness
          fetch-depth: 0
      - name: Repair inherited gateway test shadowing and remove repair carrier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/aikit-adapters/src/gateway_service.rs')
          text = path.read_text()
          marker = '    fn semantic_state_round_trips_through_atomic_file_without_material_identity() {'
          start = text.index(marker)
          end = text.index('\n    #[test]', start + len(marker))
          block = text[start:end]
          replacements = [
              ('let gateway = gateway();', 'let initial_gateway = gateway();'),
              ('persist_gateway_state(&gateway, Some(&state))', 'persist_gateway_state(&initial_gateway, Some(&state))'),
              ('gateway.status());', 'initial_gateway.status());'),
          ]
          for before, after in replacements:
              if block.count(before) != 1:
                  raise SystemExit(f'expected exactly one {before!r} in semantic-state test')
              block = block.replace(before, after, 1)
          path.write_text(text[:start] + block + text[end:])
          Path('.github/workflows/oi158-source-repair.yml').unlink()
          PY
      - name: Commit exact repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/aikit-adapters/src/gateway_service.rs .github/workflows/oi158-source-repair.yml
          git commit -m 'fix(gateway): remove semantic-state test shadowing'
          git push origin HEAD:feat/current-world-composition-readiness
