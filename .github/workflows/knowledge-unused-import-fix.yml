name: Knowledge CLI import cleanup

on:
  push:
    branches:
      - agent/knowledge-navigation-production-closure

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/knowledge-navigation-production-closure
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/knowledge_unused_import_fix.py
      - run: |
          rm scripts/knowledge_unused_import_fix.py
          rm .github/workflows/knowledge-unused-import-fix.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(knowledge): remove unused CLI imports"
          git push origin HEAD:agent/knowledge-navigation-production-closure
      - run: |
          cargo check -p aikit-cli
          cargo test -p aikit-cli --test knowledge_application_v2 -- --test-threads=1
