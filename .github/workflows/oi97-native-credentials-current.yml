name: OI97 native credentials current-main convergence

on:
  push:
    branches:
      - converge/oi97-v2-native-credentials-current

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi97-v2-native-credentials-current
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Merge credential lineage into exact current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin main converge/oi97-v2-native-credentials
          git merge --no-commit --no-ff origin/converge/oi97-v2-native-credentials
          git checkout origin/main -- .github/workflows/native-skills.yml .github/workflows/provider-conformance.yml
          rm .github/workflows/oi97-native-credentials-current.yml
          cargo generate-lockfile
          cargo fmt --all
      - name: Prove current whole workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          bash scripts/verify
          git diff --check
      - name: Commit converged product state
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m '[OI97][V2] Converge native credential providers on current main'
          git push origin HEAD:converge/oi97-v2-native-credentials-current
