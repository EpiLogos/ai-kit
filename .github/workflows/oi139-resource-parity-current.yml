name: OI139 current-main SessionSpace Resource parity

on:
  push:
    branches:
      - 'reconstruct/oi139-resource-parity-current'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Install Rust 1.98 with fmt and Clippy
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Assert proof parent and accepted-main tree are identical
        run: |
          test "$(git rev-parse HEAD^)" = "4e459c3bd11485db8a39dbf288400b97e463d318"
          git fetch --depth 1 origin main
          test "$(git show -s --format=%T HEAD^)" = "be00c1b30c65154540399450d3c4d314e6ecd671"
          test "$(git show -s --format=%T origin/main)" = "be00c1b30c65154540399450d3c4d314e6ecd671"
          test "$(git rev-parse origin/main)" = "2e41f78e4bb0e2b52ec23ca798522dc0e1f2f6a6"

      - name: Apply only the guarded H7 semantic hunks
        run: python .github/oi139_apply_current.py

      - name: Format only the intended product result
        run: |
          cargo fmt --all
          allowed='^(crates/aikit-core/src/resource/model.rs|crates/aikit-tui/src/backend.rs|crates/aikit-tui/src/session_space_service.rs|crates/aikit-tui/src/application_service.rs|crates/aikit-cli/src/app/mod.rs)$'
          unexpected="$(git diff --name-only HEAD -- ':!.github/oi139_apply_current.py' ':!.github/workflows/oi139-resource-parity-current.yml' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected formatted paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Prove H7 against credential-bearing current product tree
        run: |
          cargo clippy -p aikit-core -p aikit-tui -p aikit-cli --all-targets -- -D warnings
          cargo test -p aikit-core -p aikit-tui -p aikit-cli
          git diff --check

      - name: Collapse proof branch to helper-free five-file product commit
        run: |
          allowed='^(crates/aikit-core/src/resource/model.rs|crates/aikit-tui/src/backend.rs|crates/aikit-tui/src/session_space_service.rs|crates/aikit-tui/src/application_service.rs|crates/aikit-cli/src/app/mod.rs)$'
          product_paths="$(git diff --name-only HEAD | grep -E "$allowed" | sort -u)"
          expected="$(printf '%s\n' \
            crates/aikit-cli/src/app/mod.rs \
            crates/aikit-core/src/resource/model.rs \
            crates/aikit-tui/src/application_service.rs \
            crates/aikit-tui/src/backend.rs \
            crates/aikit-tui/src/session_space_service.rs | sort)"
          test "$product_paths" = "$expected"
          rm .github/oi139_apply_current.py .github/workflows/oi139-resource-parity-current.yml
          git add -A
          git config user.name Epii
          git config user.email frank.g.taylor97@gmail.com
          git commit -m '[OI139] Project SessionSpace into common Resource/Action field [oi139-current]'
          git push origin HEAD:reconstruct/oi139-resource-parity-current
