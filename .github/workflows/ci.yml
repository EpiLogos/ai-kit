name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: Real integration suite
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install tmux
        run: brew install tmux
      - name: Verify repository
        shell: bash
        run: |
          set +e
          bash scripts/verify 2>&1 | tee /tmp/aikit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^error(\[|:)|^warning:|^failures:|^test result:|^thread .*panicked|^  left:|^ right:|^note:|^help:|^  -->|^   -->)' /tmp/aikit.log | tail -n 100 > /tmp/aikit-focus.log || true
            message=$(cat /tmp/aikit-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=Repository verification failure::$message"
          fi
          exit "$status"
      - name: Retain native verification failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-verification-failure-${{ github.sha }}
          path: |
            /tmp/aikit.log
            /tmp/aikit-focus.log
          if-no-files-found: warn
          retention-days: 7

  v2-crate-tests:
    name: V2 crate — ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [aikit-core, aikit-store, aikit-adapters, aikit-tui, aikit-cli]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.8
        with:
          tool: cargo-nextest
      - name: Test ${{ matrix.package }}
        shell: bash
        run: |
          set +e
          cargo nextest run --locked -p '${{ matrix.package }}' --all-targets 2>&1 | tee /tmp/aikit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^error(\[|:)|^warning:|^failures:|^test result:|^thread .*panicked|^  left:|^ right:|^note:|^help:|^  -->|^   -->)' /tmp/aikit.log | tail -n 100 > /tmp/aikit-focus.log || true
            message=$(cat /tmp/aikit-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=${{ matrix.package }} test failure::$message"
          fi
          exit "$status"

  v2-static:
    name: V2 static/dead-code gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98 with clippy
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Clippy all targets
        shell: bash
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/aikit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^error(\[|:)|^warning:|^note:|^help:|^  -->|^   -->)' /tmp/aikit.log | tail -n 120 > /tmp/aikit-focus.log || true
            message=$(cat /tmp/aikit-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=Clippy failure::$message"
          fi
          exit "$status"
      - name: Diff hygiene
        run: git diff --check

  bkmr-real:
    name: Real bkmr 7.6.7 SourcePool conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install 'bkmr==7.6.7'
      - run: bkmr --version
      - name: Run real SourcePool conformance
        env:
          AIKIT_REQUIRE_BKMR_REAL: "1"
        run: cargo test --locked -p aikit-adapters --test bkmr_real -- --nocapture --test-threads=1

  gitnexus-real:
    name: Real GitNexus 1.6.9 ProjectMap conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
      - run: npm install --global 'gitnexus@1.6.9'
      - run: gitnexus --version
      - name: Run real ProjectMap code-index conformance
        shell: bash
        env:
          AIKIT_REQUIRE_GITNEXUS_REAL: "1"
        run: |
          set +e
          cargo test --locked -p aikit-adapters --test gitnexus_real -- --nocapture --test-threads=1 2>&1 | tee /tmp/aikit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^error(\[|:)|^failures:|^test result:|^thread .*panicked|^  left:|^ right:|^note:|^help:)' /tmp/aikit.log | tail -n 100 > /tmp/aikit-focus.log || true
            message=$(cat /tmp/aikit-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=GitNexus conformance failure::$message"
          fi
          exit "$status"

  factory-developmental-real:
    name: Real Factory developmental consumer conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Checkout exact Factory owner revision
        uses: actions/checkout@v7.0.1
        with:
          repository: EpiLogos/agent-system-design
          ref: 12a721dbbb51e3c70d52ef00220efa859ef930fd
          path: factory-owner
      - name: Build native Factory CLI
        working-directory: factory-owner
        run: cargo build --locked -p epilogos-factory --bin factory
      - name: Consume owner-generated state through the real Factory CLI
        env:
          AIKIT_FACTORY_REAL_BIN: ${{ github.workspace }}/factory-owner/target/debug/factory
          AIKIT_FACTORY_COMMISSION_REQUEST: ${{ github.workspace }}/factory-owner/contracts/factory/fixtures/oi-self-hosting-commission-request.json
          AIKIT_FACTORY_TEST_STATE_OUT: ${{ runner.temp }}/factory-developmental-state.json
          AIKIT_FACTORY_TEST_MANIFEST_OUT: ${{ runner.temp }}/factory-developmental-manifest.json
        run: |
          cargo test --locked -p aikit-adapters --test factory_developmental_native -- --ignored --nocapture
          cargo test --locked -p aikit-cli --test factory_start_work_native -- --ignored --nocapture
          cargo test --locked -p aikit-cli --test factory_work_tui_native -- --ignored --nocapture
          project_ref=$(python3 -c 'import json; print(json.load(open("${{ runner.temp }}/factory-developmental-manifest.json"))["projectRef"])')
          echo "AIKIT_FACTORY_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"
      - name: Resolve the Factory WorkflowUnit through AIKit's real structured CLI
        env:
          AIKIT_HOME: ${{ runner.temp }}/aikit-home
          AIKIT_FACTORY_BIN: ${{ github.workspace }}/factory-owner/target/debug/factory
          AIKIT_FACTORY_STATE: ${{ runner.temp }}/factory-developmental-state.json
        run: |
          mkdir -p ${{ runner.temp }}/aikit-project/.aikit
          cargo run --locked -p aikit-cli --bin aikit -- --json -C ${{ runner.temp }}/aikit-project search implement > ${{ runner.temp }}/aikit-factory-search.json
          grep -q '"resource_kind":"workflow-unit"' ${{ runner.temp }}/aikit-factory-search.json

  deepseek-cordis-real:
    name: Real DeepSeek Cordis SessionSpace activation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
          path: deepseek-harness
      - name: Install pinned DeepSeek Harness workspace
        working-directory: deepseek-harness
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Prove current upstream Web/Cordis launch seam
        working-directory: deepseek-harness
        shell: bash
        run: |
          set -euo pipefail
          report_failure() {
            tail -n 100 /tmp/deepseek-cordis.log > /tmp/deepseek-cordis-focus.log || true
            message=$(cat /tmp/deepseek-cordis-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=Upstream DeepSeek Web/Cordis launch failure::$message"
          }
          node --import tsx apps/cli/src/bin.ts web > /tmp/deepseek-cordis.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 100); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'DeepSeek Web/Cordis process exited before readiness:'
              cat /tmp/deepseek-cordis.log
              report_failure
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/3080) 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'DeepSeek Web/Cordis process did not expose 127.0.0.1:3080:'
            cat /tmp/deepseek-cordis.log
            report_failure
            exit 1
          fi
          echo 'DeepSeek Web/Cordis endpoint is live at 127.0.0.1:3080'
          cleanup
          trap - EXIT
      - name: Run real Cordis activation through SessionSpace
        shell: bash
        env:
          AIKIT_REQUIRE_DEEPSEEK_CORDIS_REAL: "1"
          AIKIT_DEEPSEEK_HARNESS_CHECKOUT: ${{ github.workspace }}/deepseek-harness
        run: |
          set +e
          cargo test --locked -p aikit-adapters --test deepseek_cordis_real -- --nocapture --test-threads=1 2>&1 | tee /tmp/aikit-cordis.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^error(\[|:)|^failures:|^test result:|^thread .*panicked|^  left:|^ right:|^note:|^help:|session_space|cordis\.process|Cordis provider)' /tmp/aikit-cordis.log | tail -n 120 > /tmp/aikit-cordis-focus.log || true
            message=$(cat /tmp/aikit-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=Real DeepSeek Cordis SessionSpace failure::$message"
          fi
          exit "$status"
