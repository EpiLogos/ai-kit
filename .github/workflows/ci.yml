  v2-crate-tests:
    permissions:
      contents: read
      actions: read
    name: V2 crate — ${{ matrix.package }}${{ matrix.os == 'windows-latest' && ' (Windows)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.package == 'aikit-cli' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        package: [aikit-core, aikit-store, aikit-adapters, aikit-tui, aikit-cli]
        include:
          - os: windows-latest
            package: aikit-core
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.8
        with:
          tool: cargo-nextest
      - name: Ensure real ripgrep for Project-scope acceptance
        if: runner.os != 'Windows'
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ripgrep
          fi
          rg --version
      - name: Test ${{ matrix.package }}
        id: script_default
        shell: bash
        run: |
          set +e
          AIKIT_REQUIRE_RIPGREP_REAL=1 cargo nextest run --locked -p '${{ matrix.package }}' --all-targets 2>&1 | tee /tmp/aikit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^error(\[|:)|^warning:|^failures:|^test result:|^thread .*panicked|^  left:|^ right:|^note:|^help:|^  -->|^   -->)' /tmp/aikit.log | tail -n 100 > /tmp/aikit-focus.log || true
            message=$(cat /tmp/aikit-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=${{ matrix.package }} test failure::$message"
          fi
          exit "$status"

      - uses: actions/setup-node@v6
        if: matrix.package == 'aikit-cli'
        with:
          node-version: "24"
      - name: Install evidenced native Pi SDK
        if: matrix.package == 'aikit-cli'
        run: npm install --global '@earendil-works/pi-coding-agent@0.84.4'
      - name: Prove native package tool export, discovery and invocation
        if: matrix.package == 'aikit-cli'
        run: |
          export AIKIT_PI_SDK_ROOT="$(npm root -g)/@earendil-works/pi-coding-agent"
          cargo test --locked -p aikit-cli native_package_tools_tests -- --ignored --nocapture --test-threads=1

      - name: Ensure native metadata Python for Core qualification
        if: matrix.package == 'aikit-core'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Qualify actual Core material ownership and adverse cleanup
        if: matrix.package == 'aikit-core'
        shell: bash
        run: |
          set -euo pipefail
          unset AIKIT_CORE_TEST_ROOT
          mkdir -p ProjectCentral/now/tmp
          gate_dir="ProjectCentral/now/tmp/core-material-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_OS}"
          mkdir "$gate_dir"
          git rev-parse HEAD > "$gate_dir/source-head.txt"
          git archive --format=tar HEAD > "$gate_dir/source.tar"
