name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Real integration suite
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup default 1.88.0

      - name: Install tmux
        run: brew install tmux

      - name: Test every target
        run: cargo test --locked --workspace --all-targets --no-fail-fast -- --test-threads=1

      - name: Deny compiler warnings
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build the release profile
        run: cargo build --locked --workspace --release

      - name: Check patch whitespace
        run: git diff --check
