          path: ProjectCentral/now/tmp/core-material-*
          if-no-files-found: error
          retention-days: 14

  bkmr-real:
    name: Real bkmr 7.6.7 SourcePool conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install 'bkmr==7.6.7'
      - run: bkmr --version
      - name: Run real SourcePool conformance
        env:
          AIKIT_REQUIRE_BKMR_REAL: "1"
        run: cargo test --locked -p aikit-adapters --test bkmr_real -- --nocapture --test-threads=1

  gitnexus-real:
    name: Real GitNexus 1.6.9 ProjectMap conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> target
            .gitnexus-native/Central -> target
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
      - name: Install pinned GitNexus
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --global 'gitnexus@1.6.9'; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "GitNexus install failed after three attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - run: gitnexus --version
      # The Project-scope step reads Central's World (central.world,
      # effective-sources, file-map) through the real ctrl. Without it every
      # Project fails for "ctrl not found" before GitNexus is ever asked, and
      # the scope assertion reads that noise instead of the real outcome.
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: 7a3f38c032e008b4c5c28c930f741b34d2d5b79d
          path: .gitnexus-native/Central
          persist-credentials: false
      - name: Build the Central owner (ctrl) the Project scope reads
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path .gitnexus-native/Central/Cargo.toml -p ctrl --bin ctrl
          echo "$GITHUB_WORKSPACE/.gitnexus-native/Central/target/debug" >> "$GITHUB_PATH"
          echo "CENTRAL_CTRL_BIN=$GITHUB_WORKSPACE/.gitnexus-native/Central/target/debug/ctrl" >> "$GITHUB_ENV"
      - name: Ensure real ripgrep for WorkRepos conformance
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ripgrep
          fi
          rg --version
      - name: Run real ProjectMap code-index conformance
        shell: bash
        env:
          AIKIT_REQUIRE_GITNEXUS_REAL: "1"
        run: |
          set +e
          cargo test --locked -p aikit-adapters --test gitnexus_real -- --nocapture --test-threads=1 2>&1 | tee /tmp/aikit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^error(\[|:)|^failures:|^test result:|^thread .*panicked|^  left:|^ right:|^note:|^help:)' /tmp/aikit.log | tail -n 100 > /tmp/aikit-focus.log || true
            message=$(cat /tmp/aikit-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=GitNexus conformance failure::$message"
          fi
          exit "$status"
      - name: Enforce Project scope with real GitNexus and WorkRepos
        env:
          AIKIT_REQUIRE_GITNEXUS_REAL: "1"
        run: cargo test --locked -p aikit-cli --test knowledge_project_code_scope_real -- --nocapture --test-threads=1
      - name: Enforce Project NOW scope with real ripgrep
        env:
          AIKIT_REQUIRE_RIPGREP_REAL: "1"
        run: cargo test --locked -p aikit-adapters --test now_field_real -- --nocapture --test-threads=1
