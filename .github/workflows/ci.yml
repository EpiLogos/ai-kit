name: CI

# The one pull-request gate for AIKit. `Real integration suite` is the
# branch-required check and runs the repository-owned scripts/verify (full
# workspace tests, clippy, diff hygiene) on macOS; the Linux crate matrix is
# the same suite on the other target. Real-tool conformance (bkmr, GitNexus)
# stays here because it installs a pinned tool, not another repository.
# Anything that checks out another repository runs weekly in cross-product.yml.

on:
  push:
    branches: [main, repair/65-native-pi-model-controls]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    permissions:
      contents: read
      actions: read
    name: Real integration suite
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install tmux
        run: brew install tmux
      - name: Ensure real ripgrep for Project-scope acceptance
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Validate installed Prime-QL acceptance runner
        run: python3 -m py_compile scripts/verify-epi-prime-ql.py
      - name: Verify repository
        id: script_default
        shell: bash
        env:
          AIKIT_REQUIRE_RIPGREP_REAL: "1"
        run: |
          set +e
          bash scripts/verify 2>&1 | tee /tmp/aikit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^error(\[|:)|^warning:|^failures:|^test result:|^thread .*panicked|^  left:|^ right:|^note:|^help:|^  -->|^   -->)' /tmp/aikit.log | tail -n 100 > /tmp/aikit-focus.log || true
            message=$(cat /tmp/aikit-focus.log)
            message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error title=Repository verification failure::$message"
          fi
          exit "$status"

      - name: Qualify actual Core material ownership and adverse cleanup
        shell: bash
        run: |
          set -euo pipefail
          unset AIKIT_CORE_TEST_ROOT
          mkdir -p ProjectCentral/now/tmp
          gate_dir="ProjectCentral/now/tmp/core-material-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_OS}"
          mkdir "$gate_dir"
          git rev-parse HEAD > "$gate_dir/source-head.txt"
          git archive --format=tar HEAD > "$gate_dir/source.tar"
          rustc -Vv > "$gate_dir/rustc.txt"
          cargo test --locked -p aikit-core --lib --no-run --message-format=json > "$gate_dir/build.jsonl" 2> "$gate_dir/build.stderr.log"
          cat "$gate_dir/build.stderr.log"
          cargo test --locked -p aikit-core --lib error::tests:: -- --list > "$gate_dir/list.log" 2> "$gate_dir/list.stderr.log"
          cat "$gate_dir/list.log" "$gate_dir/list.stderr.log"
          python3 - "$gate_dir" <<'PYCORE'
          from pathlib import Path
          import hashlib,json,os,platform,sys
          p=Path(sys.argv[1]); sha=lambda q:hashlib.sha256(q.read_bytes()).hexdigest()
          original=['actual_missing_file_cause_survives_clone_details_and_domain_display','actual_primary_and_secondary_io_objects_survive_wrap_and_clone','native_wrap_and_clone_keep_identical_actual_filesystem_cause','domain_equality_does_not_erase_distinct_actual_filesystem_causes']
          common=['actual_directory_form_and_reparse_refusal_retains_targets','actual_unexpected_child_refuses_empty_cleanup_and_retains_bytes']
          platform_cases=['actual_windows_held_fixture_refuses_delete_and_rename_until_legal_close'] if os.name=='nt' else ['actual_unix_fixture_replacement_refuses_cleanup_and_retains_both_objects','actual_unix_ancestor_replacement_refuses_cleanup_and_retains_both_branches']
          expected=sorted('error::tests::'+x for x in original+common+platform_cases)
          actual=sorted(x.removesuffix(': test') for x in (p/'list.log').read_text().splitlines() if x.startswith('error::tests::') and x.endswith(': test'))
          if actual!=expected:raise SystemExit(f'Actual compiled Core roster mismatch: {actual!r} versus {expected!r}')
          artifacts=[json.loads(x) for x in (p/'build.jsonl').read_text().splitlines() if x.startswith('{')]
          exe=[Path(x['executable']) for x in artifacts if x.get('reason')=='compiler-artifact' and x.get('target',{}).get('name')=='aikit_core' and x.get('profile',{}).get('test') and x.get('executable')]
          if len(exe)!=1 or not exe[0].is_file():raise SystemExit('Exactly one actual same-source native Core test executable is required')
          (p/'expected.txt').write_text('\n'.join(expected)+'\n', encoding='utf-8', newline='\n');(p/'original.txt').write_text('\n'.join('error::tests::'+x for x in original)+'\n', encoding='utf-8', newline='\n')
          product=Path.cwd().resolve();explicit=p/'explicit-root';explicit.mkdir()
          alias=p/'native-root-link';os.symlink(explicit.resolve(),alias,target_is_directory=True)
          def coordinate(path):
              raw=str(path)
              if os.name=='nt' and not raw.startswith('\\\\?\\'):
                  raw=('\\\\?\\UNC\\'+raw[2:]) if raw.startswith('\\\\') else ('\\\\?\\'+raw)
              return raw
          (p/'explicit-root.txt').write_text(coordinate(explicit.resolve())+'\n', encoding='utf-8', newline='\n')
          noncanonical=str(product/explicit/'..'/'explicit-root')
          if os.name=='nt':
              if noncanonical.startswith('\\\\?\\UNC\\'):noncanonical='\\\\'+noncanonical[8:]
              elif noncanonical.startswith('\\\\?\\'):noncanonical=noncanonical[4:]
          candidate=Path(noncanonical);absolute=candidate.is_absolute();exists=candidate.exists()
          resolved=candidate.resolve(strict=True);fixture=explicit.resolve(strict=True)
          if not absolute or not exists or resolved!=fixture or '..' not in candidate.parts:
              raise SystemExit('Noncanonical control must be a legal existing absolute route to the same owned fixture')
          (p/'noncanonical-coordinate-prerequisite.json').write_text(json.dumps({'candidate':noncanonical,'is_absolute':absolute,'exists':exists,'actual_resolved':str(resolved),'same_owned_explicit_fixture':str(fixture),'native_supplied_parent_component_retained':'..' in candidate.parts},indent=2)+'\n', encoding='utf-8', newline='\n')
          negative=[('relative','relative-core-root'),('missing',coordinate(product/p/'missing-root')),('outside',coordinate(product)),('symlink',coordinate(product/alias)),('noncanonical',noncanonical)]
          (p/'negative.tsv').write_text(''.join(name+'\t'+root+'\n' for name,root in negative), encoding='utf-8', newline='\n')
          reasons={'relative':'explicit Core test root must be absolute','missing':'explicit Core test root must already exist','outside':'explicit Core test root must remain in this product Run space','symlink':'explicit Core test root must be physical','noncanonical':'explicit Core test root must be physical'}
          (p/'negative-reasons.json').write_text(json.dumps(reasons,indent=2)+'\n')
          files=['crates/aikit-core/src/error.rs','crates/aikit-core/src/lib.rs','crates/aikit-core/Cargo.toml','Cargo.lock','.github/workflows/ci.yml']
          (p/'source-binary-os.json').write_text(json.dumps({'source_head':(p/'source-head.txt').read_text().strip(),'source_archive_sha256':sha(p/'source.tar'),'source_files':{x:sha(Path(x)) for x in files},'native_executable':str(exe[0]),'native_binary_sha256':sha(exe[0]),'platform':platform.platform(),'python':sys.version,'uid':os.getuid() if hasattr(os,'getuid') else None,'compiled_roster':actual,'required_execution_count':len(expected),'explicit_root':coordinate(explicit.resolve()),'scope':'Actual public Source checkout product scratch; not a fabricated allocated native ProjectRun/World. Windows symlink privilege is required, not skipped.'},indent=2)+'\n')
          PYCORE
          run_case() {
            label="$1"; shift
            set +e
            "$@" > "$gate_dir/$label.log" 2>&1
            status=$?
            set -e
            cat "$gate_dir/$label.log"
            printf '%s\n' "$status" > "$gate_dir/$label.exit"
            return "$status"
          }
          while IFS= read -r case; do
            label="default-${case##*::}"
            run_case "$label" cargo test --locked -p aikit-core --lib "$case" -- --exact --nocapture --test-threads=1
           done < "$gate_dir/expected.txt"
          explicit_root=$(cat "$gate_dir/explicit-root.txt")
          while IFS= read -r case; do
            label="explicit-${case##*::}"
            run_case "$label" env AIKIT_CORE_TEST_ROOT="$explicit_root" cargo test --locked -p aikit-core --lib "$case" -- --exact --nocapture --test-threads=1
           done < "$gate_dir/original.txt"
          while IFS=$'\t' read -r label coordinate; do
            if run_case "refused-$label" env AIKIT_CORE_TEST_ROOT="$coordinate" cargo test --locked -p aikit-core --lib error::tests::actual_missing_file_cause_survives_clone_details_and_domain_display -- --exact --nocapture --test-threads=1; then
              echo "Invalid explicit Core root unexpectedly admitted: $label" >&2
              exit 1
            fi
           done < "$gate_dir/negative.tsv"
          python3 - "$gate_dir" <<'PYCORE'
          from pathlib import Path
          import hashlib,json,re,sys
          p=Path(sys.argv[1]);out=[]
          for path in sorted(p.glob('*.exit')):
              status=int(path.read_text());text=path.with_suffix('.log').read_text();matches=re.findall(r'test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;',text)
              if len(matches)!=1:raise SystemExit(f'Missing/nonunique actual native result: {path}')
              label=path.stem;expected=('FAILED','0','1','0','0') if label.startswith('refused-') else ('ok','1','0','0','0')
              if matches[0]!=expected or (status==0)==label.startswith('refused-'):raise SystemExit(f'Actual result mismatch: {label} {status} {matches}')
              if label.startswith('refused-'):
                  reason=json.loads((p/'negative-reasons.json').read_text())[label.removeprefix('refused-')]
                  if reason not in text:raise SystemExit(f'Wrong native admission failure at {label}: expected actual frozen guard assertion {reason!r}')
              out.append({'case':label,'actual_exit':status,'actual_native_result':matches[0],'log_sha256':hashlib.sha256(path.with_suffix('.log').read_bytes()).hexdigest(),'scope':'negative admission failure' if label.startswith('refused-') else 'actual native passing definition'})
          expected=(len((p/'expected.txt').read_text().splitlines())+4+5)
          if len(out)!=expected:raise SystemExit(f'Actual execution count {len(out)} != {expected}')
          meta=json.loads((p/'source-binary-os.json').read_text());exe=Path(meta['native_executable'])
          if hashlib.sha256(exe.read_bytes()).hexdigest()!=meta['native_binary_sha256']:raise SystemExit('Native test executable changed during qualification')
          if (p/'missing-root').exists():raise SystemExit('Refused missing root acquired material')
          (p/'native-results.json').write_text(json.dumps({'actual_dispatch_count':len(out),'unique_compiled_definitions':len(meta['compiled_roster']),'actual_results':out,'negative_admission_failures_are_not_IO_body_passes':True,'binary_hash_stable':True},indent=2)+'\n')
          (p/'native-root-link').unlink() if sys.platform!='win32' else __import__('os').rmdir(p/'native-root-link')
          (p/'explicit-root').rmdir()
          PYCORE
      - name: Retain actual Core source, binary, roster and native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-native-material-${{ runner.os }}-${{ github.sha }}
          path: ProjectCentral/now/tmp/core-material-*
          if-no-files-found: error
          retention-days: 14

      - name: Preserve actual launcher source and existing owner result
        if: always() && (runner.os == 'macOS')
        shell: bash
        env:
          DEFAULT_OUTCOME: ${{ steps.script_default.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PYADMIT'
          from pathlib import Path
          import json,os,platform,shutil,stat,sys
          product=Path.cwd().resolve();scratch=product/'ProjectCentral/now/tmp'
          for q in [product/'ProjectCentral',product/'ProjectCentral/now',scratch]:
              try:m=q.lstat()
              except FileNotFoundError:
                  q.mkdir(mode=0o700);m=q.lstat()
              if not stat.S_ISDIR(m.st_mode) or q.resolve()!=q:raise SystemExit('Hosted public native scratch must be physical')
          root=scratch/('script-capture-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+'-'+os.environ['RUNNER_OS'])
          root.mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write('AIKIT_SCRIPT_CHARACTERIZATION_ROOT='+str(root)+'\n')
          (root/'default-result.json').write_text(json.dumps({'actual_outcome':os.environ['DEFAULT_OUTCOME'],'platform':platform.platform(),'uid':os.getuid(),'python':sys.version,'scope':'Existing owner step outcome; not inferred from launcher count. Scratch is public fixture/evidence material, not semantic World identity.'},indent=2)+'\n')
          log=Path('/tmp/aikit.log')
          if log.exists():
              if not stat.S_ISREG(log.lstat().st_mode):raise SystemExit('Actual existing default log is not an ordinary file')
              with log.open('rb') as src,(root/'existing-default.log').open('xb') as dst:shutil.copyfileobj(src,dst)
          print(root)
          PYADMIT
          gate_dir="$GITHUB_WORKSPACE/ProjectCentral/now/tmp/script-capture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_OS}"
          git rev-parse HEAD > "$gate_dir/current-head.txt"
          git rev-parse HEAD^{tree} > "$gate_dir/current-tree.txt"
          git archive --format=tar HEAD > "$gate_dir/current-source.tar"
          rustc -Vv > "$gate_dir/rustc.txt"
          cargo -Vv > "$gate_dir/cargo.txt"
      - name: Qualify actual old and current native captured-script owners
        if: success() && (runner.os == 'macOS')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old_head=b07ced38f17319305ebbee06502df8ad96f3b0eb
          gate_dir="$AIKIT_SCRIPT_CHARACTERIZATION_ROOT"
          trap 'status=$?; printf "%s\n" "$status" > "$gate_dir/qualification-shell.exit"' EXIT
          if ! git cat-file -e "$old_head^{commit}"; then
            git fetch --no-tags --depth=1 origin "$old_head" > "$gate_dir/old-fetch.stdout" 2> "$gate_dir/old-fetch.stderr"
          fi
          git rev-parse "$old_head^{tree}" > "$gate_dir/old-tree.txt"
          git archive --format=tar "$old_head" > "$gate_dir/old-source.tar"
          python3 - "$gate_dir" <<'PYINPUT'
          from pathlib import Path
          import hashlib,json,os,stat,sys,tarfile
          p=Path(sys.argv[1]); product=Path.cwd().resolve()
          if sys.version_info<(3,12):raise SystemExit('Native Python3.12 tar admission prerequisite unavailable; this is not an expected old semantic failure')
          if p.resolve()!=p or not p.is_dir():raise SystemExit('Admitted gate coordinate changed')
          asset=product/'scripts/fixtures/captured-script-old-api-characterization.rs'
          sha=lambda q:hashlib.sha256(q.read_bytes()).hexdigest()
          watch=[];links=[]
          def regular(q):
              m=q.lstat()
              if not stat.S_ISREG(m.st_mode) or m.st_nlink!=1:raise SystemExit(f'Nonordinary public input: {q}')
              watch.append({'path':str(q),'sha256':sha(q),'dev':m.st_dev,'ino':m.st_ino})
          def source_archive(label,archive):
              root=p/(label+'-source');root.mkdir(mode=0o700)
              with tarfile.open(archive,'r:') as tar:
                  names=tar.getnames()
                  if any(Path(n).is_absolute() or '..' in Path(n).parts for n in names):raise SystemExit('Invalid Source archive member')
                  tar.extractall(root,filter='data')
                  for member in tar.getmembers():
                      q=root/member.name
                      if member.isfile():regular(q)
                      elif member.issym():links.append({'path':str(q),'target':os.readlink(q)})
                      elif not member.isdir():raise SystemExit('Unsupported public Source archive form')
              target=root/'crates/aikit-cli/tests/captured_script_old_api_characterization.rs'
              with target.open('xb') as output:output.write(asset.read_bytes())
              regular(target)
              regular(archive)
              (p/(label+'-augmentation.json')).write_text(json.dumps({'source_archive':str(archive),'source_archive_sha256':sha(archive),'source_root':str(root),'pristine_archive_retained':True,'additional_test_path':str(target),'input_sha256':sha(asset),'input_scope':'Derived actual IO/lifecycle observations and retained-fixture control are new test-only inputs; original ce55 is separately retained/invertible. No production overlay.','inner_refusal_observation_contract':'expected_command_failure_original_and_structured_cleanup/v2','retained_fixture_contract':'retained_before_effect_and_on_unwind/v2'},indent=2)+'\n')
              return root
          old=source_archive('old',p/'old-source.tar');new=source_archive('new',p/'current-source.tar')
          # Current native targets are built from the actual checkout, not this augmentation.
          with tarfile.open(p/'current-source.tar','r:') as tar:
              for member in tar.getmembers():
                  q=product/member.name
                  if member.isfile():regular(q)
                  elif member.issym():links.append({'path':str(q),'target':os.readlink(q)})
          regular(asset)
          for q in [p/'current-head.txt',p/'current-tree.txt',p/'old-tree.txt',p/'rustc.txt',p/'cargo.txt',p/'default-result.json']:
              regular(q)
          (p/'source-watch.json').write_text(json.dumps({'files':watch,'symlinks':links,'checkout_root':str(product),'old_root':str(old),'new_root':str(new),'current_head':(p/'current-head.txt').read_text().strip(),'old_head':'b07ced38f17319305ebbee06502df8ad96f3b0eb','overlay_sha256':sha(asset),'old_lock_sha256':sha(old/'Cargo.lock'),'new_lock_sha256':sha(new/'Cargo.lock')},indent=2)+'\n')
          PYINPUT
          old_root="$gate_dir/old-source"
          new_root="$gate_dir/new-source"
          # Native owners share the ordinary build cache, sequentially. Each augmentation
          # binary is retained before a later build can replace a Cargo target address.
          current_root=$(python3 -c 'from pathlib import Path; print(Path.cwd().resolve())')
          export CARGO_TARGET_DIR="$current_root/target"
          run_compile() {
            label="$1"; shift
            set +e
            "$@" > "$gate_dir/$label.build.jsonl" 2> "$gate_dir/$label.build.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$gate_dir/$label.build.exit"
            cat "$gate_dir/$label.build.stderr"
            return "$status"
          }
          run_clean() {
            label="$1"; manifest="$2"
            set +e
            cargo -Vv > "$gate_dir/$label.clean.cargo.txt" 2> "$gate_dir/$label.clean.cargo.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$gate_dir/$label.clean.cargo.exit"
            if [ "$status" -ne 0 ]; then return "$status"; fi
            if ! cmp -s "$gate_dir/cargo.txt" "$gate_dir/$label.clean.cargo.txt"; then
              printf '%s\n' 'Native Cargo version changed before selected workspace retirement; comparison unavailable' >&2
              return 1
            fi
            python3 - "$gate_dir" "$label" "$manifest" "$CARGO_TARGET_DIR" <<'PYCLEAN'
          from pathlib import Path
          import json,sys
          p=Path(sys.argv[1]);label,manifest,target=sys.argv[2:5]
          with (p/(label+'.clean.command.json')).open('x') as out:out.write(json.dumps({'argv':['cargo','clean','--locked','--manifest-path',manifest,'--workspace'],'cwd':str(Path.cwd().resolve()),'CARGO_TARGET_DIR':target,'native_version_basis':str(p/(label+'.clean.cargo.txt')),'scope':'Native workspace-member artifacts only; same target. Private images retained before the next phase; no manual target/registry removal.'},indent=2)+'\n')
          PYCLEAN
            set +e
            cargo clean --locked --manifest-path "$manifest" --workspace > "$gate_dir/$label.clean.stdout" 2> "$gate_dir/$label.clean.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$gate_dir/$label.clean.exit"
            cat "$gate_dir/$label.clean.stdout" "$gate_dir/$label.clean.stderr"
            return "$status"
          }
          retain_artifact() {
            label="$1"; role="$2"; target="$3"; cwd="$4"; source="$5"; test_profile="$6"
            python3 - "$gate_dir" "$label" "$role" "$target" "$cwd" "$source" "$test_profile" <<'PYBIN'
          from pathlib import Path
          import hashlib,json,os,stat,sys
          p=Path(sys.argv[1]);label,role,target,cwd,head=sys.argv[2:7];test=sys.argv[7]=='true'
          if (p/(label+'.build.exit')).read_text().strip()!='0':raise SystemExit('Compilation failure is not a semantic comparison')
          rows=[json.loads(x) for x in (p/(label+'.build.jsonl')).read_text().splitlines() if x.startswith('{')]
          art=[x for x in rows if x.get('reason')=='compiler-artifact' and x.get('target',{}).get('name')==target and x.get('profile',{}).get('test')==test and x.get('executable')]
          if len(art)!=1:raise SystemExit(f'One actual CompilerArtifact required: {role} count={len(art)}')
          a=art[0];exe=Path(a['executable']);fd=None
          def basis(m):
              mt=divmod(m.st_mtime_ns,1_000_000_000);ct=divmod(m.st_ctime_ns,1_000_000_000)
              return {'dev':m.st_dev,'ino':m.st_ino,'mode':m.st_mode,'nlink':m.st_nlink,'bytes':m.st_size,'mtime_seconds':mt[0],'mtime_nanoseconds':mt[1],'ctime_seconds':ct[0],'ctime_nanoseconds':ct[1]}
          def record(name,value):
              flags=os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC
              with os.fdopen(os.open(p/name,flags,0o600),'w') as out:out.write(json.dumps(value,indent=2)+'\n')
          observed={'schema':'aikit.actual-compiler-original-observation/v3','label':label,'role':role,'source_head':head,'source_root':cwd,'original_executable':str(exe),'compiler_artifact':a,'source_affiliated':Path(a['target']['src_path']).is_relative_to(Path(cwd)),'target_affiliated':exe.is_absolute() and exe.is_relative_to(Path(os.environ['CARGO_TARGET_DIR'])),'target_kind':a['target'].get('kind'),'named_before':None,'held_before':None,'held_digest':{'contract':'held_regular_before_semantic_guards/v4','available':False,'sha256':None,'observed_bytes':0,'read_limit_bytes':None,'before':None,'after':None,'named_after':None,'refusal':None,'cause':None}}
          try:
              m=exe.lstat();observed['named_before']=basis(m)
              fd=os.open(exe,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK|os.O_CLOEXEC)
              held=os.fstat(fd);observed['held_before']=basis(held)
          except OSError as cause:
              observed['original_io']={'type':type(cause).__name__,'errno':cause.errno,'message':str(cause)}
              observed['held_digest']['cause']=observed['original_io']
              record(role+'.original-before.json',observed)
              if fd is not None:os.close(fd)
              raise
          try:
              fact=observed['held_digest'];read_error=None
              # Only safe ordinary originals under the actual declared routing may be read.
              # Role/freshness rejection must still retain this checked actual byte fact.
              if not observed['source_affiliated'] or not observed['target_affiliated']:
                  fact['refusal']='outside_declared_compiler_source_or_target';permitted=False
              elif not stat.S_ISREG(m.st_mode) or not stat.S_ISREG(held.st_mode) or held.st_nlink<1 or basis(m)!=basis(held):
                  fact['refusal']='not_same_held_linked_regular_original';permitted=False
              else:
                  try:
                      target_root=Path(os.environ['CARGO_TARGET_DIR']);source_root=Path(cwd);src=Path(a['target']['src_path'])
                      fact['physical_original']=str(exe.resolve(strict=True));fact['physical_target']=str(target_root.resolve(strict=True))
                      permitted=(target_root.is_absolute() and target_root.resolve(strict=True)==target_root and exe.resolve(strict=True)==exe
                          and source_root.is_absolute() and source_root.resolve(strict=True)==source_root and src.is_absolute()
                          and src.resolve(strict=True).is_relative_to(source_root))
                      if not permitted:fact['refusal']='redirected_or_unaffiliated_physical_compiler_routing'
                  except (OSError,RuntimeError) as cause:
