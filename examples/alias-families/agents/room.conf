# agents room config — source'd by ~/.local/bin/agents
# Edit to grow your command family. No key material belongs in this file.

# The room's name (also the tmux session name and the herdr workspace label).
AGENTS_ROOM="agents"

# Where agent panes start.
AGENTS_CWD="$HOME"

# Provider: auto (herdr first, tmux fallback) | herdr | tmux
AGENTS_PROVIDER="auto"

# Room slots: "name kind [cwd]" — kind is the herdr agent kind and the
# command launched on the tmux path. Add a line to add an agent to the room.
AGENTS_SLOTS=(
  "pi pi"
  "hermes hermes"
  "codex codex"
)
