[package]
name = "aikit-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AIKit adapters: multiplexers (tmux, cmux, plain), agent clients (Claude Code, Codex, broker), shells."

[dependencies]
tempfile = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
aikit-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
pulldown-cmark = { version = "=0.13.4", default-features = false }
toml = { workspace = true }
thiserror = { workspace = true }
shell-words = { workspace = true }
jiff = { workspace = true }
blake3 = { workspace = true }
keyring = { workspace = true }
sha2 = { workspace = true }
# The gateway service holds an advisory lock on its state file for its whole
# lifetime so an offline writer can never interleave with a running service.
fs4 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }


[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }
