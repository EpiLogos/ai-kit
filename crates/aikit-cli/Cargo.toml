[package]
name = "aikit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The aikit binary: CLI contract, JSON envelope, multicall shim dispatch, TUI host."

[features]
# Opt in only on a host with the user's real Codex ChatGPT login. The mandatory
# credential-free CAW native lane runs every ignored test in its target.
codex-account-native = []

[[bin]]
name = "aikit"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
aikit-core = { workspace = true }
aikit-store = { workspace = true }
aikit-adapters = { workspace = true }
aikit-tui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
jiff = { workspace = true }
shell-words = { workspace = true }
similar = { workspace = true }
walkdir = { workspace = true }
blake3 = { workspace = true }
ulid = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
crossterm = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
ratatui = { workspace = true }
# The configuration-plane contribution is validated against the frozen C0
# JSON Schema (vendored at tests/fixtures/) exactly as O:I will validate it.
jsonschema = { version = "0.30", default-features = false, features = ["resolve-file"] }
